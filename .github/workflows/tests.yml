name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: fssai-ra/pyproject.toml

      - name: Install teaching profile
        working-directory: fssai-ra
        run: python -m pip install -e ".[dev]"

      - name: Compile package
        working-directory: fssai-ra
        run: python -m compileall -q src tests examples

      - name: Run deterministic tests
        working-directory: fssai-ra
        run: python -m pytest -q

      - name: Validate citation metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          for path in (Path("CITATION.cff"), Path("fssai-ra/CITATION.cff")):
              citation = yaml.safe_load(path.read_text(encoding="utf-8"))
              assert citation["cff-version"] == "1.2.0"
              assert citation["version"] == "0.5.0"
              assert citation["license"] == "Apache-2.0"
              print(f"{path} is valid YAML and matches the release")
          PY
