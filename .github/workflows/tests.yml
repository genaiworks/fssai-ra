name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: fssai-ra/pyproject.toml

      - name: Install
        working-directory: fssai-ra
        run: python -m pip install -e ".[dev,privacy,api]"

      - name: Compile
        working-directory: fssai-ra
        run: python -m compileall -q src tests examples jobs scripts

      - name: Deterministic test suite
        working-directory: fssai-ra
        run: python -m pytest

  assurance:
    name: Assurance artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          {
            python-version: "3.13",
            cache: pip,
            cache-dependency-path: fssai-ra/pyproject.toml,
          }

      - name: Install
        working-directory: fssai-ra
        run: python -m pip install -e ".[dev,privacy,api]"

      # These four are the repository's own claims, checked on every commit.
      # A failure here means a public claim has stopped being true.
      - name: Control contract is complete
        working-directory: fssai-ra
        run: python -m fssaira.cli validate-contract contract

      # Completeness is not enforcement. This one fails if any requirement
      # describes a failure test and binds it to nothing, which is how a
      # governance claim stops being true without anything going red.
      - name: Every contract requirement is bound to a check or attested
        working-directory: fssai-ra
        run: python -m fssaira.cli coverage

      - name: Authority invariants hold under bounded model checking
        working-directory: fssai-ra
        run: python -m fssaira.cli verify profiles/student_support.yaml

      - name: Adversarial, utility, and ablation suite
        working-directory: fssai-ra
        run: python -m fssaira.cli evaluate profiles/student_support.yaml

      - name: Delegated authority holds under chain verification
        working-directory: fssai-ra
        run: python -m fssaira.cli delegation

      - name: The assisted-review gate refuses an undeclared lowered floor
        working-directory: fssai-ra
        run: python -m fssaira.cli assisted-review profiles/student_support.yaml

      - name: Conformance on both backend profiles
        working-directory: fssai-ra
        run: |
          python -m fssaira.cli conformance --backend memory --profile profiles/student_support.yaml
          python -m fssaira.cli conformance --backend sql --profile profiles/student_support.yaml

      # The lifecycle gates, run against the repository itself. Each exits
      # non-zero when a gate fails: an empty contract field or a missing named
      # test, a credential reachable from the untrusted side, or a falsifier
      # counterexample (or a positive control that finds nothing).
      - name: "Lifecycle 2: contract complete, named tests exist, no unverified claim"
        working-directory: fssai-ra
        run: python -m fssaira.cli contract contract --gate

      - name: "Lifecycle 4: no model holds a key or credential"
        working-directory: fssai-ra
        run: python -m fssaira.cli bind

      - name: "Lifecycle 5: falsifiers find zero counterexamples; ablations restore harm"
        working-directory: fssai-ra
        run: python -m fssaira.cli falsify

      - name: Committed results have not drifted
        working-directory: fssai-ra
        run: python scripts/generate_results.py --check

      - name: Independent-process races and abrupt-exit recovery
        working-directory: fssai-ra
        run: python scripts/check_resilience.py

      - name: Generated OpenAPI contract has not drifted
        working-directory: fssai-ra
        run: |
          python scripts/export_openapi.py
          git diff --exit-code -- docs/openapi.json

      - name: Reference Compose topology is valid
        working-directory: fssai-ra
        run: |
          python scripts/bootstrap_dev_env.py
          docker compose --env-file deploy/.env -f deploy/compose.yaml config --quiet

      - name: Upload assurance artifacts
        uses: actions/upload-artifact@v6
        with:
          name: assurance-results
          path: fssai-ra/evaluation/results/
          retention-days: 30

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: "3.13" }
      - run: python -m pip install ruff
      - name: Ruff
        working-directory: fssai-ra
        run: ruff check src tests scripts jobs adapters

  package:
    name: Build and install package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          {
            python-version: "3.14",
            cache: pip,
            cache-dependency-path: fssai-ra/pyproject.toml,
          }
      - run: python -m pip install build
      - name: Build source and wheel distributions
        working-directory: fssai-ra
        run: python -m build
      - name: Install the wheel and exercise its entry point
        working-directory: fssai-ra
        run: |
          python -m venv /tmp/fssaira-wheel
          /tmp/fssaira-wheel/bin/python -m pip install dist/*.whl
          /tmp/fssaira-wheel/bin/fssaira --help

  python-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          {
            python-version: "3.14",
            cache: pip,
            cache-dependency-path: fssai-ra/pyproject.toml,
          }
      - name: Install the tested dependency surface
        working-directory: fssai-ra
        run: python -m pip install -e ".[dev,privacy,api]" pip-audit
      - name: Audit published dependencies
        working-directory: fssai-ra
        run: python -m pip_audit

  console:
    name: Console
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          {
            node-version: "22",
            cache: npm,
            cache-dependency-path: fssai-ra/console/package-lock.json,
          }
      - name: Install
        working-directory: fssai-ra/console
        run: npm ci --no-audit --no-fund
      - name: Dependency audit
        working-directory: fssai-ra/console
        run: npm audit --audit-level=high
      - name: Typecheck and build
        working-directory: fssai-ra/console
        run: npm run build
      - name: Render smoke check
        working-directory: fssai-ra/console
        run: npm run smoke

  metadata:
    name: Citation and release metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: "3.13" }
      - run: python -m pip install pyyaml tomli
      - name: Public documentation links resolve in a clean checkout
        run: python fssai-ra/scripts/check_public_docs.py

      - name: Versions agree across the repository
        run: |
          python - <<'PY'
          import re, tomllib
          from pathlib import Path
          import yaml

          pyproject = tomllib.loads(Path("fssai-ra/pyproject.toml").read_text())
          version = pyproject["project"]["version"]
          source = Path("fssai-ra/src/fssaira/__init__.py").read_text()
          assert f'__version__ = "{version}"' in source, "__init__.py version disagrees with pyproject"

          for path in (Path("CITATION.cff"), Path("fssai-ra/CITATION.cff")):
              citation = yaml.safe_load(path.read_text(encoding="utf-8"))
              assert citation["cff-version"] == "1.2.0", path
              assert citation["version"] == version, f"{path} says {citation['version']}, expected {version}"
              assert citation["license"] == "Apache-2.0", path
              print(f"{path} ✓ {version}")

          citations = [yaml.safe_load(path.read_text(encoding="utf-8")) for path in
                       (Path("CITATION.cff"), Path("fssai-ra/CITATION.cff"))]
          assert citations[0] == citations[1], "software citation copies disagree"
          assert citations[0]["type"] == "software"
          assert "preferred-citation" not in citations[0], "cite papers separately"
          print(f"all metadata agrees on {version}")
          PY

  docker-reproduction:
    name: Offline Docker reproduction
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Build pinned research environment
        run: make docker-setup
      - name: Reproduce public tests and evidence without network access
        run: make docker-verify
      - name: Preserve evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-reproduction-evidence
          path: fssai-ra/work/reproduction-*/
          if-no-files-found: warn
      - name: Verify evidence bundle integrity
        run: |
          docker compose run --rm research sh -c 'for bundle in work/reproduction-*; do python scripts/verify_bundle.py "$bundle" || exit 1; done'
