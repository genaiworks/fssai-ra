name: Security systems community artifacts
on:
  push:
    paths: ['security_systems/**', '.github/workflows/security-systems.yml']
  pull_request:
    paths: ['security_systems/**', '.github/workflows/security-systems.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.14']
    defaults:
      run:
        working-directory: security_systems
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install -c requirements-conference.txt -e '.[dev]'
      - run: make lint PYTHON=python
      - run: make test PYTHON=python
      - run: make community PYTHON=python
      - run: make rehearsal PYTHON=python
      - uses: actions/upload-artifact@v4
        with:
          name: terminal-rehearsal-python-${{ matrix.python }}
          path: security_systems/evidence/rehearsal/
