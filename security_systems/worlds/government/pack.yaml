# Public Benefits: the government domain pack. Every claimant and value is synthetic.
#
# Casework agents gather evidence and draft determinations. The kernel lets them propose;
# only an eligibility officer changes a benefit level, every adverse decision can be
# appealed to a human, eligibility data cannot be repurposed for fraud scoring, and
# disability assessments never reach an intake chatbot. Every control contract cites a
# pack-derived test in tests/test_contracts.py.
profile_id: public-benefits-government
version: '1.0'
title: Public Benefits (government pack)
resource_name: benefit_determination
owner: program_director
manual_fallback: Leave the benefit unchanged, keep payments flowing at the current level, and route the case to
  a staffed caseworker.
governance:
  domain: public-sector
  purpose: Let casework agents gather evidence, summarize files, and draft determinations while holding no authority
    of their own, on synthetic claimants only.
  applicable_frameworks:
  - 'Public-sector privacy law: purpose specification and no secondary use'
  - 'Due process: notice, a human decision-maker, and a right to appeal adverse determinations'
  - Separation between eligibility determination and fraud investigation
  prohibited_uses:
  - An agent reducing or terminating a benefit without an eligibility officer
  - Using eligibility data for fraud scoring or debt collection without a lawful basis
  - Disclosing disability assessments or fraud referrals to an intake chatbot
  - Selling or sharing claimant data with data brokers
  processing_basis: Eligibility determination, case management, appeals, and program reporting on synthetic claimants.
  data_minimization_rule: Release only the fields the stated purpose needs, for the named claimants, to the named
    holder, for a bounded time.
  retention_rule: Retain decision evidence for the declared appeal and audit period; working copies only for the
    session that needed them.
  deletion_rule: Erase a claimant on a valid request by destroying the claimant's data keys; keep digests and surrogate
    identifiers only.
  residency_rule: Identity, disability, investigation, and payment data stay on agency infrastructure; eligibility
    data may use an approved government cloud.
  incident_response: Freeze automated determinations, keep current payments flowing, preserve evidence, and page
    the program director and privacy officer.
  deployment_profile: reference
  data_classes: &id001
  - citizen-identity
  - eligibility-record
  - disability-health
  - investigation-restricted
  - benefit-financial
  - program-statistics
  owners:
    data: program_director
    privacy: privacy_officer
    security: privacy_officer
identity_fields:
  claimant_name: CLAIMANT_NAME
  national_id: NATIONAL_ID
  mailing_address: ADDRESS
disclosure:
  subject_kind: claimant
  purposes:
  - eligibility-determination
  - case-management
  - appeals
  - fraud-review
  - program-reporting
  - welfare-emergency
  fields:
    claimant_name:
      class: citizen-identity
    national_id:
      class: citizen-identity
    mailing_address:
      class: citizen-identity
    household_size:
      class: eligibility-record
    income_band:
      class: eligibility-record
    employment_history:
      class: eligibility-record
    disability_assessment:
      class: disability-health
    fraud_referral_notes:
      class: investigation-restricted
    benefit_payments:
      class: benefit-financial
  model_endpoints:
    agency_local_model: agency-private
    agency_local_model_b: agency-private
    approved_gov_cloud_model: approved-gov-cloud
    public_chat_api: external
  class_zones:
    citizen-identity:
    - agency-private
    eligibility-record:
    - agency-private
    - approved-gov-cloud
    disability-health:
    - agency-private
    investigation-restricted:
    - agency-private
    benefit-financial:
    - agency-private
    program-statistics:
    - agency-private
    - approved-gov-cloud
  recipients:
    caseworker:
      classes:
      - citizen-identity
      - eligibility-record
      - disability-health
      - benefit-financial
      purposes:
      - eligibility-determination
      - case-management
      - welfare-emergency
      zone: agency-private
    intake_chatbot:
      classes:
      - eligibility-record
      purposes:
      - eligibility-determination
      - case-management
      zone: agency-private
    appeals_board:
      classes:
      - citizen-identity
      - eligibility-record
      - disability-health
      purposes:
      - appeals
      zone: agency-private
    fraud_unit:
      classes:
      - citizen-identity
      - eligibility-record
      - investigation-restricted
      - benefit-financial
      purposes:
      - fraud-review
      zone: agency-private
    claimant_portal:
      classes:
      - citizen-identity
      - eligibility-record
      - benefit-financial
      purposes:
      - case-management
      zone: agency-private
      subject_scope: self
    statistics_office:
      classes:
      - program-statistics
      purposes:
      - program-reporting
      zone: approved-gov-cloud
    external_data_broker:
      classes: []
      purposes: []
      zone: external
  declassification:
  - name: publish_program_statistics
    from_classes:
    - eligibility-record
    to_class: program-statistics
    purposes:
    - program-reporting
    approval_role: statistics_officer
    removes_subject_identity: true
  break_glass:
    purposes:
    - welfare-emergency
    max_ttl_seconds: 1800
    max_unreviewed_per_holder: 1
    review_role: benefits_supervisor
