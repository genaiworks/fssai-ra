- operation: set_benefit_level
  from_status: level:basic
  to_status: level:none
  consequential: true
  approval_role: eligibility_officer
- operation: set_benefit_level
  from_status: level:basic
  to_status: level:standard
  consequential: true
  approval_role: eligibility_officer
- operation: set_benefit_level
  from_status: level:basic
  to_status: level:enhanced
  consequential: true
  approval_role: eligibility_officer
- operation: set_benefit_level
  from_status: level:standard
  to_status: level:none
  consequential: true
  approval_role: eligibility_officer
- operation: set_benefit_level
  from_status: level:standard
  to_status: level:basic
  consequential: true
  approval_role: eligibility_officer
- operation: set_benefit_level
  from_status: level:standard
  to_status: level:enhanced
  consequential: true
  approval_role: eligibility_officer
- operation: set_benefit_level
  from_status: level:enhanced
  to_status: level:none
  consequential: true
  approval_role: eligibility_officer
- operation: set_benefit_level
  from_status: level:enhanced
  to_status: level:basic
  consequential: true
  approval_role: eligibility_officer
- operation: set_benefit_level
