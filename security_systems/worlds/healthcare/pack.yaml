  consequential: true
  approval_role: attending_physician
- operation: set_medication_dose
  from_status: dose:7.5mg
  to_status: dose:2.5mg
  consequential: true
  approval_role: attending_physician
- operation: set_medication_dose
  from_status: dose:7.5mg
  to_status: dose:5mg
  consequential: true
  approval_role: attending_physician
- operation: set_medication_dose
  from_status: dose:7.5mg
  to_status: dose:10mg
  consequential: true
  approval_role: attending_physician
- operation: set_medication_dose
  from_status: dose:10mg
