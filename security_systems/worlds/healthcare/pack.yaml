# Clinical Care: the healthcare domain pack. Every patient and value is synthetic.
#
# Agents summarize charts, reconcile medications, and draft orders. The kernel lets them
# propose; only the attending physician changes a dose, only the care team sees
# psychotherapy notes, genetics stays with the genetics clinic, and nothing identifying
# leaves the hospital. Every control contract cites a pack-derived test in
# tests/test_contracts.py, so this domain is governed with no Python written for it.
profile_id: clinical-care-healthcare
version: '1.0'
title: Clinical Care (healthcare pack)
resource_name: clinical_order
owner: chief_medical_officer
manual_fallback: Leave the order unchanged, page the attending physician, and route the request to the staffed clinical
  desk.
governance:
  domain: healthcare
  purpose: Let clinical agents summarize charts, reconcile medications, and draft orders while holding no authority
    of their own, on synthetic patients only.
  applicable_frameworks:
  - 'Health-record privacy law: minimum necessary, treatment/payment/operations purposes'
  - Heightened protection for psychotherapy notes and genetic information
  - Medication-order verification and clinical separation of duties
  prohibited_uses:
  - An agent changing a medication order without the attending physician
  - Sending psychotherapy, genetic, or identity data to an external model or recipient
  - Using patient data for marketing or insurance underwriting
  - Releasing results to a patient before a clinician has reviewed them
  processing_basis: Treatment, care coordination, payment, and quality operations on synthetic patients.
  data_minimization_rule: Release only the fields the stated purpose needs, for the named patients, to the named
    holder, for a bounded time.
  retention_rule: Retain decision evidence for the declared medical-record period; working copies only for the session
    that needed them.
  deletion_rule: Erase a patient on a valid request by destroying the patient's data keys; keep digests and surrogate
    identifiers only.
  residency_rule: Identity, behavioral health, genetic, and billing data stay on hospital infrastructure; clinical
    data may use an approved health cloud.
  incident_response: Freeze automated orders, preserve evidence, page the privacy officer and the attending physician,
    and route open work to staffed handling.
  deployment_profile: reference
  data_classes: &id001
  - patient-identity
  - clinical-record
  - behavioral-health
  - genetic-restricted
  - billing-financial
  - deidentified-quality
  owners:
    data: chief_medical_officer
    privacy: privacy_officer
    security: privacy_officer
identity_fields:
  patient_name: PATIENT_NAME
  mrn: MRN
  insurance_member_id: MEMBER_ID
disclosure:
  subject_kind: patient
  purposes:
  - treatment
  - care-coordination
  - billing
  - quality-improvement
  - patient-access
  - emergency-care
  fields:
    patient_name:
      class: patient-identity
    mrn:
      class: patient-identity
    insurance_member_id:
      class: patient-identity
    vitals:
      class: clinical-record
    lab_results:
      class: clinical-record
    medication_list:
      class: clinical-record
    psychotherapy_notes:
      class: behavioral-health
    genetic_panel:
      class: genetic-restricted
    billing_codes:
      class: billing-financial
  model_endpoints:
    hospital_local_model: hospital-private
    hospital_local_model_b: hospital-private
    approved_health_cloud_model: approved-health-cloud
    public_chat_api: external
  class_zones:
    patient-identity:
    - hospital-private
    clinical-record:
    - hospital-private
    - approved-health-cloud
    behavioral-health:
    - hospital-private
    genetic-restricted:
    - hospital-private
    billing-financial:
    - hospital-private
    deidentified-quality:
    - hospital-private
    - approved-health-cloud
  recipients:
    care_team:
      classes:
      - patient-identity
      - clinical-record
      - behavioral-health
      purposes:
      - treatment
      - care-coordination
      - emergency-care
      zone: hospital-private
    nurse_station_chat:
      classes:
      - clinical-record
      purposes:
      - treatment
      - care-coordination
      zone: hospital-private
    genetics_clinic:
      classes:
      - patient-identity
      - clinical-record
      - genetic-restricted
      purposes:
      - treatment
      zone: hospital-private
    billing_office:
      classes:
      - patient-identity
      - billing-financial
      purposes:
      - billing
      zone: hospital-private
    patient_portal:
      classes:
      - patient-identity
      - clinical-record
      - billing-financial
      purposes:
      - patient-access
      zone: hospital-private
      subject_scope: self
    quality_registry:
      classes:
      - deidentified-quality
      purposes:
      - quality-improvement
      zone: approved-health-cloud
    external_fax:
      classes: []
      purposes: []
      zone: external
  declassification:
  - name: deidentify_for_quality
    from_classes:
    - clinical-record
    to_class: deidentified-quality
    purposes:
    - quality-improvement
    approval_role: quality_officer
    removes_subject_identity: true
  break_glass:
    purposes:
    - emergency-care
    max_ttl_seconds: 1800
    max_unreviewed_per_holder: 1
    review_role: privacy_officer
