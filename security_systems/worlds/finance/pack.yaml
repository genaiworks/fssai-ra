# Retail Banking: the finance domain pack. Every customer and value is synthetic.
#
# Fraud and servicing agents investigate alerts and draft decisions. The kernel lets them
# propose; only a credit officer changes a limit, only a payments officer releases a wire,
# SAR case notes never leave the AML unit (no tipping off), and credit files never reach a
# servicing chat. Every control contract cites a pack-derived test in tests/test_contracts.py.
profile_id: retail-banking-finance
version: '1.0'
title: Retail Banking (finance pack)
resource_name: account_decision
owner: chief_risk_officer
manual_fallback: Leave the account unchanged, hold any pending payment, and route the case to the staffed fraud
  desk.
governance:
  domain: financial-services
  purpose: Let fraud and servicing agents investigate alerts, summarize accounts, and draft decisions while holding
    no authority of their own, on synthetic customers only.
  applicable_frameworks:
  - Consumer financial privacy law and purpose limitation
  - Anti-money-laundering rules, including confidentiality of suspicious activity reports
  - Credit decisioning, adverse-action, and model-risk management requirements
  prohibited_uses:
  - An agent changing a credit limit or releasing a wire without the named officer
  - Disclosing suspicious-activity case notes to anyone outside the AML unit (tipping off)
  - Using credit files for cross-sell marketing
  - Sending identity, KYC, or credit data to an external model or partner
  processing_basis: Fraud investigation, credit decisions, servicing, AML compliance, and risk reporting on synthetic
    customers.
  data_minimization_rule: Release only the fields the stated purpose needs, for the named customers, to the named
    holder, for a bounded time.
  retention_rule: Retain decision evidence for the declared regulatory period; working copies only for the session
    that needed them.
  deletion_rule: Erase a customer on a valid request by destroying the customer's data keys; keep digests and surrogate
    identifiers only.
  residency_rule: Identity, KYC, credit, and AML data stay on bank infrastructure; account activity may use an approved
    financial cloud.
  incident_response: Freeze automated decisions, hold pending payments, preserve evidence, and page fraud operations
    and compliance.
  deployment_profile: reference
  data_classes: &id001
  - customer-identity
  - account-activity
  - credit-financial
  - kyc-pii
  - sar-restricted
  - aggregate-risk
  owners:
    data: chief_risk_officer
    privacy: data_protection_officer
    security: aml_officer
identity_fields:
  customer_name: CUSTOMER_NAME
  tax_id: TAX_ID
  account_ref: ACCOUNT_REF
disclosure:
  subject_kind: customer
  purposes:
  - fraud-investigation
  - credit-decision
  - customer-service
  - aml-compliance
  - risk-reporting
  - fraud-emergency-freeze
  fields:
    customer_name:
      class: customer-identity
    tax_id:
      class: customer-identity
    account_ref:
      class: customer-identity
    txn_velocity:
      class: account-activity
    balance_band:
      class: account-activity
    merchant_mix:
      class: account-activity
    credit_file:
      class: credit-financial
    kyc_documents:
      class: kyc-pii
    sar_case_notes:
      class: sar-restricted
  model_endpoints:
    bank_local_model: bank-private
    bank_local_model_b: bank-private
    approved_fin_cloud_model: approved-fin-cloud
    public_chat_api: external
  class_zones:
    customer-identity:
    - bank-private
    account-activity:
    - bank-private
    - approved-fin-cloud
    credit-financial:
    - bank-private
    kyc-pii:
    - bank-private
    sar-restricted:
    - bank-private
    aggregate-risk:
    - bank-private
    - approved-fin-cloud
  recipients:
    fraud_ops:
      classes:
      - customer-identity
      - account-activity
      - credit-financial
      - kyc-pii
      purposes:
      - fraud-investigation
      - fraud-emergency-freeze
      zone: bank-private
    servicing_chat:
      classes:
      - account-activity
      purposes:
      - fraud-investigation
      - customer-service
      zone: bank-private
    credit_committee:
      classes:
      - customer-identity
      - account-activity
      - credit-financial
      purposes:
      - credit-decision
      zone: bank-private
    aml_unit:
      classes:
      - customer-identity
      - account-activity
      - kyc-pii
      - sar-restricted
      purposes:
      - aml-compliance
      zone: bank-private
    customer_app:
      classes:
      - customer-identity
      - account-activity
      purposes:
      - customer-service
      zone: bank-private
      subject_scope: self
    risk_dashboard:
      classes:
      - aggregate-risk
      purposes:
      - risk-reporting
      zone: approved-fin-cloud
    external_partner_api:
      classes: []
      purposes: []
      zone: external
  declassification:
  - name: aggregate_for_risk_reporting
    from_classes:
    - account-activity
    to_class: aggregate-risk
    purposes:
    - risk-reporting
    approval_role: chief_risk_officer
    removes_subject_identity: true
  break_glass:
    purposes:
    - fraud-emergency-freeze
    max_ttl_seconds: 1800
    max_unreviewed_per_holder: 1
    review_role: aml_officer
