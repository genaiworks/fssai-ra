controls:
  set_credit_limit:
    protected_asset: A customer's credit limit
    permitted_operation: Change one customer's limit at the reviewed account version, signed by a credit officer
    enforcement_point: execution_mediator
    owner: credit_officer
    failure_test: tests/test_contracts.py::test_consequential_transitions_need_their_declared_human_role
    evidence_artifact: Signed execution receipt binding proposal digest, approval, and ledger checkpoint
    failure_response: Deny, record the refusal, and escalate to the named owner
  release_wire:
    protected_asset: An outbound wire transfer
    permitted_operation: A payments officer releases one exact held wire
    enforcement_point: execution_mediator
    owner: payments_officer
    failure_test: tests/test_contracts.py::test_consequential_transitions_need_their_declared_human_role
    evidence_artifact: Signed execution receipt naming the approver and the proposal digest
    failure_response: Deny and route the request to staffed handling
  file_sar:
    protected_asset: A suspicious activity report
    permitted_operation: The AML officer files one exact report
    enforcement_point: execution_mediator
    owner: aml_officer
    failure_test: tests/test_contracts.py::test_consequential_transitions_need_their_declared_human_role
    evidence_artifact: Signed execution receipt naming the approver and the proposal digest
    failure_response: Deny and route the request to staffed handling
  approve_risk_report:
    protected_asset: Aggregated risk data leaving the bank
    permitted_operation: The chief risk officer approves one exact aggregated output
    enforcement_point: execution_mediator
    owner: chief_risk_officer
    failure_test: tests/test_contracts.py::test_declassification_needs_exact_approval
    evidence_artifact: Declassification approval bound to the exact output digest
    failure_response: Deny and keep the output at its original label
  review_break_glass:
    protected_asset: Emergency access to credit files
    permitted_operation: The AML officer reviews one emergency access after the fact
    enforcement_point: context_gate
    owner: aml_officer
    failure_test: tests/test_contracts.py::test_break_glass_opens_a_review_obligation
    evidence_artifact: Break-glass review record naming holder and reviewer
    failure_response: Refuse further emergency access by the holder until reviewed
  read_protected_context:
    protected_asset: Records placed into a model context
    permitted_operation: A holder reads named fields of named subjects for a declared purpose
    enforcement_point: context_gate
    owner: data_protection_officer
    failure_test: tests/test_contracts.py::test_protected_reads_are_granted_minimal_and_purpose_bound
    evidence_artifact: Disclosure intent and outcome records with digests, never values
    failure_response: Deny, release nothing, and record the refusal code
  release_labelled_output:
    protected_asset: A model output derived from protected records
    permitted_operation: Release to a recipient whose clearance dominates the output label
    enforcement_point: release_gate
    owner: data_protection_officer
    failure_test: tests/test_contracts.py::test_labelled_output_cannot_be_released_or_laundered
    evidence_artifact: Release receipt with the output label
    failure_response: Deny the release and keep the output labelled
  restore_identity:
    protected_asset: The link between a token and a real person
    permitted_operation: Restore identity only for a recipient cleared for identity fields
    enforcement_point: release_gate
    owner: data_protection_officer
    failure_test: tests/test_contracts.py::test_identity_reaches_models_only_as_tokens
    evidence_artifact: Identity restoration record naming the release receipt
    failure_response: Release tokens only and record the refusal
  delegate_authority:
    protected_asset: Authority passed from one agent to another
    permitted_operation: Delegate an equal or narrower slice for the same purpose and a shorter time
    enforcement_point: delegation_verifier
    owner: aml_officer
    failure_test: tests/test_contracts.py::test_delegated_authority_only_narrows
    evidence_artifact: Verified grant chain with the effective scope
    failure_response: Refuse the chain and record the escalation attempt
  erase_subject:
    protected_asset: Every governed copy of one subject's data
    permitted_operation: The data protection owner erases a subject by destroying the subject's keys
    enforcement_point: key_custody
    owner: data_protection_officer
    failure_test: tests/test_contracts.py::test_erasure_reaches_every_governed_copy
    evidence_artifact: Erasure certificate and a read-back verification of every governed copy
    failure_response: Report every readable location and keep the request open
