  to_status: limit:5k
  consequential: true
  approval_role: credit_officer
- operation: set_credit_limit
  from_status: limit:10k
  to_status: limit:25k
  consequential: true
  approval_role: credit_officer
- operation: set_credit_limit
  from_status: limit:10k
  to_status: limit:50k
  consequential: true
  approval_role: credit_officer
- operation: set_credit_limit
  from_status: limit:25k
  to_status: limit:5k
  consequential: true
  approval_role: credit_officer
- operation: set_credit_limit
  from_status: limit:25k
  to_status: limit:10k
  consequential: true
  approval_role: credit_officer
- operation: set_credit_limit
  from_status: limit:25k
  to_status: limit:50k
  consequential: true
  approval_role: credit_officer
- operation: set_credit_limit
  from_status: limit:50k
  to_status: limit:5k
  consequential: true
  approval_role: credit_officer
- operation: set_credit_limit
  from_status: limit:50k
  to_status: limit:10k
  consequential: true
  approval_role: credit_officer
- operation: set_credit_limit
