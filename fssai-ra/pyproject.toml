[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fssaira"
version = "1.0.0"
description = "Trust by Construction: a runnable, extensible reference implementation for bounded, accountable, governed agentic AI."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "R. Srivastava" }]
keywords = [
  "agentic-ai", "ai-governance", "zero-trust", "data-diode", "sovereign-ai",
  "fail-secure", "reference-architecture", "digital-public-good",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["pyyaml>=6.0"]

[project.urls]
Homepage = "https://github.com/genaiworks/fssai-ra"
Documentation = "https://github.com/genaiworks/fssai-ra/blob/main/fssai-ra/docs/README.md"
Repository = "https://github.com/genaiworks/fssai-ra"
Issues = "https://github.com/genaiworks/fssai-ra/issues"

[project.scripts]
fssaira = "fssaira.cli:main"

[project.optional-dependencies]
privacy = ["cryptography>=43.0"]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "httpx>=0.27", "httpx2>=2.0"]
redis = ["redis>=5.0"]
postgres = ["psycopg[binary]>=3.2"]
kafka = ["confluent-kafka>=2.6"]
iceberg = ["pyiceberg>=0.9", "pyarrow>=17.0"]
# Matches the analytics image (Spark 3.5.1 / Scala 2.12); a newer client would
# test locally against a different engine than production runs.
spark = ["pyspark>=3.5.1,<3.6"]
auth = ["pyjwt[crypto]>=2.9"]
telemetry = [
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-http>=1.27",
  "opentelemetry-instrumentation-fastapi>=0.48b0",
]
# Everything the reference deployment runs in Docker.
platform = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "httpx>=0.27", "httpx2>=2.0",
  "redis>=5.0", "psycopg[binary]>=3.2", "confluent-kafka>=2.6", "pyjwt[crypto]>=2.9",
]
# Everything, for a developer who wants every path available locally.
all = [
  "cryptography>=43.0",
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "httpx>=0.27", "httpx2>=2.0",
  "redis>=5.0", "psycopg[binary]>=3.2", "confluent-kafka>=2.6",
  "pyiceberg>=0.9", "pyarrow>=17.0", "pyspark>=3.5.1,<3.6", "pyjwt[crypto]>=2.9",
  "opentelemetry-sdk>=1.27", "opentelemetry-exporter-otlp-proto-http>=1.27",
  "opentelemetry-instrumentation-fastapi>=0.48b0",
]
dev = [
  "pytest>=7.0", "pytest-cov>=5.0",
  "fastapi>=0.115", "httpx2>=2.0",
  "redis>=5.0", "fakeredis>=2.30",
  "httpx>=0.27",
  "pyjwt[crypto]>=2.9",
  "ruff>=0.6",
  "mypy>=1.13",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fssaira = ["py.typed"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

# The kernel, mediators, planes, GenAI integration contract and lifecycle are
# this build's own code and are held to a real bar: mypy clean, checked in CI.
# The pre-existing modules that already carried the paper's enforcement code
# (exact_action.py, disclosure.py, delegation.py, ...) predate this pass and
# are NOT mypy-clean today (134 findings across 28 files at the time this
# config was added -- see RECONCILIATION.md). Fixing that legacy surface is a
# separate, larger effort that risks conflicting with other sessions' work on
# those exact files; `ignore_errors` here is an honest scope boundary, not a
# blanket suppression of this build's own code.
[[tool.mypy.overrides]]
module = ["fssaira.kernel.*", "fssaira.mediators.*", "fssaira.planes.*",
          "fssaira.integration.*", "fssaira.lifecycle.*"]
disallow_untyped_defs = true
ignore_errors = false

[[tool.mypy.overrides]]
module = "fssaira.*"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "integration: requires external infrastructure (Redis, Kafka, Postgres, a model)",
  "slow: takes more than a second",
]
filterwarnings = ["ignore::DeprecationWarning"]
# A test running longer than this dumps every thread's stack, so a hang
# diagnoses itself instead of looking like a slow suite.
faulthandler_timeout = 300

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.coverage.run]
source = ["src/fssaira"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
