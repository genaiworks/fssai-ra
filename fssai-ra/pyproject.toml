[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fssaira"
version = "0.5.0"
description = "Fail-Secure Sovereign AI Reference Architecture: a runnable reference implementation for bounded, accountable, sovereign agentic AI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["pyyaml>=6.0"]

[project.scripts]
fssaira = "fssaira.cli:main"

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "httpx>=0.27"]
redis = ["redis>=5.0"]
kafka = ["confluent-kafka>=2.6"]
iceberg = ["pyiceberg>=0.9"]
spark = ["pyspark>=4.1,<4.2"]
platform = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "httpx>=0.27",
  "redis>=5.0", "confluent-kafka>=2.6",
]
dev = ["pytest>=7.0", "fastapi>=0.115", "httpx>=0.27", "redis>=5.0", "fakeredis>=2.30"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
