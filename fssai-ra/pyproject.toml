[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fssaira"
version = "0.1.0"
description = "Fail-Secure Sovereign AI Reference Architecture: a runnable reference implementation for bounded, accountable, sovereign agentic AI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
kafka = ["kafka-python>=2.0"]
iceberg = ["pyiceberg>=0.6"]
spark = ["pyspark>=3.5"]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
