# Trust by Construction framework -- control catalogue.
#
# The single source of truth for the framework. docs/framework/CONTROLS.md, the
# self-assessment (`fssaira framework assess`) and the starter kit
# (`fssaira framework init`) are all generated from this file, and
# tests/test_framework.py fails the build if any control cites a module, test or
# refusal code that does not exist, depends on a control at a higher level, or
# forms a dependency cycle.
#
# level: the maturity level (docs/PATTERNS.md#maturity-levels) at which the
#   control becomes required.
#   1 access-controlled · 2 authority-bound · 3 disclosure-governed ·
#   4 composition-safe · 5 evidenced
# requires: controls that must be in place first (roadmap ordering).
# applies_when: present only on controls an organisation may mark "n/a", and
#   names the condition that makes the control mandatory.
# verify: "tests/<file>::<name>" (executable), "command: ..." (run it), or
#   "attestation: ..." (a named role signs on a cadence).
version: "1.1"
levels:
  1: Access-controlled
  2: Authority-bound
  3: Disclosure-governed
  4: Composition-safe
  5: Evidenced
domains:
  GOV: Governance and accountability
  IDN: Identity, credentials and containment
  AUT: Authority over actions
  DAT: Data and disclosure
  SWM: Swarm composition
  EFF: Effects and adapters
  EVD: Evidence
  OVS: Human oversight
  ASR: Assurance and verification

controls:
  # -- Governance ---------------------------------------------------------------
  - id: GOV-1
    domain: GOV
    level: 1
    name: Named owners and a manual fallback for every workflow
    objective: Every agentic workflow has a named accountable owner and a human service route used whenever automation refuses.
    prevents: refusals that strand the person being served, and decisions nobody answers for
    question: Does every agentic workflow have a named owner and a documented manual route that works when the system says no?
    owner: Workflow owner
    requires: []
    implementation: [packs/template.pack.yaml, src/fssaira/scaffold.py]
    verify: ["attestation: manual_fallback and owner declared in every domain pack"]
    codes: []
    standards: [NIST AI RMF GOVERN, ISO/IEC 42001]
  - id: GOV-2
    domain: GOV
    level: 2
    name: Task contract with purpose, exact scope, budget and expiry
    objective: Work starts only from a contract naming task, purpose, subject, tenant, exact scope, shared budget and expiry; over-broad mandates do not start.
    prevents: wildcard authority and open-ended agents
    question: Does every agent task start from a written contract with exact identifiers, a budget and an expiry, and is an over-broad one refused?
    owner: Workflow owner
    requires: [GOV-1]
    implementation: [src/fssaira/tbc/contracts.py, src/fssaira/tbc/mandate.py]
    verify:
      - tests/test_mandate_lint.py::test_with_declared_purposes_an_over_broad_mandate_does_not_start
      - tests/test_tbc_sdk.py::test_lease_expiry_and_task_expiry_are_checked_on_use
    codes: [TASK_EXPIRED, TASK_BUDGET_EXCEEDS_PASSPORT]
    standards: [OWASP LLM06 Excessive Agency, NIST AI RMF MAP]
  - id: GOV-3
    domain: GOV
    level: 4
    name: Versioned policy with sanctioned migration
    objective: Policy changes only through a named, reasoned, monotonic migration that contracts uncovered tasks and sends held effects to re-review.
    prevents: silent rule changes, and approvals given under old rules executing under new ones
    question: Can you change agent policy without stopping everything, with in-flight approvals re-reviewed under the new rules?
    owner: Risk, legal, DPO
    requires: [GOV-2]
    implementation: [src/fssaira/tbc/runtime.py]
    verify: [tests/test_approval_policy_pinning.py::test_migration_is_named_monotonic_and_survives_restart]
    codes: [POLICY_VERSION_NOT_INCREASING, POLICY_WORKLOAD_MISMATCH, PASSPORT_DRIFT]
    standards: [ISO/IEC 42001, NIST AI RMF GOVERN]
  - id: GOV-4
    domain: GOV
    level: 3
    name: Sector release table with cited basis
    objective: Where law defines who may receive data, encode it as a decision table in which every answer cites its basis and unmodelled paths are refused.
    prevents: releases that are technically authorised but legally wrong
    question: Are your sector's disclosure rules (FERPA, HIPAA, GDPR, banking secrecy...) encoded as testable decisions that cite their legal basis?
    owner: Risk, legal, DPO
    requires: [GOV-2]
    applies_when: the workflow touches regulated personal data
    implementation: [src/fssaira/ferpa.py, packs/healthcare.pack.yaml, packs/finance.pack.yaml]
    verify: [tests/test_ferpa_pack.py::test_consent_must_match_holder_records_recipient_and_purpose]
    codes: [FERPA_CONSENT_REQUIRED, FERPA_PATH_NOT_MODELLED]
    standards: [FERPA 34 CFR 99, GDPR Art. 6, HIPAA Privacy Rule]

  # -- Identity, credentials, containment ---------------------------------------
  - id: IDN-1
    domain: IDN
    level: 1
    name: Agents hold no credentials
    objective: No process that runs a model holds a credential for a record store or external system; the gateway acts on its behalf.
    prevents: a manipulated model using standing access directly
    question: Is every agent unable, even when fully compromised, to reach a database, API key or cloud role on its own?
    owner: Enforcer operations
    requires: []
    implementation: [src/fssaira/isolation.py, src/fssaira/tbc/runtime.py]
    verify:
      - tests/test_isolation.py::test_standing_credentials_in_the_agent_environment_are_a_violation
      - tests/test_privilege_invariance.py::test_model_output_cannot_introduce_a_capability
    codes: [ENVELOPE_DENIED]
    standards: [OWASP LLM06 Excessive Agency, NIST AI RMF MANAGE]
  - id: IDN-2
    domain: IDN
    level: 1
    name: Authenticated agents with expiring, non-expanding leases
    objective: Every call carries an agent identity and a capability lease that expires and can never widen any authority axis.
    prevents: token reuse, forged capability and lease escalation
    question: Does every agent call carry its own short-lived capability that cannot grant more than its parent holds?
    owner: Enforcer operations
    requires: [IDN-1]
    implementation: [src/fssaira/tbc/runtime.py]
    verify:
      - tests/test_tbc_sdk.py::test_wrong_tokens_duplicate_fields_nonfinite_and_foreign_capability
      - tests/test_tbc_sdk.py::test_lease_cannot_expand_any_authority_axis
    codes: [AUTHENTICATION_REQUIRED, STALE_OR_FOREIGN_CAPABILITY, CAPABILITY_SCOPE_DENIED]
    standards: [NIST AI RMF MANAGE]
  - id: IDN-3
    domain: IDN
    level: 1
    name: Declared interfaces only
    objective: Agents reach the trusted base only through declared primitives with declared fields; anything else fails closed with no effect.
    prevents: undeclared tools and side doors
    question: Is there a closed list of operations an agent can call, with everything else refused before it does anything?
    owner: Enforcer operations
    requires: [IDN-1]
    implementation: [src/fssaira/integration/messages.py, src/fssaira/tbc/runtime.py]
    verify: [tests/test_tbc_sdk.py::test_untrusted_interfaces_fail_closed_without_effects]
    codes: [UNDECLARED_INTERFACE, OBJECT_REQUIRED]
    standards: [OWASP LLM05 Improper Output Handling]
  - id: IDN-4
    domain: IDN
    level: 4
    name: Measured agent cells; unqualified hosts refused
    objective: Each agent runs in a cell measured from inside -- no metadata service, no service-account token, default-deny egress, non-root, immutable code -- and production refuses a cell it cannot confirm.
    prevents: ambient cloud or cluster credentials leaking into a supposedly credential-less agent
    question: Have you measured, from inside the running agent container, that it cannot reach cloud metadata, cluster tokens or the internet?
    owner: Enforcer operations
    requires: [IDN-1]
    implementation: [src/fssaira/agent_cell.py, src/fssaira/isolation.py]
    verify:
      - tests/test_isolation.py::test_reachable_cloud_metadata_is_a_violation
      - tests/test_isolation.py::test_a_readable_service_account_token_is_a_violation
      - tests/test_agent_cell.py::test_every_property_must_be_observed_and_satisfied
    codes: []
    standards: [OWASP LLM06 Excessive Agency, NIST AI 600-1 Information Security]

  # -- Authority -----------------------------------------------------------------
  - id: AUT-1
    domain: AUT
    level: 2
    name: A proposal is not authority
    objective: Model output is a structured proposal; only an enforcement point independent of the model executes, and the action's class comes from an institution catalogue.
    prevents: prompt injection turning into action
    question: Is model output only ever a proposal, so that even a fully manipulated model cannot change a record, send a message or move money by itself?
    owner: Enforcer operations
    requires: [IDN-3]
    implementation: [src/fssaira/exact_action.py, src/fssaira/control_plane.py]
    verify:
      - tests/test_privilege_invariance.py::test_a_class_downgrading_model_gains_nothing
      - tests/test_ablations.py::test_removing_least_privilege_lets_agent_approve_awards
    codes: [AI_IR_SCOPE_DENIED]
    standards: [OWASP LLM01 Prompt Injection, OWASP LLM06 Excessive Agency]
  - id: AUT-2
    domain: AUT
    level: 2
    name: Exact-action approval
    objective: An approval binds the exact proposal digest, resource version, role, audience and expiry; any change voids it.
    prevents: approving X and executing Y
    question: If a draft changes by one character after approval, is the approval void?
    owner: Approvers
    requires: [AUT-1]
    implementation: [src/fssaira/exact_action.py]
    verify:
      - tests/test_exact_action.py::test_target_or_arguments_changed_after_approval_are_denied
      - tests/test_exact_action.py::test_changed_authoritative_case_requires_renewed_review
    codes: [EXACT_APPROVAL_REQUIRED, ARTIFACT_DIGEST_MISMATCH]
    standards: [NIST AI RMF MANAGE]
  - id: AUT-3
    domain: AUT
    level: 2
    name: No self-approval; independent confirmation
    objective: The proposer never approves its own proposal, and consequential effects need a confirmation from a different named person.
    prevents: agreement between agents, or one person, masquerading as oversight
    question: Does every consequential action need approval from someone other than whoever proposed it?
    owner: Approvers
    requires: [AUT-2]
    implementation: [src/fssaira/exact_action.py, src/fssaira/tbc/runtime.py]
    verify:
      - tests/test_exact_action.py::test_requester_cannot_approve_own_proposal
      - tests/test_tbc_sdk.py::test_full_sdk_workflow_uses_independent_approval_and_real_effect
    codes: [INDEPENDENT_CONFIRMATION_REQUIRED]
    standards: [ISO/IEC 42001, NIST AI RMF GOVERN]
  - id: AUT-4
    domain: AUT
    level: 4
    name: Policy-bound approval
    objective: Proposals and approvals record the policy version; execution under any other version is refused and re-reviewed.
    prevents: approve under old rules, execute under new
    question: Does an approval stop working when the policy it was given under changes?
    owner: Approvers
    requires: [AUT-2, GOV-3]
    implementation: [src/fssaira/tbc/runtime.py]
    verify: [tests/test_approval_policy_pinning.py::test_approval_under_old_policy_does_not_execute_under_new]
    codes: [POLICY_VERSION_CHANGED]
    standards: [ISO/IEC 42001]
  - id: AUT-5
    domain: AUT
    level: 4
    name: Objection window for irreversible effects
    objective: Approved effects wait a declared window in which an objection or revocation cancels them before they reach the system of record.
    prevents: irreversible effects (email, payment) that revocation arrives too late for
    question: For actions you cannot undo, is there a window in which a person can still stop them?
    owner: Workflow owner
    requires: [AUT-2]
    applies_when: agents can trigger irreversible external effects
    implementation: [src/fssaira/tbc/runtime.py]
    verify:
      - tests/test_effect_escrow.py::test_an_objection_inside_the_window_cancels_the_effect
      - tests/test_effect_escrow.py::test_revoking_the_task_during_the_window_cancels_at_commit
    codes: [OBJECTION_WINDOW_CLOSED, EFFECT_NOT_PENDING]
    standards: [NIST AI RMF MANAGE]

  # -- Data and disclosure --------------------------------------------------------
  - id: DAT-1
    domain: DAT
    level: 3
    name: Purpose-bound grants through a single gate
    objective: Data enters a model context only through a gate that alone holds the record-store credential, under a grant naming holder, purpose, subjects, fields and expiry.
    prevents: agents reading whatever they can reach
    question: Does every read by an agent name the person, the fields and the purpose, and go through one gate that alone can read the store?
    owner: Risk, legal, DPO
    requires: [IDN-1, GOV-2]
    implementation: [src/fssaira/disclosure.py, src/fssaira/disclosure_api.py]
    verify:
      - tests/test_disclosure_api.py::test_governed_model_task_reads_only_what_the_grant_allows_and_labels_its_output
      - tests/test_disclosure.py::test_requests_must_name_subjects_and_fields_and_endpoints_must_be_declared
    codes: [PURPOSE_MISMATCH, CONTEXT_SCOPE_DENIED]
    standards: [OWASP LLM02 Sensitive Information Disclosure, GDPR Art. 5(1)(b)]
  - id: DAT-2
    domain: DAT
    level: 3
    name: Live consent and revocation at read and at release
    objective: Consent, revocation and expiry are checked at every read and again at every release of anything derived.
    prevents: consent withdrawn after the read but before the release
    question: If someone withdraws consent mid-task, does the next read and the pending release both fail?
    owner: Risk, legal, DPO
    requires: [DAT-1]
    implementation: [src/fssaira/disclosure.py]
    verify:
      - tests/test_disclosure.py::test_consent_withdrawal_and_revocation_take_effect_at_next_read
      - tests/test_disclosure.py::test_release_rechecks_consent_and_revocation_after_the_read
    codes: [RELEASE_CONSENT_WITHDRAWN, CONSENT_REVOKED]
    standards: [GDPR Art. 7(3)]
  - id: DAT-3
    domain: DAT
    level: 3
    name: Label inheritance and sealed release
    objective: Every output carries the join of every label it was built from, ignores labels the model claims, and is released only to destinations cleared for all of them.
    prevents: the reader -> summariser -> publisher leak
    question: If an agent summarises a confidential record, does the summary stay confidential wherever it goes?
    owner: Risk, legal, DPO
    requires: [DAT-1]
    implementation: [src/fssaira/disclosure.py, src/fssaira/tbc/runtime.py]
    verify:
      - tests/test_disclosure.py::test_model_claimed_label_cannot_launder_a_summary
      - tests/test_tbc_sdk.py::test_memory_and_generated_output_cannot_drop_session_lineage
    codes: [DESTINATION_DENIED, DECLASSIFICATION_REQUIRED]
    standards: [OWASP LLM02 Sensitive Information Disclosure]
  - id: DAT-4
    domain: DAT
    level: 3
    name: Independent, exact declassification
    objective: A label is lowered only through a declared rule, with approval bound to the exact output digest by someone other than its holder.
    prevents: self-declassification and "approve the gist"
    question: Is lowering an output's sensitivity only possible through a declared rule and someone other than its holder?
    owner: Risk, legal, DPO
    requires: [DAT-3]
    implementation: [src/fssaira/disclosure.py]
    verify: [tests/test_disclosure.py::test_declassification_requires_exact_independent_approval]
    codes: [DECLASSIFICATION_SELF_APPROVED, DECLASSIFICATION_WRONG_OUTPUT]
    standards: [ISO/IEC 42001]
  - id: DAT-5
    domain: DAT
    level: 3
    name: Refusals reveal nothing
    objective: Record sources are read only after authorization, and agents see only DENIED, so a refusal does not reveal whether a record exists.
    prevents: existence oracles and policy probing through error codes
    question: Do refusals look identical to the agent, so it cannot learn whether a record exists?
    owner: Enforcer operations
    requires: [DAT-1]
    implementation: [src/fssaira/disclosure.py, src/fssaira/tbc/runtime.py]
    verify: [tests/test_disclosure_production.py::test_record_sources_are_read_only_after_authorization_so_existence_does_not_leak]
    codes: []
    standards: [OWASP LLM02 Sensitive Information Disclosure]
  - id: DAT-6
    domain: DAT
    level: 4
    name: Covert-channel budget and rate objective
    objective: Choices left to agents at release (destination, path, time, size, count) are made canonical where possible; the remainder is charged in bits against a budget and an organisation-wide bits-per-minute objective.
    prevents: agents signalling through legitimate choices
    question: Have you measured how many bits per minute agents could leak through their allowed choices, and set a limit?
    owner: Enforcer operations
    requires: [DAT-3]
    applies_when: agent outputs leave the organisation or cross trust zones
    implementation: [src/fssaira/covert_channels.py, src/fssaira/channel_slo.py]
    verify:
      - tests/test_channel_budget.py::test_releases_past_the_channel_budget_go_to_a_person
      - tests/test_master_guide_measures.py::test_channel_slo_is_a_rate_and_fails_when_unbounded
    codes: [CHANNEL_BUDGET_EXHAUSTED, CHANNEL_SLO_EXCEEDED]
    standards: [NIST AI 600-1 Information Security]

  # -- Swarm composition ------------------------------------------------------------
  - id: SWM-1
    domain: SWM
    level: 4
    name: One shared budget for the whole swarm
    objective: Every descendant draws on the task budget through atomic reservations, so spawning workers multiplies neither spend nor data access.
    prevents: parallelism as a budget and authority multiplier
    question: When an agent spawns workers, do they all draw on one shared task budget?
    owner: Enforcer operations
    requires: [GOV-2]
    implementation: [src/fssaira/tbc/runtime.py]
    verify:
      - tests/test_tbc_sdk.py::test_aggregate_sibling_budget_does_not_multiply
      - tests/test_tbc_composition_controls.py::test_sibling_reservations_share_one_balance_and_settle_once
    codes: [AGGREGATE_BUDGET_EXHAUSTED, CALL_BUDGET_EXHAUSTED]
    standards: [OWASP LLM10 Unbounded Consumption]
  - id: SWM-2
    domain: SWM
    level: 4
    name: Attenuating delegation, verified across the whole chain
    objective: A delegate receives at most the intersection of every grant above it, recomputed from the institutional root on every call; machines cannot pass on consequential authority without a named human.
    prevents: authority laundering through a chain of agents (per-hop checks alone contained 2 of 10 risk classes)
    question: When agent A delegates to B and B to C, is C's authority recomputed from the root every time, not just checked against B?
    owner: Enforcer operations
    requires: [IDN-2]
    applies_when: agents delegate to other agents or tools
    implementation: [src/fssaira/delegation.py, src/fssaira/grant_delegation.py]
    verify:
      - tests/test_delegation.py::test_a_hop_cannot_pass_on_authority_it_does_not_hold
      - tests/test_delegation.py::test_a_machine_may_not_pass_consequential_authority_onward
    codes: [DELEGATION_AMPLIFICATION, DELEGATION_DEPTH]
    standards: [OWASP LLM06 Excessive Agency]
  - id: SWM-3
    domain: SWM
    level: 4
    name: Declared task graph
    objective: Every node and message edge in the swarm is admitted before use; retracting an edge stops messages already queued on it.
    prevents: undeclared agents and side channels between agents
    question: Is the shape of your swarm (who may talk to whom) declared up front and enforced?
    owner: Workflow owner
    requires: [SWM-2]
    implementation: [src/fssaira/tbc/runtime.py]
    verify:
      - tests/test_tbc_composition_controls.py::test_declared_graph_admits_each_node_and_edge_before_use
      - tests/test_tbc_composition_controls.py::test_retracting_an_edge_stops_messages_already_queued_on_it
    codes: [GRAPH_NOT_DECLARED, NODE_NOT_ADMITTED]
    standards: [NIST AI RMF MAP]
  - id: SWM-4
    domain: SWM
    level: 4
    name: Population and depth ceilings
    objective: A task has a maximum number of agents and a maximum delegation depth.
    prevents: runaway spawning
    question: Is there a hard ceiling on how many agents a task may create and how deep delegation may go?
    owner: Enforcer operations
    requires: [SWM-1]
    implementation: [src/fssaira/tbc/runtime.py]
    verify:
      - tests/test_tbc_sdk.py::test_population_ceiling_is_enforced
      - tests/test_tbc_sdk.py::test_population_depth_ancestry_and_revocation
    codes: [POPULATION_LIMIT, DELEGATION_DEPTH]
    standards: [OWASP LLM10 Unbounded Consumption]
  - id: SWM-5
    domain: SWM
    level: 4
    name: Fan-in gate; agreement is evidence, not authority
    objective: A coordinator accepts a worker result only with verified identity, provenance, current epoch and permitted destination; consensus among agents never substitutes for approval.
    prevents: poisoned or stale worker results and fake consensus
    question: When a coordinator combines worker outputs, does it verify where each came from, and is agreement ever treated as permission?
    owner: Enforcer operations
    requires: [SWM-3]
    implementation: [src/fssaira/tbc/runtime.py]
    verify:
      - tests/test_tbc_composition_controls.py::test_fan_in_checks_identity_provenance_epoch_and_destination
      - tests/test_tbc_composition_controls.py::test_fan_in_refuses_results_without_provenance_or_from_revoked_workers
    codes: [STALE_RESULT]
    standards: [OWASP LLM09 Misinformation]
  - id: SWM-6
    domain: SWM
    level: 4
    name: Revocation epoch and freshness proofs
    objective: Revocation raises the task epoch so queued work, stale leases and later release chunks fail; adapters outside the transaction demand a fresh proof.
    prevents: work that outlives the authority that started it
    question: When consent or authority is withdrawn, does queued and in-flight agent work fail immediately?
    owner: Enforcer operations
    requires: [SWM-1]
    implementation: [src/fssaira/tbc/runtime.py]
    verify:
      - tests/test_tbc_composition_controls.py::test_task_revocation_fails_queued_writes_and_later_release_chunks
      - tests/test_tbc_composition_controls.py::test_freshness_proof_fails_on_epoch_change_age_stop_or_forgery
    codes: [STALE_PROPOSAL, FRESHNESS_UNPROVEN, AGENT_REVOKED_OR_EXPIRED]
    standards: [NIST AI RMF MANAGE]
  - id: SWM-7
    domain: SWM
    level: 4
    name: Monitors are brakes, never keys
    objective: Monitors and behaviour watches can restrict or quarantine but hold no method to grant or restore authority; probing agents are contracted.
    prevents: a fooled or hostile monitor escalating privilege
    question: Can your monitoring stack only ever restrict agents, never grant them power?
    owner: Evidence auditor
    requires: [SWM-6]
    implementation: [src/fssaira/tbc/runtime.py, src/fssaira/tbc/behaviour.py]
    verify:
      - tests/test_behaviour_watch.py::test_an_agent_probing_its_boundary_is_quarantined
      - tests/test_behaviour_watch.py::test_only_a_monitor_can_run_the_watch
    codes: [MONITOR_REPLAY, STALE_MONITOR_EVIDENCE]
    standards: [NIST AI RMF MEASURE]
  - id: SWM-8
    domain: SWM
    level: 4
    name: Agent memory is scoped, retained and lineage-carrying
    objective: Persistent memory is namespaced, epoch-bound, expires on a declared retention, and keeps the labels and lineage of what was stored.
    prevents: memory poisoning across tasks and label laundering through memory
    question: Is agent memory scoped to its task and expiring, so it cannot leak into or poison another task?
    owner: Enforcer operations
    requires: [DAT-3, SWM-6]
    implementation: [src/fssaira/tbc/runtime.py]
    verify: [tests/test_tbc_sdk.py::test_memory_integrity_retention_scope_and_reauthorization]
    codes: [RETENTION_TOO_LONG]
    standards: [OWASP LLM04 Data and Model Poisoning]

  # -- Effects and adapters -----------------------------------------------------------
  - id: EFF-1
    domain: EFF
    level: 2
    name: Idempotent retries and reconciled uncertain outcomes
    objective: Retries reuse a persistent request identity; an outcome that is unknown is marked uncertain and reconciled once, never blindly retried.
    prevents: the double email and the double payment
    question: When a call times out, does your system establish whether the action happened before it retries?
    owner: Enforcer operations
    requires: [AUT-1]
    implementation: [src/fssaira/exact_action.py]
    verify:
      - tests/test_exact_action.py::test_retry_is_idempotent_and_cross_request_reuse_is_denied
      - tests/test_exact_action.py::test_completed_mutation_is_marked_uncertain_then_reconciled_once
    codes: []
    standards: [NIST AI RMF MANAGE]
  - id: EFF-2
    domain: EFF
    level: 4
    name: Fenced commit across adapters
    objective: External effects commit in one linearizable step against the current epoch, carry an idempotency key, and are held when the store is unreachable.
    prevents: stale effects under partition or clock skew, and duplicates on retry
    question: Do your real adapters commit each action at most once and never after revocation, even under network faults?
    owner: Enforcer operations
    requires: [EFF-1, SWM-6]
    applies_when: agents cause effects in external systems
    implementation: [src/fssaira/revocation_chaos.py]
    verify:
      - tests/test_revocation_chaos.py::test_fenced_commit_holds_every_invariant_and_each_ablation_breaks_one
      - "command: fssaira assure chaos"
    codes: []
    standards: [NIST AI RMF MANAGE]
  - id: EFF-3
    domain: EFF
    level: 5
    name: Your own store and sink are qualified
    objective: The deployment's own authority store and external systems pass the fault campaign and the concurrent linearization audit.
    prevents: a correct protocol running on an incorrect database or connector
    question: Have your production authority store and connectors themselves passed fault-injected qualification?
    owner: Enforcer operations
    requires: [EFF-2]
    applies_when: agents cause effects in external systems
    implementation: [src/fssaira/adapter_qualification.py]
    verify:
      - tests/test_adapter_qualification.py::test_reference_sql_store_and_sink_qualify
      - tests/test_adapter_qualification.py::test_a_store_that_forgets_the_epoch_is_not_qualified
    codes: [ADAPTER_NOT_QUALIFIED, STORE_STALE_COMMIT]
    standards: [NIST AI RMF MEASURE]

  # -- Evidence -----------------------------------------------------------------------
  - id: EVD-1
    domain: EVD
    level: 1
    name: Tamper-evident log, intent before effect, no protected values
    objective: Intent is recorded before any effect, the log is hash-chained and written through a credential agents do not hold, and it never contains protected values.
    prevents: silent actions and logs that become a second data breach
    question: Is every agent action logged before it happens, in a log agents cannot write to and that contains no personal data?
    owner: Evidence auditor
    requires: []
    implementation: [src/fssaira/evidence.py, src/fssaira/joined_workflow.py]
    verify:
      - tests/test_disclosure.py::test_intent_evidence_failure_releases_nothing
      - tests/test_disclosure.py::test_evidence_never_contains_protected_values
    codes: [LEDGER_CHAIN_BROKEN]
    standards: [NIST AI RMF MEASURE, ISO/IEC 42001]
  - id: EVD-2
    domain: EVD
    level: 2
    name: Decision receipts
    objective: Every decision yields a chained receipt binding policy version, epoch, lineage, artifact digest, recipient and outcome -- digests, never text.
    prevents: incidents and appeals nobody can reconstruct
    question: For any agent decision, can you show which policy, which inputs and which approval produced it, without reading the data?
    owner: Evidence auditor
    requires: [EVD-1]
    implementation: [src/fssaira/tbc/runtime.py]
    verify:
      - tests/test_tbc_composition_controls.py::test_receipts_bind_policy_epoch_lineage_digest_recipient_and_outcome
      - tests/test_tbc_composition_controls.py::test_receipt_chain_detects_deletion_and_survives_pruning
    codes: []
    standards: [ISO/IEC 42001, NIST AI RMF GOVERN]
  - id: EVD-3
    domain: EVD
    level: 3
    name: Signed checkpoints and an independent witness
    objective: A notary signs checkpoints and a separately administered witness co-signs only consistent growth, refusing forks and rollbacks.
    prevents: an insider or compromised enforcer rewriting history
    question: Would a party outside your administrators detect it if someone with admin access rewrote the agent logs?
    owner: Evidence auditor
    requires: [EVD-1]
    implementation: [src/fssaira/evidence_notary.py, src/fssaira/witness.py]
    verify:
      - tests/test_witness.py::test_an_enforcer_holding_the_notary_key_cannot_get_a_rewritten_past_cosigned
      - tests/test_witness.py::test_a_truncated_ledger_is_a_rollback
    codes: [WITNESS_FORK, WITNESS_ROLLBACK, LEDGER_HISTORY_REWRITTEN]
    standards: [NIST AI 600-1 Information Integrity]
  - id: EVD-4
    domain: EVD
    level: 3
    name: Independent recomputation on a cadence
    objective: A verifier outside the enforcer recomputes the archive hourly (incremental) and daily (full); forged records are quarantined by position, not content.
    prevents: trusting stored verdicts
    question: Does someone other than the system itself recompute the evidence regularly?
    owner: Evidence auditor
    requires: [EVD-3]
    implementation: [src/fssaira/small_data.py, src/fssaira/chain_verification.py]
    verify:
      - tests/test_small_data.py::test_forged_record_is_quarantined_by_position_not_content
      - "command: fssaira small verify --mode full"
    codes: []
    standards: [NIST AI RMF MEASURE]
  - id: EVD-5
    domain: EVD
    level: 3
    name: Metadata-only visibility and agent dossiers
    objective: Dashboards and dossiers show identity, authority, actions, refusals and channel capacity per agent, without protected content.
    prevents: observability that becomes surveillance or a leak
    question: Can you see what each agent may do and has done without anyone reading protected data?
    owner: Evidence auditor
    requires: [EVD-2]
    implementation: [src/fssaira/tbc/runtime.py]
    verify: [tests/test_agent_dossier.py::test_the_dossier_holds_no_protected_content]
    codes: []
    standards: [NIST AI RMF MEASURE]
  - id: EVD-6
    domain: EVD
    level: 5
    name: Merkle proofs and a witness quorum across organisations
    objective: Evidence is committed in an RFC 9162 tree; witnesses in distinct administrative domains co-sign from consistency proofs; split views are detected.
    prevents: one organisation (or one coerced witness) vouching for history; different logs for different audiences
    question: Do at least two organisations outside yours co-sign your evidence, and would they catch you showing different logs to different people?
    owner: Evidence auditor
    requires: [EVD-3]
    implementation: [src/fssaira/transparency.py]
    verify:
      - tests/test_transparency.py::test_quorum_counts_distinct_domains_not_keys
      - tests/test_transparency.py::test_split_view_is_proven_by_two_signed_heads
    codes: [WITNESS_QUORUM_NOT_MET, EVIDENCE_SPLIT_VIEW, MERKLE_FORK]
    standards: [NIST AI 600-1 Information Integrity]
  - id: EVD-7
    domain: EVD
    level: 5
    name: Forward-secure keys and anchored time
    objective: Checkpoints are signed with period keys erased after use and anchored to several independent time sources.
    prevents: a stolen key or a moved clock backdating history
    question: If your signing key were stolen today, would a checkpoint the thief backdated to last month be rejected?
    owner: Evidence auditor
    requires: [EVD-6]
    implementation: [src/fssaira/forward_secure.py, src/fssaira/time_anchor.py]
    verify:
      - tests/test_forward_secure_and_time.py::test_a_key_stolen_today_cannot_sign_yesterday
      - tests/test_forward_secure_and_time.py::test_a_lying_server_is_caught_by_the_chain
    codes: [FS_WRONG_PERIOD, TIME_SOURCES_DISAGREE, CHECKPOINT_TIME_UNANCHORED]
    standards: [NIST AI 600-1 Information Integrity]
  - id: EVD-8
    domain: EVD
    level: 5
    name: Federated publication with per-record proofs
    objective: Each checkpoint is published in one step (root, forward-secure signature, time anchor, quorum) and verified in one verdict; any single record can be proven included.
    prevents: evidence controls checked piecemeal, and appeals that need the whole ledger
    question: Can an auditor verify a checkpoint in one step, and can you prove one decision is in it without revealing the rest?
    owner: Evidence auditor
    requires: [EVD-6, EVD-7]
    implementation: [src/fssaira/evidence_federation.py]
    verify: [tests/test_evidence_federation.py::test_the_real_runtime_ledger_publishes_and_proves_a_receipt]
    codes: [EVIDENCE_ROOT_MISMATCH, EVIDENCE_RECORD_NOT_INCLUDED]
    standards: [NIST AI 600-1 Information Integrity]

  # -- Human oversight -------------------------------------------------------------------
  - id: OVS-1
    domain: OVS
    level: 2
    name: Deliberation floor
    objective: Approvals faster than a declared minimum review time are refused and routed to the manual queue.
    prevents: rubber-stamping
    question: Are approvals faster than a declared minimum review time refused and sent to a person?
    owner: Workflow owner
    requires: [AUT-3]
    implementation: [src/fssaira/oversight.py, src/fssaira/tbc/runtime.py]
    verify:
      - tests/test_oversight.py::test_an_approval_faster_than_the_deliberation_floor_is_refused
      - tests/test_tbc_composition_controls.py::test_minimum_review_time_defers_fast_approvals_to_the_manual_route
    codes: [REVIEW_DEFERRED_TO_MANUAL]
    standards: [NIST AI 600-1 Human-AI Configuration]
  - id: OVS-2
    domain: OVS
    level: 4
    name: Declared review capacity and escalation
    objective: Each reviewer's capacity is declared; approvals past it are refused, and sustained load escalates to a second distinct reviewer.
    prevents: fatigue silently deleting the last human control
    question: Do you know how many consequential approvals a reviewer can do well per day, and does the system stop at that number?
    owner: Workflow owner
    requires: [OVS-1]
    implementation: [src/fssaira/oversight.py]
    verify:
      - tests/test_oversight.py::test_the_ceiling_refuses_the_next_approval_rather_than_flagging_it
      - tests/test_oversight.py::test_sustained_load_escalates_to_a_second_distinct_reviewer
    codes: []
    standards: [NIST AI 600-1 Human-AI Configuration]
  - id: OVS-3
    domain: OVS
    level: 4
    name: Staffed to the floor
    objective: Headcount is computed from arrival rate and review time with the floor as minimum service time; understaffing defers, never lowers the floor.
    prevents: queues that tempt someone to switch the floor off
    question: Is review staffing calculated from demand, and is the answer to overload "more people", never "faster approvals"?
    owner: Workflow owner
    requires: [OVS-2]
    implementation: [src/fssaira/oversight_staffing.py]
    verify:
      - tests/test_master_guide_measures.py::test_staffing_honours_the_floor_and_reports_understaffing
      - "command: fssaira assure staffing"
    codes: []
    standards: [NIST AI RMF MANAGE]
  - id: OVS-4
    domain: OVS
    level: 4
    name: Independent assistance for review
    objective: A lowered floor for AI-assisted review needs declared model, evidence-path and adversarial independence from the proposer.
    prevents: the assistant repeating the proposer's error while every control stays green
    question: If an AI helps reviewers, is it independent of the AI that made the proposal?
    owner: Workflow owner
    requires: [OVS-1]
    applies_when: reviewers are assisted by an AI model
    implementation: [src/fssaira/assisted_review.py]
    verify: [tests/test_assisted_review.py::test_a_lowered_floor_without_declared_independence_is_refused]
    codes: [ASSISTANCE_NOT_DECLARED]
    standards: [NIST AI 600-1 Human-AI Configuration]
  - id: OVS-5
    domain: OVS
    level: 5
    name: Reviewer calibration with canaries
    objective: Known-wrong canary proposals are planted at a declared rate; a reviewer who approves them loses capacity and gains a second reviewer; canaries never execute.
    prevents: capacity declared but never measured
    question: Do you test, continuously and safely, that reviewers actually catch bad proposals?
    owner: Workflow owner
    requires: [OVS-2]
    implementation: [src/fssaira/review_calibration.py]
    verify:
      - tests/test_review_calibration.py::test_a_reviewer_who_approves_canaries_loses_capacity_and_gains_a_second_reviewer
      - tests/test_review_calibration.py::test_a_canary_never_executes_whatever_the_reviewer_decides
    codes: []
    standards: [NIST AI RMF MEASURE]

  # -- Assurance -------------------------------------------------------------------------
  - id: ASR-1
    domain: ASR
    level: 2
    name: Registered refusal codes
    objective: Every refusal code the build can emit is in a registry generated from source; the build fails when it drifts.
    prevents: contracts and dashboards that test for codes that do not exist
    question: Is there a complete, generated list of every reason your system can refuse?
    owner: Evidence auditor
    requires: []
    implementation: [src/fssaira/refusal_registry.py]
    verify: [tests/test_master_guide_measures.py::test_refusal_registry_is_current_with_the_code]
    codes: []
    standards: [ISO/IEC 42001]
  - id: ASR-2
    domain: ASR
    level: 3
    name: Every control is load-bearing
    objective: Removing each control in turn brings back a named harm.
    prevents: controls that exist on paper but do nothing
    question: For each control, have you shown the harm that returns when it is switched off?
    owner: Evidence auditor
    requires: [ASR-1]
    implementation: [src/fssaira/conformance.py]
    verify:
      - tests/test_ablations.py::test_removing_human_approval_enables_unilateral_high_impact
      - tests/test_ablations.py::test_removing_egress_control_enables_exfiltration
    codes: []
    standards: [NIST AI RMF MEASURE]
  - id: ASR-3
    domain: ASR
    level: 3
    name: Bounded model check of the authority space
    objective: The declared authority and disclosure space is enumerated against a reference predicate written independently of the implementation.
    prevents: configurations nobody thought to test
    question: Has every combination of role, operation and state in your policy been checked, not just the happy paths?
    owner: Evidence auditor
    requires: [ASR-2]
    implementation: [src/fssaira/verification.py]
    verify: [tests/test_verification_and_conformance.py::test_the_declared_authority_space_contains_no_violation]
    codes: []
    standards: [NIST AI RMF MEASURE]
  - id: ASR-4
    domain: ASR
    level: 4
    name: Falsification campaign
    objective: Every falsifier is run for every domain pack in scope; removing one mediator check must produce a counterexample.
    prevents: a safety claim nobody tried to break
    question: Do you actively try to break your own safety claims, and does the attempt succeed when a check is removed?
    owner: Evidence auditor
    requires: [ASR-3]
    implementation: [src/fssaira/thesis.py, src/fssaira/falsification.py]
    verify: [tests/test_thesis.py::test_the_falsifiers_find_counterexamples_when_one_mediator_check_is_removed]
    codes: []
    standards: [NIST AI RMF MEASURE]
  - id: ASR-5
    domain: ASR
    level: 5
    name: Trusted base measured and attested
    objective: SLOC per trusted component, an SBOM and a build measurement pinned by attestation; a changed measurement is a changed enforcer.
    prevents: the phrase "small trusted base" used as an unfalsifiable slogan
    question: Do you know exactly which code you trust, how big it is, and that production runs that code?
    owner: Enforcer operations
    requires: [ASR-1]
    implementation: [src/fssaira/trusted_base.py]
    verify:
      - tests/test_master_guide_measures.py::test_trusted_base_is_measured_and_a_minority_of_the_package
      - "command: fssaira assure trusted-base"
    codes: []
    standards: [OWASP LLM03 Supply Chain]
  - id: ASR-6
    domain: ASR
    level: 5
    name: Reproducible assurance report per release
    objective: Each release carries a digest-stamped report of every engineering check; buyers reproduce the digest.
    prevents: assurance that is a slide, not a result
    question: Can a buyer or auditor rerun your assurance and get the same digest?
    owner: Evidence auditor
    requires: [ASR-5, EFF-2, EVD-8]
    implementation: [src/fssaira/assurance_report.py]
    verify:
      - tests/test_assurance_report.py::test_report_passes_and_its_digest_is_reproducible
      - "command: fssaira assure report"
    codes: []
    standards: [ISO/IEC 42001]
  - id: ASR-7
    domain: ASR
    level: 5
    name: Independent review and field evidence
    objective: An independent security review and a bounded pilot produce findings, remediation and outcome measures for this deployment.
    prevents: authors grading their own threat model
    question: Has someone outside the team attacked this deployment, and has a real pilot measured outcomes?
    owner: Executive sponsor
    requires: [ASR-6]
    implementation: [docs/PILOT_PROTOCOL.md, docs/GAPS.md]
    verify: ["attestation: independent review report and pilot exit report, versioned to the deployment"]
    codes: []
    standards: [NIST AI RMF GOVERN, ISO/IEC 42001]

  # Controls recovered from the full V28 pattern set.
  - id: GOV-5
    domain: GOV
    level: 2
    name: Kernel floor and mandate linting
    objective: Validate packs against the kernel floor and task mandates against the declared purpose profile
      before use.
    prevents: weakened packs and excess privileges relative to the declared purpose
    question: Do weakened packs and over-broad mandates fail before a task starts?
    owner: Policy owner
    requires:
    - GOV-2
    implementation:
    - src/fssaira/pack_floor.py
    - src/fssaira/tbc/mandate.py
    verify:
    - tests/test_profile_floor.py::test_the_runtime_refuses_to_start_with_a_weakened_pack
    - tests/test_mandate_lint.py::test_with_declared_purposes_an_over_broad_mandate_does_not_start
    codes:
    - PACK_NON_HUMAN_APPROVER
    standards: []
  - id: GOV-6
    domain: GOV
    level: 1
    name: Explicit deployment posture
    objective: Publish declared limits and reject incompatible pilot or production teaching defaults before startup.
    prevents: silent defaults and a declared deployment posture contradicting active controls
    question: Are undeclared limits visible and unsafe teaching defaults rejected for a pilot or production declaration?
    owner: Deployment owner
    requires:
    - GOV-1
    implementation:
    - src/fssaira/security.py
    - src/fssaira/api.py
    verify:
    - tests/test_production_posture.py::test_a_pilot_with_teaching_defaults_refuses_to_start
    - tests/test_api.py::test_health_publishes_what_this_deployment_has_declared
    codes: []
    standards: []
  - id: IDN-5
    domain: IDN
    level: 1
    name: Bounded code execution
    objective: Run generated code with a cleared environment, parent-observed resource limits and process-group
      timeout.
    prevents: unbounded execution and child processes surviving a timeout
    question: Are execution limits measured and the entire process group stopped on timeout?
    owner: Enforcer operations
    requires:
    - IDN-1
    implementation:
    - src/fssaira/integration/sandbox.py
    verify:
    - tests/integration/test_integration_sandbox.py::test_wall_clock_timeout_kills_the_process_group
    codes: []
    standards: []
  - id: AUT-6
    domain: AUT
    level: 2
    name: Source-grounded confirmation
    objective: Require configured source confirmation of the proposed value before approving a grounded effect.
    prevents: unsupported values relative to the trusted source record
    question: Does a proposed value unsupported by the configured source fail confirmation?
    owner: Workflow owner
    requires:
    - AUT-2
    implementation:
    - src/fssaira/tbc/runtime.py
    verify:
    - tests/test_behaviour_watch.py::test_a_steered_wrong_value_is_refused_at_the_sources_confirmation
    codes:
    - UNSUPPORTED_PROPOSAL
    standards: []
  - id: DAT-7
    domain: DAT
    level: 3
    name: Erasure through key custody
    objective: Destroy subject custody keys and test that restoring encrypted application data does not restore
      access.
    prevents: recovery of erased plaintext through retained ciphertext alone
    question: Does a database restore remain unable to decrypt data after subject-key destruction?
    owner: Data custodian
    requires:
    - DAT-1
    implementation:
    - src/fssaira/key_custody.py
    - src/fssaira/custody_store.py
    verify:
    - tests/test_custody_persistence.py::test_a_database_restore_does_not_resurrect_an_erased_subject
    codes:
    - CUSTODY_KEY_DESTROYED
    standards: []
  - id: EVD-9
    domain: EVD
    level: 3
    name: Divergence-refusing archive
    objective: Keep an archive whose append path rejects primary-history rewrites and rollback.
    prevents: silently replacing preserved history with a changed primary log
    question: Does the archive reject a rewritten primary ledger?
    owner: Evidence auditor
    requires:
    - EVD-1
    implementation:
    - src/fssaira/iceberg_backend.py
    - src/fssaira/small_data.py
    verify:
    - tests/test_tier_equivalence.py::test_rewritten_ledger_is_refused
    codes: []
    standards: []
  - id: EVD-10
    domain: EVD
    level: 3
    name: Authenticated and continuous ingestion
    objective: Verify crossing integrity, quarantine rejected bytes by position and digest, and halt on lost
      records or generations.
    prevents: forged imports, hostile content copied into quarantine and silent evidence gaps
    question: Are forged imports quarantined without content and missing positions refused?
    owner: Ingestion operator
    requires:
    - EVD-1
    implementation:
    - src/fssaira/import_boundary.py
    - src/fssaira/small_data.py
    verify:
    - tests/test_small_data.py::test_content_hash_mismatch_commits_nothing
    - tests/test_small_data.py::test_forged_record_is_quarantined_by_position_not_content
    - tests/test_small_data.py::test_a_record_deleted_before_import_stops_the_sink
    codes: []
    standards: []
  - id: ASR-8
    domain: ASR
    level: 5
    name: Assurance bound to implementation identity
    objective: Bind conformance evidence to the exact implementation digest and reject records after implementation
      changes.
    prevents: transferring a previous qualification to changed code
    question: Does changing implementation invalidate its prior assurance record?
    owner: Evidence auditor
    requires:
    - ASR-2
    implementation:
    - src/fssaira/kernel/assurance.py
    verify:
    - tests/kernel/test_kernel_assurance.py::test_code_changed_after_the_run_refuses
    codes:
    - ASSURANCE_IMPLEMENTATION_CHANGED
    standards: []
  - id: ASR-9
    domain: ASR
    level: 5
    name: Evidence-tier equivalence
    objective: Run the same archive and verification scenarios on each selected evidence backend, recording skips
      and host-specific costs separately.
    prevents: assuming equal assurance from backend labels or throughput
    question: Do every selected backend and tier pass the same evidence scenarios without hidden skips?
    owner: Platform owner
    requires:
    - EVD-9
    - EVD-10
    implementation:
    - src/fssaira/small_data.py
    - src/fssaira/iceberg_backend.py
    verify:
    - tests/test_tier_equivalence.py::test_missing_tail_is_caught_only_by_the_signed_checkpoint
    codes: []
    standards: []

# Canonical design patterns. V27 is the P1-P10 view; V28 adds P11-P34.
patterns:
- id: P1
  name: Declared authority ceiling
  family: Decision and composition
  rule: The operator installs a workload’s maximum authority. A model never requests it.
  controls:
  - GOV-2
  - IDN-2
  verify:
  - tests/test_tbc_sdk.py::test_lease_cannot_expand_any_authority_axis
  codes:
  - ENVELOPE_DENIED
  scope: local-reference
  limits: The installed ceiling can itself be wrong; policy ownership and independent review remain necessary.
  observation: ENVELOPE_DENIED
- id: P2
  name: Task contract
  family: Decision and composition
  rule: Every task names purpose, subject, tenant, scope, budget and expiry before work starts.
  controls:
  - GOV-2
  - SWM-1
  - SWM-6
  verify:
  - tests/test_tbc_sdk.py::test_aggregate_sibling_budget_does_not_multiply
  codes:
  - INVALID_TASK_FIELDS
  scope: local-reference
  limits: Shared-state and freshness tests cover declared local configurations, not arbitrary distributed interleavings.
  observation: INVALID_TASK_FIELDS
- id: P3
  name: Credentialless runtime
  family: Decision and composition
  rule: The component that reasons holds no store credential and no write credential.
  controls:
  - IDN-1
  - AUT-1
  verify:
  - tests/test_isolation.py::test_standing_credentials_in_the_agent_environment_are_a_violation
  codes: []
  scope: deployment-dependent
  limits: Credential separation depends on the deployed process, host and connector boundaries; SDK conventions
    alone do not isolate an agent.
  observation: no path exists
- id: P4
  name: Attenuated delegation
  family: Decision and composition
  rule: A child holds the intersection of every ancestor, and expires no later than its parent.
  controls:
  - SWM-2
  - SWM-4
  verify:
  - tests/test_delegation.py::test_a_hop_cannot_pass_on_authority_it_does_not_hold
  codes:
  - SCOPE_NOT_ATTENUATED
  scope: local-reference
  limits: Attenuation does not establish correctness or benevolence of an authorised action.
  observation: SCOPE_NOT_ATTENUATED
- id: P5
  name: Mediated context
  family: Decision and composition
  rule: The gate alone reads records, and returns grant ∩ request ∩ live consent ∩ zone.
  controls:
  - DAT-1
  - DAT-2
  verify:
  - tests/test_tbc_sdk.py::test_lease_expiry_and_task_expiry_are_checked_on_use
  codes:
  - CONTEXT_SCOPE_DENIED
  scope: local-reference
  limits: Purpose identifiers select policy; they do not prove the model’s intention or source truth.
  observation: CONTEXT_SCOPE_DENIED
- id: P6
  name: Reauthorised memory
  family: Decision and composition
  rule: Stored context carries provenance and retention, and is rechecked against live authority.
  controls:
  - SWM-8
  verify:
  - tests/test_tbc_sdk.py::test_memory_integrity_retention_scope_and_reauthorization
  codes:
  - MEMORY_REAUTHORIZATION_DENIED
  scope: local-reference
  limits: Restrictions are only as complete as the captured context and provenance; a claim to forget is not
    isolation.
  observation: MEMORY_REAUTHORIZATION_DENIED
- id: P7
  name: Typed effect
  family: Decision and composition
  rule: An effect names operation, resource, expected version and state; approval signs that digest.
  controls:
  - AUT-1
  - AUT-2
  - AUT-3
  - AUT-4
  - EFF-1
  - EFF-2
  - EFF-3
  verify:
  - tests/test_approval_boundary.py::test_executor_independently_refuses_signed_self_approval
  codes:
  - RESOURCE_RIGHTS_DENIED
  scope: local-reference
  limits: External effects require qualified adapters and reconciliation. A receipt does not make an irreversible
    effect reversible.
  observation: RESOURCE_RIGHTS_DENIED
- id: P8
  name: Sealed release
  family: Decision and composition
  rule: Release is a named review of exact bytes to an authenticated recipient, used once.
  controls:
  - DAT-2
  - DAT-3
  - DAT-4
  verify:
  - tests/test_tbc_sdk.py::test_memory_and_generated_output_cannot_drop_session_lineage
  codes:
  - DESTINATION_DENIED
  scope: local-reference
  limits: Already disclosed bytes cannot be recalled; redaction is not a general de-identification guarantee.
  observation: DESTINATION_DENIED
- id: P9
  name: Restricting monitor
  family: Decision and composition
  rule: A monitor may contract authority. It can never grant any.
  controls:
  - SWM-7
  verify:
  - tests/test_monitor_evaluation.py::test_a_hostile_monitor_costs_availability_not_authority
  codes: []
  scope: local-reference
  limits: A hostile monitor can deny service. It must not expand authority.
  observation: contraction only
- id: P10
  name: Declared task graph
  family: Decision and composition
  rule: The agent and message graph is declared; a gate admits each node and edge before use.
  controls:
  - SWM-3
  - SWM-5
  verify:
  - tests/test_tbc_composition_controls.py::test_declared_graph_admits_each_node_and_edge_before_use
  codes:
  - AIRLOCK_CHANNEL_DENIED
  scope: local-reference
  limits: The declared graph must include every actual channel. Orchestrator-scale completeness is a deployment
    obligation.
  observation: AIRLOCK_CHANNEL_DENIED
- id: P11
  name: Intent before effect
  family: Evidence and lifecycle
  rule: Record what is about to cross a boundary before it crosses; an unclosed intent is a recoverable signal
  controls:
  - EVD-1
  - EVD-2
  verify:
  - tests/test_import_api.py::test_import_gateway_records_an_unclosed_intent_when_delivery_fails
  codes: []
  scope: local-reference
  limits: Intent records identify incomplete work; durable mutation-and-outcome atomicity depends on the chosen
    backend.
  observation: no evidence write authority
- id: P12
  name: Witnessed checkpoints
  family: Evidence and lifecycle
  rule: Sign the ledger's count and head; an out-of-process witness co-signs only heads that extend what it
    already signed
  controls:
  - EVD-3
  - EVD-6
  - EVD-7
  - EVD-8
  verify:
  - tests/test_witness.py::test_an_enforcer_holding_the_notary_key_cannot_get_a_rewritten_past_cosigned
  codes:
  - WITNESS_FORK
  scope: deployment-dependent
  limits: Independent administration and external retention must be established in deployment. Witnesses cannot
    prevent a compromised enforcer from signing new false events.
  observation: WITNESS_FORK
- id: P13
  name: Divergence-refusing archive
  family: Evidence and lifecycle
  rule: Keep a second copy under other administration; refuse to archive a primary that got shorter or different
  controls:
  - EVD-9
  verify:
  - tests/test_tier_equivalence.py::test_rewritten_ledger_is_refused
  codes: []
  scope: deployment-dependent
  limits: Detects divergence against the retained archive; it does not establish truth of original events or
    independence of administrators.
  observation: ARCHIVE_DIVERGED
- id: P14
  name: Recompute, never read
  family: Evidence and lifecycle
  rule: A separate process recomputes every hash from the archived copy; incremental passes are anchored and
    a full pass recurs
  controls:
  - EVD-4
  verify:
  - tests/test_small_data.py::test_incremental_pass_catches_a_bad_new_record_and_a_changed_head
  codes: []
  scope: deployment-dependent
  limits: Incremental passes do not re-read all earlier records; detection latency depends on full-verification
    cadence and retained anchors.
  observation: VERIFIED_HEAD_CHANGED
- id: P15
  name: Signed crossing
  family: Evidence and lifecycle
  rule: Inputs are source-signed at the gateway and MAC-sealed onward; the sink recomputes the content hash
    before any commit
  controls:
  - EVD-10
  verify:
  - tests/test_small_data.py::test_content_hash_mismatch_commits_nothing
  codes: []
  scope: deployment-dependent
  limits: Authenticated origin is not truth; signing keys and source identity must be protected.
  observation: invalid import envelope or content hash
- id: P16
  name: Quarantine by position
  family: Evidence and lifecycle
  rule: A rejected record is kept as its position and a hash of its bytes, never its content; the stream continues
  controls:
  - EVD-10
  verify:
  - tests/test_small_data.py::test_forged_record_is_quarantined_by_position_not_content
  codes: []
  scope: local-reference
  limits: Positions and hashes remain metadata requiring access controls and retention limits.
  observation: envelope MAC missing or invalid
- id: P17
  name: No silent loss
  family: Evidence and lifecycle
  rule: Logs carry a generation; a reset, truncation or gap stops the sink instead of being skipped
  controls:
  - EVD-10
  verify:
  - tests/test_small_data.py::test_a_record_deleted_before_import_stops_the_sink
  codes: []
  scope: deployment-dependent
  limits: Continuity checks cover declared logs and generations, not unknown events never recorded by the source.
  observation: a record was deleted before it was imported
- id: P18
  name: Assurance bound to exact code
  family: Evidence and lifecycle
  rule: A backend inherits no assurance until conformance ran on its exact implementation digest
  controls:
  - ASR-8
  verify:
  - tests/kernel/test_kernel_assurance.py::test_code_changed_after_the_run_refuses
  codes:
  - ASSURANCE_IMPLEMENTATION_CHANGED
  scope: deployment-dependent
  limits: A digest pins identity, not correctness. A passing conformance suite supports only its exercised
    properties.
  observation: ASSURANCE_IMPLEMENTATION_CHANGED
- id: P19
  name: Kernel floor
  family: Evidence and lifecycle
  rule: A domain pack may tighten the kernel, never loosen it; a weakening pack stops the server from starting
  controls:
  - GOV-5
  verify:
  - tests/test_profile_floor.py::test_the_runtime_refuses_to_start_with_a_weakened_pack
  codes:
  - PACK_NON_HUMAN_APPROVER
  scope: local-reference
  limits: The kernel floor is itself trusted policy and must be reviewed; pack validation does not establish
    regulatory compliance.
  observation: PACK_NON_HUMAN_APPROVER
- id: P20
  name: Fail-secure declaration
  family: Evidence and lifecycle
  rule: A deployment that declares itself pilot or production refuses to start with a teaching default or an
    unknown declaration
  controls:
  - GOV-6
  verify:
  - tests/test_production_posture.py::test_a_pilot_with_teaching_defaults_refuses_to_start
  codes: []
  scope: deployment-dependent
  limits: A configuration declaration does not prove physical deployment. Startup checks cover recognised settings.
  observation: TEACHING_APPROVAL_KEY
- id: P21
  name: Proportionate evidence plane
  family: Evidence and lifecycle
  rule: The decision plane is identical at every scale; only the evidence plane is sized, and its verdicts
    must not change
  controls:
  - ASR-9
  verify:
  - tests/test_tier_equivalence.py::test_missing_tail_is_caught_only_by_the_signed_checkpoint
  codes: []
  scope: deployment-dependent
  limits: Equivalence is bounded to the exercised scenarios. Backend concurrency and failure modes may differ;
    cost measurements are host-specific.
  observation: BIG_TIER_WITHOUT_BROKER
- id: P22
  name: Erasure by key destruction
  family: Evidence and lifecycle
  rule: Subject data is sealed under custody keys; erasure destroys the key, so backups, indexes and restores
    stay unreadable
  controls:
  - DAT-7
  verify:
  - tests/test_custody_persistence.py::test_a_database_restore_does_not_resurrect_an_erased_subject
  codes:
  - CUSTODY_KEY_DESTROYED
  scope: deployment-dependent
  limits: Erasure requires destruction of every usable key copy; exported plaintext and independent key backups
    remain outside this guarantee.
  observation: CUSTODY_KEY_DESTROYED
- id: P23
  name: Contained agent cell
  family: Containment and visibility
  rule: Qualify each deployed agent cell from inside its actual host boundary; refuse unmet or unmeasurable
    requirements.
  controls:
  - IDN-4
  verify:
  - tests/test_agent_cell.py::test_a_real_cell_is_isolated_when_measured_from_inside
  codes: []
  scope: deployment-dependent
  limits: A local container probe is a host observation, not proof against kernel exploits or evidence that
    every swarm worker is isolated.
  observation: CELL_NOT_ISOLATED
- id: P24
  name: Bounded execution
  family: Containment and visibility
  rule: Generated code runs in a separate interpreter with an empty environment, limits recorded by the parent,
    and a timeout that kills its process group
  controls:
  - IDN-5
  verify:
  - tests/integration/test_integration_sandbox.py::test_wall_clock_timeout_kills_the_process_group
  codes: []
  scope: deployment-dependent
  limits: A process under the same operating-system user is not a strong isolation boundary; use a qualified
    cell for hostile code.
  observation: the sandbox requires POSIX rlimits and process groups
- id: P25
  name: Monitor without trust
  family: Containment and visibility
  rule: A monitor can only restrict; across oracle, blind and hostile monitors and the live-model adapter,
    no protected outcome changes
  controls:
  - SWM-7
  verify:
  - tests/test_monitor_evaluation.py::test_a_hostile_monitor_costs_availability_not_authority
  codes: []
  scope: bounded-mitigation
  limits: Scripted and stand-in monitor results do not estimate production detector accuracy; an in-policy
    attack can evade detection.
  observation: finding outside the declared vocabulary
- id: P26
  name: Metadata-only visibility
  family: Containment and visibility
  rule: Monitors see task metadata and the evidence head; metrics export counters; neither carries protected
    text, so watching cannot become a data path
  controls:
  - EVD-5
  - DAT-5
  verify:
  - tests/test_agent_dossier.py::test_the_dossier_holds_no_protected_content
  codes: []
  scope: local-reference
  limits: Metadata can identify people or reveal activity; avoid protected payloads and apply access controls
    and retention limits.
  observation: metadata only, by construction
- id: P27
  name: Measured covert channels
  family: Containment and visibility
  rule: Compute and declare capacity for the explicitly modelled release choices; report unbounded or unmeasured
    dimensions.
  controls:
  - DAT-6
  verify:
  - tests/test_covert_channels.py::test_the_measured_leak_never_exceeds_the_declared_capacity
  codes: []
  scope: bounded-mitigation
  limits: Only modelled choices are measured. Unmodelled timing, count, payload and side channels may exceed
    the declared capacity.
  observation: EgressBudgetExhausted
- id: P28
  name: Self-describing deployment
  family: Containment and visibility
  rule: Publish declared and undeclared limits and derive agent dossiers from mediated state and integrity-checked
    receipts.
  controls:
  - GOV-6
  - EVD-5
  verify:
  - tests/test_api.py::test_health_publishes_what_this_deployment_has_declared
  codes: []
  scope: local-reference
  limits: A dossier reports mediated records and declared limits, not hidden behavior or model reasoning.
  observation: 'not declared: approvals are unlimited and the ceiling is unbounded'
- id: P29
  name: Evidence-grounded effect
  family: Correctness and consequence
  rule: The source confirms only the value its own record supports; a wrong or steered value never gets the
    confirmation an approval needs
  controls:
  - AUT-6
  verify:
  - tests/test_behaviour_watch.py::test_a_steered_wrong_value_is_refused_at_the_sources_confirmation
  codes:
  - UNSUPPORTED_PROPOSAL
  scope: bounded-mitigation
  limits: Source confirmation proves consistency with a configured source, not that the source is correct,
    fair or current.
  observation: UNSUPPORTED_PROPOSAL
- id: P30
  name: Mandate linting
  family: Correctness and consequence
  rule: A task contract is checked against its declared purpose and a corpus of known-bad mandates; any excess
    stops it starting
  controls:
  - GOV-5
  verify:
  - tests/test_mandate_lint.py::test_with_declared_purposes_an_over_broad_mandate_does_not_start
  codes: []
  scope: bounded-mitigation
  limits: A wrong purpose profile or incomplete known-bad corpus can admit a harmful mandate.
  observation: MANDATE_UNNEEDED_OPERATION
- id: P31
  name: Behaviour watch
  family: Correctness and consequence
  rule: Boundary probing is counted from receipts and sandbagging measured on canaries; findings restrict the
    task, never grant
  controls:
  - SWM-7
  verify:
  - tests/test_behaviour_watch.py::test_an_agent_probing_its_boundary_is_quarantined
  codes: []
  scope: bounded-mitigation
  limits: Canaries and boundary-probing heuristics can miss strategic behavior that stays within the tested
    observables.
  observation: BOUNDARY_PROBING
- id: P32
  name: Delayed commitment
  family: Correctness and consequence
  rule: An approved effect waits out a window in which objection, revocation or an epoch change cancels it;
    it commits once, rechecked
  controls:
  - AUT-5
  verify:
  - tests/test_effect_escrow.py::test_revoking_the_agent_during_the_window_cancels_at_commit
  codes:
  - OBJECTION_WINDOW_CLOSED
  scope: bounded-mitigation
  limits: Objection windows delay effects; effects delivered after a valid window still cannot necessarily
    be undone.
  observation: OBJECTION_WINDOW_CLOSED
- id: P33
  name: Reviewer canaries
  family: Correctness and consequence
  rule: Use declared review capacity and non-executing canaries to restrict review authority under the configured
    calibration model.
  controls:
  - OVS-1
  - OVS-2
  - OVS-3
  - OVS-4
  - OVS-5
  verify:
  - tests/test_review_calibration.py::test_a_reviewer_who_approves_canaries_loses_capacity_and_gains_a_second_reviewer
  codes: []
  scope: bounded-mitigation
  limits: Synthetic calibration is not a human study; recognisable canaries and manual-route outcomes need
    field evaluation.
  observation: REVIEWER_CALIBRATION_LOW
- id: P34
  name: Channel budget
  family: Correctness and consequence
  rule: Each release is charged the bits its open choices can carry against a task budget; past it, releases
    go to a person
  controls:
  - DAT-6
  verify:
  - tests/test_channel_budget.py::test_releases_past_the_channel_budget_go_to_a_person
  codes:
  - CHANNEL_BUDGET_EXHAUSTED
  scope: bounded-mitigation
  limits: Enforcement applies to the declared channel model and observed releases; it is not a bound on all
    information leakage.
  observation: CHANNEL_BUDGET_EXHAUSTED
