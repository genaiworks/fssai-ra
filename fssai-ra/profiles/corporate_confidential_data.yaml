# Corporate confidential-data governance domain pack.
#
# This is a synthetic teaching profile for governing authorization state around
# sensitive corporate datasets. It does not store corporate data, grant cloud
# permissions, or establish compliance with any named framework.
profile_id: corporate-confidential-data
version: "1.0"
title: Corporate Confidential Data Access and Release
resource_name: governed_dataset_request
owner: enterprise_data_governance
manual_fallback: >-
  Keep the dataset unchanged and inaccessible. Route the request to the named
  data owner and information-security reviewer through the organization's
  existing access-request or legal-hold process.
governance:
  domain: corporate-data
  purpose: Govern classification, approved internal use, external release, revocation, and legal hold for sensitive corporate datasets.
  deployment_profile: teaching
  data_classes: [internal, confidential, restricted, trade-secret, approved-aggregate]
  applicable_frameworks:
    - Organization-specific information classification and acceptable-use policy
    - Applicable privacy, contractual, records-retention, and breach-notification obligations
  prohibited_uses:
    - External release without data-owner and disclosure authority
    - Model training or profiling outside the approved purpose
    - Removing a legal hold through an automated recommendation
    - Expanding access beyond the exact dataset, purpose, recipient, and duration reviewed
  processing_basis: A documented business purpose approved by the data owner and any required privacy, legal, or contractual authority.
  data_minimization_rule: Authorize only the exact dataset, fields, recipients, purpose, and duration required for the approved use.
  retention_rule: Retain access decisions and evidence under the applicable records schedule and any active legal hold.
  deletion_rule: Revoke access and delete working copies when purpose or retention expires unless a legal hold requires preservation.
  residency_rule: Store and process data only in organization-approved regions and systems recorded in the deployment contract.
  incident_response: Suspend affected access, preserve evidence, notify security, privacy, legal, and the data owner, and enter the approved response process.
  owners:
    data: enterprise_data_governance
    privacy: data_protection_officer
    security: chief_information_security_officer
# What may be read into a model context, where, for whom, and what may leave.
# Enforced by fssaira.disclosure.DisclosureGate; verified by `fssaira disclosure`.
disclosure:
  subject_kind: customer-account
  purposes: [internal-analysis, external-release, legal-review]
  fields:
    account_name: {class: internal}
    headcount_by_team: {class: internal}
    revenue_forecast: {class: confidential}
    pipeline_value: {class: confidential}
    contract_terms: {class: restricted}
    customer_contacts: {class: restricted}
    product_roadmap: {class: trade-secret}
  model_endpoints:
    private_model: corporate-private
    contracted_vendor_model: vendor-contracted
    public_model_api: external
  class_zones:
    internal: [corporate-private, vendor-contracted]
    confidential: [corporate-private, vendor-contracted]
    restricted: [corporate-private]
    trade-secret: [corporate-private]
    approved-aggregate: [corporate-private, vendor-contracted, external]
  recipients:
    finance_analyst:
      classes: [internal, confidential]
      purposes: [internal-analysis]
      zone: corporate-private
    legal_counsel:
      classes: [internal, confidential, restricted, trade-secret]
      purposes: [legal-review]
      zone: corporate-private
    external_counsel:
      classes: [internal, confidential, restricted]
      purposes: [legal-review]
      zone: vendor-contracted
    external_partner:
      classes: [approved-aggregate]
      purposes: [external-release]
      zone: external
    vendor_analytics:
      classes: [internal]
      purposes: [internal-analysis]
      zone: vendor-contracted
    personal_email:
      classes: []
      purposes: []
      zone: external
  declassification:
    - name: aggregate_for_external_release
      from_classes: [internal, confidential]
      to_class: approved-aggregate
      purposes: [external-release]
      approval_role: data_protection_officer
      removes_subject_identity: true
transitions:
  - operation: classify_dataset
    from_status: draft
    to_status: classified
    consequential: false
    approval_role: data_steward

  - operation: authorize_internal_use
    from_status: classified
    to_status: internal_use_authorized
    consequential: true
    approval_role: data_owner

  - operation: authorize_external_release
    from_status: internal_use_authorized
    to_status: external_release_authorized
    consequential: true
    approval_role: data_protection_officer

  - operation: revoke_internal_use
    from_status: internal_use_authorized
    to_status: access_revoked
    consequential: true
    approval_role: security_officer

  - operation: place_legal_hold
    from_status: classified
    to_status: legal_hold
    consequential: true
    approval_role: legal_counsel

  - operation: release_legal_hold
    from_status: legal_hold
    to_status: classified
    consequential: true
    approval_role: legal_counsel

# Kernel-floor control contracts (pack_floor.check_pack). Reference values for
# this synthetic profile: an adopting institution replaces the owners, capacity and
# responses with its own signed-off decisions.
controls:
  authorize_internal_use:
    protected_asset: The governed dataset request status changed by authorize_internal_use
    permitted_operation: A data_owner approves one exact authorize_internal_use (classified to internal_use_authorized) at the reviewed version
    enforcement_point: execution_mediator
    owner: data_owner
    failure_test: tests/test_profile_floor.py::test_corporate_confidential_data_controls_refuse_unauthorized_execution
    evidence_artifact: Execution receipt binding the proposal digest and the data_owner approval, with intent and outcome evidence
    failure_response: Deny, record the refusal, and route the unchanged governed dataset request to manual review
  authorize_external_release:
    protected_asset: The governed dataset request status changed by authorize_external_release
    permitted_operation: A data_protection_officer approves one exact authorize_external_release (internal_use_authorized to external_release_authorized) at the reviewed version
    enforcement_point: execution_mediator
    owner: data_protection_officer
    failure_test: tests/test_profile_floor.py::test_corporate_confidential_data_controls_refuse_unauthorized_execution
    evidence_artifact: Execution receipt binding the proposal digest and the data_protection_officer approval, with intent and outcome evidence
    failure_response: Deny, record the refusal, and route the unchanged governed dataset request to manual review
  revoke_internal_use:
    protected_asset: The governed dataset request status changed by revoke_internal_use
    permitted_operation: A security_officer approves one exact revoke_internal_use (internal_use_authorized to access_revoked) at the reviewed version
    enforcement_point: execution_mediator
    owner: security_officer
    failure_test: tests/test_profile_floor.py::test_corporate_confidential_data_controls_refuse_unauthorized_execution
    evidence_artifact: Execution receipt binding the proposal digest and the security_officer approval, with intent and outcome evidence
    failure_response: Deny, record the refusal, and route the unchanged governed dataset request to manual review
  place_legal_hold:
    protected_asset: The governed dataset request status changed by place_legal_hold
    permitted_operation: A legal_counsel approves one exact place_legal_hold (classified to legal_hold) at the reviewed version
    enforcement_point: execution_mediator
    owner: legal_counsel
    failure_test: tests/test_profile_floor.py::test_corporate_confidential_data_controls_refuse_unauthorized_execution
    evidence_artifact: Execution receipt binding the proposal digest and the legal_counsel approval, with intent and outcome evidence
    failure_response: Deny, record the refusal, and route the unchanged governed dataset request to manual review
  release_legal_hold:
    protected_asset: The governed dataset request status changed by release_legal_hold
    permitted_operation: A legal_counsel approves one exact release_legal_hold (legal_hold to classified) at the reviewed version
    enforcement_point: execution_mediator
    owner: legal_counsel
    failure_test: tests/test_profile_floor.py::test_corporate_confidential_data_controls_refuse_unauthorized_execution
    evidence_artifact: Execution receipt binding the proposal digest and the legal_counsel approval, with intent and outcome evidence
    failure_response: Deny, record the refusal, and route the unchanged governed dataset request to manual review

  # Data capabilities the kernel requires of any pack with a disclosure policy.
  # Their failure tests exercise the shared kernel mediators this profile uses.
  read_protected_context:
    protected_asset: Protected records placed into a model context
    permitted_operation: A holder reads named fields of named subjects for a declared purpose
    enforcement_point: context_gate
    owner: data_protection_officer
    failure_test: tests/test_education_pack.py::test_unnecessary_sensitive_fields_are_denied
    evidence_artifact: Disclosure intent and outcome records with digests, never values
    failure_response: Deny, release nothing, and record the refusal code
  release_labelled_output:
    protected_asset: A model output derived from protected records
    permitted_operation: Release to a recipient whose clearance dominates the output label
    enforcement_point: release_gate
    owner: data_protection_officer
    failure_test: tests/test_education_pack.py::test_model_cannot_self_declassify_a_summary
    evidence_artifact: Release receipt with the output label and content digest
    failure_response: Deny the release and keep the output labelled
  restore_identity:
    protected_asset: The link between a token and a real subject
    permitted_operation: Restore identity only for a recipient cleared for identity fields
    enforcement_point: release_gate
    owner: data_protection_officer
    failure_test: tests/test_education_pack.py::test_identity_is_restored_only_for_entitled_recipients
    evidence_artifact: Identity restoration record naming the release receipt
    failure_response: Release tokens only and record the refusal
  delegate_authority:
    protected_asset: Authority passed from one agent to another
    permitted_operation: Delegate an equal or narrower slice for the same purpose and a shorter time
    enforcement_point: delegation_verifier
    owner: chief_information_security_officer
    failure_test: tests/test_education_pack.py::test_delegated_agent_cannot_escalate
    evidence_artifact: Verified grant chain with the effective scope
    failure_response: Refuse the chain and record the escalation attempt
  erase_subject:
    protected_asset: Every governed copy of a subject's data
    permitted_operation: The privacy owner erases a subject by destroying the subject's keys
    enforcement_point: key_custody
    owner: data_protection_officer
    failure_test: tests/test_privacy_custody.py::test_erasure_reaches_backups_tokens_indexes_and_outputs
    evidence_artifact: Erasure certificate and a read-back verification of every governed copy
    failure_response: Report every readable location and keep the request open

# Declared review capacity. Overload defers to the manual route; it never approves.
review:
  capacity_per_window: 60
  window_seconds: 3600
  queue_limit: 100
  timeout_seconds: 1800
  overload_policy: defer_to_manual
  escalation_role: enterprise_data_governance
