profile_id: student-support
version: "1.0"
title: Student Support Review
resource_name: support_case
owner: student_services
manual_fallback: Route the unchanged case to an authorized officer for manual review.
governance:
  domain: education-support
  purpose: Prepare synthetic student-support cases for review without allowing a model to award benefits or disclose records.
  deployment_profile: teaching
  data_classes: [synthetic-education-record, restricted]
  applicable_frameworks: [institution-specific student-record and privacy obligations]
  prohibited_uses:
    - Making an award or eligibility decision without the named human authority
    - External disclosure of a case through a model or tool
    - Training a model on real student records under this teaching profile
  processing_basis: Institution-approved student-support administration using synthetic cases only.
  data_minimization_rule: Include only fields required to prepare the assigned case for named-officer review.
  retention_rule: Retain synthetic decision evidence for the declared appeal and assurance period.
  deletion_rule: Delete expired synthetic case content while preserving only evidence the approved retention rule requires.
  residency_rule: Store all artifacts only in institution-approved locations declared by the deployment.
  incident_response: Freeze automated actions, preserve evidence, notify the named owners, and route cases to manual review.
  owners:
    data: student_services
    privacy: institutional_privacy_officer
    security: information_security
transitions:
  - operation: prepare_case_for_review
    from_status: draft
    to_status: ready_for_officer_review
    consequential: true
    approval_role: student_support_officer
  - operation: return_case_for_correction
    from_status: ready_for_officer_review
    to_status: draft
    consequential: true
    approval_role: student_support_officer

# Kernel-floor control contracts (pack_floor.check_pack). Reference values for
# this synthetic profile: an adopting institution replaces the owners, capacity and
# responses with its own signed-off decisions.
controls:
  prepare_case_for_review:
    protected_asset: The support case status changed by prepare_case_for_review
    permitted_operation: A student_support_officer approves one exact prepare_case_for_review (draft to ready_for_officer_review) at the reviewed version
    enforcement_point: execution_mediator
    owner: student_support_officer
    failure_test: tests/test_profile_floor.py::test_student_support_controls_refuse_unauthorized_execution
    evidence_artifact: Execution receipt binding the proposal digest and the student_support_officer approval, with intent and outcome evidence
    failure_response: Deny, record the refusal, and route the unchanged support case to manual review
  return_case_for_correction:
    protected_asset: The support case status changed by return_case_for_correction
    permitted_operation: A student_support_officer approves one exact return_case_for_correction (ready_for_officer_review to draft) at the reviewed version
    enforcement_point: execution_mediator
    owner: student_support_officer
    failure_test: tests/test_profile_floor.py::test_student_support_controls_refuse_unauthorized_execution
    evidence_artifact: Execution receipt binding the proposal digest and the student_support_officer approval, with intent and outcome evidence
    failure_response: Deny, record the refusal, and route the unchanged support case to manual review

# Declared review capacity. Overload defers to the manual route; it never approves.
review:
  capacity_per_window: 60
  window_seconds: 3600
  queue_limit: 100
  timeout_seconds: 1800
  # Minimum time between presenting a proposal to a reviewer and approving it.
  # 60 approvals x 45 s = 45 minutes of a 60-minute window: the quota and the
  # floor are consistent. Enforced by the oversight monitor on every approval.
  min_deliberation_seconds: 45
  overload_policy: defer_to_manual
  escalation_role: student_services
