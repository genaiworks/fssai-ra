# Financial services consumer-data domain pack.
#
# A synthetic teaching profile for an AI assistant in consumer lending and fraud
# operations. It governs credit-limit decisions, fraud holds, and what customer
# data may reach a model. It makes no credit decision itself and establishes no
# compliance with any consumer-finance, fair-lending, or credit-reporting law.
profile_id: financial-consumer-data
version: "1.0"
title: Consumer Credit Decisions and Fraud Operations
resource_name: consumer_credit_request
owner: consumer_lending_operations
manual_fallback: >-
  Leave the account and credit limit unchanged. Route the customer to a named
  credit officer or fraud investigator through the staffed servicing queue, and
  give the customer the institution's standard contact and dispute route.
governance:
  domain: financial-services
  purpose: Govern credit-limit decisions, fraud holds, and purpose-bound use of consumer financial data by AI assistants.
  deployment_profile: teaching
  data_classes: [customer-identifier, account-financial, credit-bureau, transaction-history, fraud-signal, aggregate-statistics]
  applicable_frameworks:
    - Applicable consumer financial privacy, fair lending, credit reporting, and adverse-action notice obligations
    - Organization-specific model risk management, complaints, and fraud-operations policy
  prohibited_uses:
    - Adverse credit decisions without a named accountable officer and stated reasons
    - Use of protected characteristics or their proxies in credit decisions
    - Marketing or sale of customer data without consent
    - Model training on identifiable customer data under this teaching profile
  processing_basis: The customer relationship, a credit application, a fraud investigation, or a regulatory reporting duty approved for the specific request.
  data_minimization_rule: Authorize only the customer, fields, purpose, recipients, and duration required for the decision or investigation.
  retention_rule: Retain decisions, reasons, and evidence for the approved credit, complaints, and regulatory record periods.
  deletion_rule: Revoke access and delete working copies when the purpose ends, except records under regulatory retention or legal hold.
  residency_rule: Process customer data only in institution-approved regions and systems recorded in the deployment contract.
  incident_response: Suspend affected access, preserve evidence, notify security, privacy, compliance, and the data owner, and follow the approved breach and customer-notification process.
  owners:
    data: consumer_data_governance
    privacy: chief_privacy_officer
    security: chief_information_security_officer
disclosure:
  subject_kind: customer
  purposes: [credit-decision, fraud-investigation, customer-access, regulatory-reporting]
  fields:
    customer_name: {class: customer-identifier}
    account_number: {class: customer-identifier}
    account_balance: {class: account-financial}
    declared_income: {class: account-financial}
    credit_score: {class: credit-bureau}
    transaction_history: {class: transaction-history}
    fraud_score: {class: fraud-signal}
  model_endpoints:
    bank_private_model: bank-private
    contracted_vendor_model: vendor-contracted
    public_model_api: external
  class_zones:
    customer-identifier: [bank-private]
    account-financial: [bank-private, vendor-contracted]
    credit-bureau: [bank-private]
    transaction-history: [bank-private]
    fraud-signal: [bank-private]
    aggregate-statistics: [bank-private, vendor-contracted, external]
  recipients:
    credit_analyst:
      classes: [customer-identifier, account-financial, credit-bureau]
      purposes: [credit-decision]
      zone: bank-private
    affordability_service:
      classes: [account-financial]
      purposes: [credit-decision]
      zone: vendor-contracted
    fraud_investigator:
      classes: [customer-identifier, account-financial, transaction-history, fraud-signal]
      purposes: [fraud-investigation]
      zone: bank-private
    customer_portal:
      classes: [customer-identifier, account-financial, credit-bureau, transaction-history]
      purposes: [customer-access]
      zone: bank-private
      subject_scope: self
    regulator_reporting:
      classes: [aggregate-statistics]
      purposes: [regulatory-reporting]
      zone: external
    marketing_partner:
      classes: []
      purposes: []
      zone: external
  declassification:
    - name: aggregate_for_regulatory_reporting
      from_classes: [account-financial, credit-bureau, transaction-history]
      to_class: aggregate-statistics
      purposes: [regulatory-reporting]
      approval_role: compliance_officer
      removes_subject_identity: true
  break_glass:
    purposes: [fraud-investigation]
    max_ttl_seconds: 1800
    max_unreviewed_per_holder: 1
    review_role: compliance_officer
transitions:
  - operation: verify_customer_identity
    from_status: draft
    to_status: identity_verified
    consequential: false
    approval_role: customer_service_agent

  - operation: request_credit_limit_change
    from_status: identity_verified
    to_status: awaiting_credit_review
    consequential: true
    approval_role: credit_analyst

  - operation: approve_credit_limit_change
    from_status: awaiting_credit_review
    to_status: credit_limit_changed
    consequential: true
    approval_role: credit_risk_officer

  - operation: decline_credit_limit_change
    from_status: awaiting_credit_review
    to_status: credit_declined
    consequential: true
    approval_role: credit_risk_officer

  - operation: place_fraud_hold
    from_status: identity_verified
    to_status: fraud_hold
    consequential: true
    approval_role: fraud_investigator

  - operation: release_fraud_hold
    from_status: fraud_hold
    to_status: identity_verified
    consequential: true
    approval_role: compliance_officer

# Kernel-floor control contracts (pack_floor.check_pack). Reference values for
# this synthetic profile: an adopting institution replaces the owners, capacity and
# responses with its own signed-off decisions.
controls:
  request_credit_limit_change:
    protected_asset: The consumer credit request status changed by request_credit_limit_change
    permitted_operation: A credit_analyst approves one exact request_credit_limit_change (identity_verified to awaiting_credit_review) at the reviewed version
    enforcement_point: execution_mediator
    owner: credit_analyst
    failure_test: tests/test_profile_floor.py::test_financial_consumer_data_controls_refuse_unauthorized_execution
    evidence_artifact: Execution receipt binding the proposal digest and the credit_analyst approval, with intent and outcome evidence
    failure_response: Deny, record the refusal, and route the unchanged consumer credit request to manual review
  approve_credit_limit_change:
    protected_asset: The consumer credit request status changed by approve_credit_limit_change
    permitted_operation: A credit_risk_officer approves one exact approve_credit_limit_change (awaiting_credit_review to credit_limit_changed) at the reviewed version
    enforcement_point: execution_mediator
    owner: credit_risk_officer
    failure_test: tests/test_profile_floor.py::test_financial_consumer_data_controls_refuse_unauthorized_execution
    evidence_artifact: Execution receipt binding the proposal digest and the credit_risk_officer approval, with intent and outcome evidence
    failure_response: Deny, record the refusal, and route the unchanged consumer credit request to manual review
  decline_credit_limit_change:
    protected_asset: The consumer credit request status changed by decline_credit_limit_change
    permitted_operation: A credit_risk_officer approves one exact decline_credit_limit_change (awaiting_credit_review to credit_declined) at the reviewed version
    enforcement_point: execution_mediator
    owner: credit_risk_officer
    failure_test: tests/test_profile_floor.py::test_financial_consumer_data_controls_refuse_unauthorized_execution
    evidence_artifact: Execution receipt binding the proposal digest and the credit_risk_officer approval, with intent and outcome evidence
    failure_response: Deny, record the refusal, and route the unchanged consumer credit request to manual review
  place_fraud_hold:
    protected_asset: The consumer credit request status changed by place_fraud_hold
    permitted_operation: A fraud_investigator approves one exact place_fraud_hold (identity_verified to fraud_hold) at the reviewed version
    enforcement_point: execution_mediator
    owner: fraud_investigator
    failure_test: tests/test_profile_floor.py::test_financial_consumer_data_controls_refuse_unauthorized_execution
    evidence_artifact: Execution receipt binding the proposal digest and the fraud_investigator approval, with intent and outcome evidence
    failure_response: Deny, record the refusal, and route the unchanged consumer credit request to manual review
  release_fraud_hold:
    protected_asset: The consumer credit request status changed by release_fraud_hold
    permitted_operation: A compliance_officer approves one exact release_fraud_hold (fraud_hold to identity_verified) at the reviewed version
    enforcement_point: execution_mediator
    owner: compliance_officer
    failure_test: tests/test_profile_floor.py::test_financial_consumer_data_controls_refuse_unauthorized_execution
    evidence_artifact: Execution receipt binding the proposal digest and the compliance_officer approval, with intent and outcome evidence
    failure_response: Deny, record the refusal, and route the unchanged consumer credit request to manual review

  # Data capabilities the kernel requires of any pack with a disclosure policy.
  # Their failure tests exercise the shared kernel mediators this profile uses.
  read_protected_context:
    protected_asset: Protected records placed into a model context
    permitted_operation: A holder reads named fields of named subjects for a declared purpose
    enforcement_point: context_gate
    owner: chief_privacy_officer
    failure_test: tests/test_education_pack.py::test_unnecessary_sensitive_fields_are_denied
    evidence_artifact: Disclosure intent and outcome records with digests, never values
    failure_response: Deny, release nothing, and record the refusal code
  release_labelled_output:
    protected_asset: A model output derived from protected records
    permitted_operation: Release to a recipient whose clearance dominates the output label
    enforcement_point: release_gate
    owner: chief_privacy_officer
    failure_test: tests/test_education_pack.py::test_model_cannot_self_declassify_a_summary
    evidence_artifact: Release receipt with the output label and content digest
    failure_response: Deny the release and keep the output labelled
  restore_identity:
    protected_asset: The link between a token and a real subject
    permitted_operation: Restore identity only for a recipient cleared for identity fields
    enforcement_point: release_gate
    owner: chief_privacy_officer
    failure_test: tests/test_education_pack.py::test_identity_is_restored_only_for_entitled_recipients
    evidence_artifact: Identity restoration record naming the release receipt
    failure_response: Release tokens only and record the refusal
  delegate_authority:
    protected_asset: Authority passed from one agent to another
    permitted_operation: Delegate an equal or narrower slice for the same purpose and a shorter time
    enforcement_point: delegation_verifier
    owner: chief_information_security_officer
    failure_test: tests/test_education_pack.py::test_delegated_agent_cannot_escalate
    evidence_artifact: Verified grant chain with the effective scope
    failure_response: Refuse the chain and record the escalation attempt
  erase_subject:
    protected_asset: Every governed copy of a subject's data
    permitted_operation: The privacy owner erases a subject by destroying the subject's keys
    enforcement_point: key_custody
    owner: chief_privacy_officer
    failure_test: tests/test_privacy_custody.py::test_erasure_reaches_backups_tokens_indexes_and_outputs
    evidence_artifact: Erasure certificate and a read-back verification of every governed copy
    failure_response: Report every readable location and keep the request open

# Declared review capacity. Overload defers to the manual route; it never approves.
review:
  capacity_per_window: 60
  window_seconds: 3600
  queue_limit: 100
  timeout_seconds: 1800
  # Minimum time between presenting a proposal to a reviewer and approving it.
  # 60 approvals x 45 s = 45 minutes of a 60-minute window: the quota and the
  # floor are consistent. Enforced by the oversight monitor on every approval.
  min_deliberation_seconds: 45
  overload_policy: defer_to_manual
  escalation_role: consumer_lending_operations
