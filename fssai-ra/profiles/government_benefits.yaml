# Government benefits domain pack.
#
# A synthetic teaching profile for an AI assistant in a public benefits agency.
# It governs eligibility decisions, appeals, and what applicant data may reach a
# model. It decides no entitlement itself and establishes no compliance with any
# administrative, social-security, or data-protection law.
profile_id: government-benefits
version: "1.0"
title: Public Benefit Eligibility and Appeals
resource_name: benefit_eligibility_case
owner: benefits_service_delivery
manual_fallback: >-
  Leave the entitlement unchanged and keep any existing payment in place. Route
  the applicant to a named caseworker through the staffed benefits office, and
  give the applicant the agency's standard appeal and complaint route.
governance:
  domain: public-services
  purpose: Govern eligibility decisions, appeals, and purpose-bound use of applicant data by AI assistants in a benefits agency.
  deployment_profile: teaching
  data_classes: [citizen-identifier, household-financial, health-disability, immigration-status, case-notes, statistical-aggregate]
  applicable_frameworks:
    - Applicable administrative law, due process, social-security, equality, and public-sector data protection obligations
    - Organization-specific records management, appeals, safeguarding, and statistical release policy
  prohibited_uses:
    - Fully automated denial of a benefit without a named officer, stated reasons, and an appeal route
    - Sharing applicant data with enforcement or immigration functions outside the declared purpose
    - Profiling or risk scoring on protected characteristics
    - Model training on identifiable applicant records under this teaching profile
  processing_basis: A statutory benefit function, an appeal, a safeguarding duty, or an approved statistical purpose for the specific case.
  data_minimization_rule: Authorize only the applicant, household fields, purpose, recipients, and duration required for the decision or appeal.
  retention_rule: Retain decisions, reasons, appeals, and evidence for the statutory records period.
  deletion_rule: Revoke access and delete working copies when the case closes, except records under statutory retention or legal hold.
  residency_rule: Process applicant data only in government-approved sovereign or accredited systems recorded in the deployment contract.
  incident_response: Suspend affected access, preserve evidence, notify the data protection officer, security, and the service owner, and follow the approved breach and applicant-notification process.
  owners:
    data: benefits_data_steward
    privacy: data_protection_officer
    security: agency_security_officer
disclosure:
  subject_kind: applicant
  purposes: [eligibility-assessment, appeal-review, applicant-access, statistical-reporting, urgent-safeguarding]
  fields:
    applicant_name: {class: citizen-identifier}
    national_id: {class: citizen-identifier}
    household_income: {class: household-financial}
    disability_status: {class: health-disability}
    immigration_status: {class: immigration-status}
    caseworker_notes: {class: case-notes}
  model_endpoints:
    agency_sovereign_model: government-sovereign
    accredited_cloud_model: accredited-cloud
    public_model_api: external
  class_zones:
    citizen-identifier: [government-sovereign]
    household-financial: [government-sovereign, accredited-cloud]
    health-disability: [government-sovereign]
    immigration-status: [government-sovereign]
    case-notes: [government-sovereign, accredited-cloud]
    statistical-aggregate: [government-sovereign, accredited-cloud, external]
  recipients:
    eligibility_officer:
      classes: [citizen-identifier, household-financial, health-disability, case-notes]
      purposes: [eligibility-assessment, urgent-safeguarding]
      zone: government-sovereign
    appeals_officer:
      classes: [citizen-identifier, household-financial, health-disability, case-notes]
      purposes: [appeal-review]
      zone: government-sovereign
    applicant_portal:
      classes: [citizen-identifier, household-financial, health-disability, immigration-status, case-notes]
      purposes: [applicant-access]
      zone: government-sovereign
      subject_scope: self
    payments_system:
      classes: [household-financial]
      purposes: [eligibility-assessment]
      zone: accredited-cloud
    statistics_office:
      classes: [statistical-aggregate]
      purposes: [statistical-reporting]
      zone: accredited-cloud
    enforcement_agency:
      classes: []
      purposes: []
      zone: external
  declassification:
    - name: aggregate_for_official_statistics
      from_classes: [citizen-identifier, household-financial, health-disability, case-notes]
      to_class: statistical-aggregate
      purposes: [statistical-reporting]
      approval_role: data_protection_officer
      removes_subject_identity: true
  break_glass:
    purposes: [urgent-safeguarding]
    max_ttl_seconds: 3600
    max_unreviewed_per_holder: 1
    review_role: data_protection_officer
transitions:
  - operation: verify_applicant_identity
    from_status: draft
    to_status: identity_verified
    consequential: false
    approval_role: intake_officer

  - operation: assess_eligibility
    from_status: identity_verified
    to_status: eligibility_assessed
    consequential: true
    approval_role: eligibility_officer

  - operation: approve_benefit
    from_status: eligibility_assessed
    to_status: benefit_approved
    consequential: true
    approval_role: benefit_approver

  - operation: deny_benefit
    from_status: eligibility_assessed
    to_status: benefit_denied
    consequential: true
    approval_role: benefit_approver

  - operation: open_appeal
    from_status: benefit_denied
    to_status: under_appeal
    consequential: false
    approval_role: appeals_clerk

  - operation: decide_appeal
    from_status: under_appeal
    to_status: eligibility_assessed
    consequential: true
    approval_role: independent_appeals_officer

  - operation: close_case_under_retention_rule
    from_status: benefit_approved
    to_status: case_closed
    consequential: true
    approval_role: data_protection_officer

# Kernel-floor control contracts (pack_floor.check_pack). Reference values for
# this synthetic profile: an adopting institution replaces the owners, capacity and
# responses with its own signed-off decisions.
controls:
  assess_eligibility:
    protected_asset: The benefit eligibility case status changed by assess_eligibility
    permitted_operation: A eligibility_officer approves one exact assess_eligibility (identity_verified to eligibility_assessed) at the reviewed version
    enforcement_point: execution_mediator
    owner: eligibility_officer
    failure_test: tests/test_profile_floor.py::test_government_benefits_controls_refuse_unauthorized_execution
    evidence_artifact: Execution receipt binding the proposal digest and the eligibility_officer approval, with intent and outcome evidence
    failure_response: Deny, record the refusal, and route the unchanged benefit eligibility case to manual review
  approve_benefit:
    protected_asset: The benefit eligibility case status changed by approve_benefit
    permitted_operation: A benefit_approver approves one exact approve_benefit (eligibility_assessed to benefit_approved) at the reviewed version
    enforcement_point: execution_mediator
    owner: benefit_approver
    failure_test: tests/test_profile_floor.py::test_government_benefits_controls_refuse_unauthorized_execution
    evidence_artifact: Execution receipt binding the proposal digest and the benefit_approver approval, with intent and outcome evidence
    failure_response: Deny, record the refusal, and route the unchanged benefit eligibility case to manual review
  deny_benefit:
    protected_asset: The benefit eligibility case status changed by deny_benefit
    permitted_operation: A benefit_approver approves one exact deny_benefit (eligibility_assessed to benefit_denied) at the reviewed version
    enforcement_point: execution_mediator
    owner: benefit_approver
    failure_test: tests/test_profile_floor.py::test_government_benefits_controls_refuse_unauthorized_execution
    evidence_artifact: Execution receipt binding the proposal digest and the benefit_approver approval, with intent and outcome evidence
    failure_response: Deny, record the refusal, and route the unchanged benefit eligibility case to manual review
  decide_appeal:
    protected_asset: The benefit eligibility case status changed by decide_appeal
    permitted_operation: A independent_appeals_officer approves one exact decide_appeal (under_appeal to eligibility_assessed) at the reviewed version
    enforcement_point: execution_mediator
    owner: independent_appeals_officer
    failure_test: tests/test_profile_floor.py::test_government_benefits_controls_refuse_unauthorized_execution
    evidence_artifact: Execution receipt binding the proposal digest and the independent_appeals_officer approval, with intent and outcome evidence
    failure_response: Deny, record the refusal, and route the unchanged benefit eligibility case to manual review
  close_case_under_retention_rule:
    protected_asset: The benefit eligibility case status changed by close_case_under_retention_rule
    permitted_operation: A data_protection_officer approves one exact close_case_under_retention_rule (benefit_approved to case_closed) at the reviewed version
    enforcement_point: execution_mediator
    owner: data_protection_officer
    failure_test: tests/test_profile_floor.py::test_government_benefits_controls_refuse_unauthorized_execution
    evidence_artifact: Execution receipt binding the proposal digest and the data_protection_officer approval, with intent and outcome evidence
    failure_response: Deny, record the refusal, and route the unchanged benefit eligibility case to manual review

  # Data capabilities the kernel requires of any pack with a disclosure policy.
  # Their failure tests exercise the shared kernel mediators this profile uses.
  read_protected_context:
    protected_asset: Protected records placed into a model context
    permitted_operation: A holder reads named fields of named subjects for a declared purpose
    enforcement_point: context_gate
    owner: data_protection_officer
    failure_test: tests/test_education_pack.py::test_unnecessary_sensitive_fields_are_denied
    evidence_artifact: Disclosure intent and outcome records with digests, never values
    failure_response: Deny, release nothing, and record the refusal code
  release_labelled_output:
    protected_asset: A model output derived from protected records
    permitted_operation: Release to a recipient whose clearance dominates the output label
    enforcement_point: release_gate
    owner: data_protection_officer
    failure_test: tests/test_education_pack.py::test_model_cannot_self_declassify_a_summary
    evidence_artifact: Release receipt with the output label and content digest
    failure_response: Deny the release and keep the output labelled
  restore_identity:
    protected_asset: The link between a token and a real subject
    permitted_operation: Restore identity only for a recipient cleared for identity fields
    enforcement_point: release_gate
    owner: data_protection_officer
    failure_test: tests/test_education_pack.py::test_identity_is_restored_only_for_entitled_recipients
    evidence_artifact: Identity restoration record naming the release receipt
    failure_response: Release tokens only and record the refusal
  delegate_authority:
    protected_asset: Authority passed from one agent to another
    permitted_operation: Delegate an equal or narrower slice for the same purpose and a shorter time
    enforcement_point: delegation_verifier
    owner: agency_security_officer
    failure_test: tests/test_education_pack.py::test_delegated_agent_cannot_escalate
    evidence_artifact: Verified grant chain with the effective scope
    failure_response: Refuse the chain and record the escalation attempt
  erase_subject:
    protected_asset: Every governed copy of a subject's data
    permitted_operation: The privacy owner erases a subject by destroying the subject's keys
    enforcement_point: key_custody
    owner: data_protection_officer
    failure_test: tests/test_privacy_custody.py::test_erasure_reaches_backups_tokens_indexes_and_outputs
    evidence_artifact: Erasure certificate and a read-back verification of every governed copy
    failure_response: Report every readable location and keep the request open

# Declared review capacity. Overload defers to the manual route; it never approves.
review:
  capacity_per_window: 60
  window_seconds: 3600
  queue_limit: 100
  timeout_seconds: 1800
  # Minimum time between presenting a proposal to a reviewer and approving it.
  # 60 approvals x 45 s = 45 minutes of a 60-minute window: the quota and the
  # floor are consistent. Enforced by the oversight monitor on every approval.
  min_deliberation_seconds: 45
  overload_policy: defer_to_manual
  escalation_role: benefits_service_delivery
