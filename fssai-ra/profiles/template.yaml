# Copy this file, use domain language, and add a test for every transition.
profile_id: replace-me
version: "1.0"
title: Replace Me
resource_name: governed_resource
owner: accountable_service_owner
manual_fallback: Describe the safe service path used when automation is denied.
governance:
  domain: replace-me
  purpose: State the narrow, legitimate purpose for processing this data.
  deployment_profile: teaching
  data_classes: [restricted]
  applicable_frameworks: [replace-with-jurisdiction-and-sector-specific-obligations]
  prohibited_uses:
    - Any use outside the declared purpose
    - Training a model on governed records without separate authorization
  processing_basis: Name the policy, consent, contract, duty, or other approved basis for this processing.
  data_minimization_rule: State the minimum subjects, fields, recipients, purpose, and duration permitted.
  retention_rule: State how long source data, working data, decisions, and evidence are retained and why.
  deletion_rule: State when access is revoked and each data copy is deleted or placed on hold.
  residency_rule: State the approved regions, systems, and cross-border transfer constraints.
  incident_response: Name the containment, evidence preservation, notification, recovery, and service-continuity path.
  owners:
    data: accountable_data_owner
    privacy: privacy_officer
    security: security_officer
# Optional: govern what a model may read and what may leave. Uncomment and
# replace, then run `fssaira disclosure` on your pack. Every class must appear
# in governance.data_classes and every role in a transition below.
# disclosure:
#   subject_kind: person
#   purposes: [approved-purpose]
#   fields:
#     identifier: {class: restricted}
#     case_notes: {class: restricted}
#   model_endpoints:
#     institution_model: institution-private
#   class_zones:
#     restricted: [institution-private]
#   recipients:
#     authorized_reviewer:
#       classes: [restricted]
#       purposes: [approved-purpose]
#       zone: institution-private
transitions:
  - operation: prepare_for_human_review
    from_status: draft
    to_status: ready_for_review
    consequential: true
    approval_role: authorized_reviewer
