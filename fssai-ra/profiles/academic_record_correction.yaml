# A second domain, added through the documented extension path and carrying its
# own evidence. Nothing here inherits a result from the student-support profile.
#
# It is deliberately *structurally* different rather than a relabelling, because
# a method that only works on the shape it was designed against has not been
# shown to generalise. This profile has:
#
#   * a multi-role chain — an instructor confirms, a registrar decides, and an
#     appeals officer may reopen — so an authentic approval from the wrong role
#     is a live threat at every step rather than a corner case;
#   * a terminal rejection that an appeal can reopen, so the state graph has a
#     cycle and "already decided" is not the same as "finished";
#   * five transitions over six statuses, which enlarges the declared authority
#     space the bounded model checker must enumerate.
profile_id: academic-record-correction
version: "1.0"
title: Academic Record Correction
resource_name: grade_record
owner: registrar
manual_fallback: >-
  Route the unchanged record to the registrar for manual correction under the
  published appeals procedure, and notify the student that the request is being
  handled outside the automated path.
governance:
  domain: education-records
  purpose: Route synthetic academic-record correction requests through instructor, registrar, and appeal authority without letting a model alter grades.
  deployment_profile: teaching
  data_classes: [synthetic-academic-record, restricted]
  applicable_frameworks: [institution-specific academic-record and privacy obligations]
  prohibited_uses:
    - Autonomous grade changes
    - Reuse of records for unrelated profiling or model training
    - External disclosure outside the published correction and appeal process
  processing_basis: Institution-approved record-correction and appeal administration using synthetic records only.
  data_minimization_rule: Include only fields needed to verify and decide the specific correction request.
  retention_rule: Retain request and decision evidence for the declared record-correction and appeal period.
  deletion_rule: Delete expired working copies while preserving records required by the approved retention rule.
  residency_rule: Store all artifacts only in institution-approved locations declared by the deployment.
  incident_response: Freeze automated corrections, preserve evidence, notify the registrar and named owners, and use the manual appeal path.
  owners:
    data: registrar
    privacy: institutional_privacy_officer
    security: information_security
transitions:
  - operation: submit_correction_request
    from_status: draft
    to_status: awaiting_instructor_confirmation
    consequential: false
    approval_role: records_clerk

  - operation: confirm_by_instructor
    from_status: awaiting_instructor_confirmation
    to_status: awaiting_registrar_decision
    consequential: true
    approval_role: course_instructor

  - operation: apply_correction
    from_status: awaiting_registrar_decision
    to_status: corrected
    consequential: true
    approval_role: registrar

  - operation: reject_correction
    from_status: awaiting_registrar_decision
    to_status: rejected
    consequential: true
    approval_role: registrar

  - operation: reopen_for_appeal
    from_status: rejected
    to_status: awaiting_registrar_decision
    consequential: true
    approval_role: academic_appeals_officer

# Kernel-floor control contracts (pack_floor.check_pack). Reference values for
# this synthetic profile: an adopting institution replaces the owners, capacity and
# responses with its own signed-off decisions.
controls:
  confirm_by_instructor:
    protected_asset: The grade record status changed by confirm_by_instructor
    permitted_operation: A course_instructor approves one exact confirm_by_instructor (awaiting_instructor_confirmation to awaiting_registrar_decision) at the reviewed version
    enforcement_point: execution_mediator
    owner: course_instructor
    failure_test: tests/test_profile_floor.py::test_academic_record_correction_controls_refuse_unauthorized_execution
    evidence_artifact: Execution receipt binding the proposal digest and the course_instructor approval, with intent and outcome evidence
    failure_response: Deny, record the refusal, and route the unchanged grade record to manual review
  apply_correction:
    protected_asset: The grade record status changed by apply_correction
    permitted_operation: A registrar approves one exact apply_correction (awaiting_registrar_decision to corrected) at the reviewed version
    enforcement_point: execution_mediator
    owner: registrar
    failure_test: tests/test_profile_floor.py::test_academic_record_correction_controls_refuse_unauthorized_execution
    evidence_artifact: Execution receipt binding the proposal digest and the registrar approval, with intent and outcome evidence
    failure_response: Deny, record the refusal, and route the unchanged grade record to manual review
  reject_correction:
    protected_asset: The grade record status changed by reject_correction
    permitted_operation: A registrar approves one exact reject_correction (awaiting_registrar_decision to rejected) at the reviewed version
    enforcement_point: execution_mediator
    owner: registrar
    failure_test: tests/test_profile_floor.py::test_academic_record_correction_controls_refuse_unauthorized_execution
    evidence_artifact: Execution receipt binding the proposal digest and the registrar approval, with intent and outcome evidence
    failure_response: Deny, record the refusal, and route the unchanged grade record to manual review
  reopen_for_appeal:
    protected_asset: The grade record status changed by reopen_for_appeal
    permitted_operation: A academic_appeals_officer approves one exact reopen_for_appeal (rejected to awaiting_registrar_decision) at the reviewed version
    enforcement_point: execution_mediator
    owner: academic_appeals_officer
    failure_test: tests/test_profile_floor.py::test_academic_record_correction_controls_refuse_unauthorized_execution
    evidence_artifact: Execution receipt binding the proposal digest and the academic_appeals_officer approval, with intent and outcome evidence
    failure_response: Deny, record the refusal, and route the unchanged grade record to manual review

# Declared review capacity. Overload defers to the manual route; it never approves.
review:
  capacity_per_window: 60
  window_seconds: 3600
  queue_limit: 100
  timeout_seconds: 1800
  # Minimum time between presenting a proposal to a reviewer and approving it.
  # 60 approvals x 45 s = 45 minutes of a 60-minute window: the quota and the
  # floor are consistent. Enforced by the oversight monitor on every approval.
  min_deliberation_seconds: 45
  overload_policy: defer_to_manual
  escalation_role: registrar
