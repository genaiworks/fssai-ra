<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 566" width="760" height="566" role="img" aria-label="Seven-plane reference architecture with two mediators around a control contract" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<title>Seven-plane reference architecture with two mediators around a control contract</title>
<rect width="760" height="566" fill="#ffffff"/>
<defs><marker id="arch-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<rect x="0" y="0" width="58" height="538" rx="6" fill="#f4f3ef" stroke="#c3c2b7" stroke-width="1"/>
<text x="0" y="0" font-size="10.5" font-weight="700" fill="#0b0b0b" text-anchor="middle" transform="translate(24,269) rotate(-90)">BOUNDARY PLANE</text>
<text x="0" y="0" font-size="9.5" font-weight="400" fill="#52514e" text-anchor="middle" transform="translate(41,269) rotate(-90)">authenticated ingress and egress, quarantine, one-way seam</text>
<rect x="76" y="0" width="684" height="96" rx="6" fill="#f4f3ef" stroke="#c3c2b7" stroke-width="1"/>
<text x="92" y="22" font-size="12" font-weight="700" fill="#0b0b0b" text-anchor="start">INTELLIGENCE PLANE  -  untrusted</text>
<text x="92" y="40" font-size="10.5" font-weight="400" fill="#52514e" text-anchor="start">Declared identifiers tokenized; inference remains possible. Isolation must protect credentials and keys.</text>
<rect x="92" y="50" width="155.5" height="36" rx="5" fill="#ffffff" stroke="#c3c2b7" stroke-width="1"/>
<text x="101" y="65" font-size="10" font-weight="700" fill="#0b0b0b" text-anchor="start">Semantic router</text>
<text x="101" y="79" font-size="8.8" font-weight="400" fill="#77756f" text-anchor="start">advisory: intent + sensitivity</text>
<rect x="257.5" y="50" width="155.5" height="36" rx="5" fill="#ffffff" stroke="#c3c2b7" stroke-width="1"/>
<text x="266.5" y="65" font-size="10" font-weight="700" fill="#0b0b0b" text-anchor="start">Attested local model</text>
<text x="266.5" y="79" font-size="8.8" font-weight="400" fill="#77756f" text-anchor="start">default for restricted data</text>
<rect x="423" y="50" width="155.5" height="36" rx="5" fill="#ffffff" stroke="#c3c2b7" stroke-width="1"/>
<text x="432" y="65" font-size="10" font-weight="700" fill="#0b0b0b" text-anchor="start">Approved cloud model</text>
<text x="432" y="79" font-size="8.8" font-weight="400" fill="#77756f" text-anchor="start">low-sensitivity work only</text>
<rect x="588.5" y="50" width="155.5" height="36" rx="5" fill="#ffffff" stroke="#c3c2b7" stroke-width="1"/>
<text x="597.5" y="65" font-size="10" font-weight="700" fill="#0b0b0b" text-anchor="start">Agents and retrieval</text>
<text x="597.5" y="79" font-size="8.8" font-weight="400" fill="#77756f" text-anchor="start">retrieved text is data</text>
<rect x="76" y="126" width="684" height="58" rx="6" fill="#eef4fc" stroke="#2a78d6" stroke-width="1.5"/>
<text x="92" y="146" font-size="11.5" font-weight="700" fill="#184f95" text-anchor="start">CONTROL CONTRACT  -  7 fields per consequential capability</text>
<rect x="92" y="156" width="43" height="19" rx="9.5" fill="#ffffff" stroke="#6da7ec" stroke-width="1"/>
<text x="113.5" y="169" font-size="9.5" font-weight="400" fill="#0b0b0b" text-anchor="middle">asset</text>
<rect x="143" y="156" width="64.6" height="19" rx="9.5" fill="#ffffff" stroke="#6da7ec" stroke-width="1"/>
<text x="175.3" y="169" font-size="9.5" font-weight="400" fill="#0b0b0b" text-anchor="middle">operation</text>
<rect x="215.6" y="156" width="107.8" height="19" rx="9.5" fill="#ffffff" stroke="#6da7ec" stroke-width="1"/>
<text x="269.5" y="169" font-size="9.5" font-weight="400" fill="#0b0b0b" text-anchor="middle">enforcement point</text>
<rect x="331.4" y="156" width="43" height="19" rx="9.5" fill="#ffffff" stroke="#6da7ec" stroke-width="1"/>
<text x="352.9" y="169" font-size="9.5" font-weight="400" fill="#0b0b0b" text-anchor="middle">owner</text>
<rect x="382.4" y="156" width="80.8" height="19" rx="9.5" fill="#ffffff" stroke="#6da7ec" stroke-width="1"/>
<text x="422.8" y="169" font-size="9.5" font-weight="400" fill="#0b0b0b" text-anchor="middle">failure test</text>
<rect x="471.2" y="156" width="59.2" height="19" rx="9.5" fill="#ffffff" stroke="#6da7ec" stroke-width="1"/>
<text x="500.8" y="169" font-size="9.5" font-weight="400" fill="#0b0b0b" text-anchor="middle">evidence</text>
<rect x="538.4" y="156" width="102.4" height="19" rx="9.5" fill="#ffffff" stroke="#6da7ec" stroke-width="1"/>
<text x="589.6" y="169" font-size="9.5" font-weight="400" fill="#0b0b0b" text-anchor="middle">failure response</text>
<rect x="76" y="216" width="180" height="120" rx="6" fill="#f4f3ef" stroke="#c3c2b7" stroke-width="1"/>
<text x="90" y="237" font-size="11" font-weight="700" fill="#0b0b0b" text-anchor="start">AUTHORITY PLANE</text>
<text x="90" y="256" font-size="10" font-weight="400" fill="#52514e" text-anchor="start">Purpose-, time-, and</text>
<text x="90" y="271" font-size="10" font-weight="400" fill="#52514e" text-anchor="start">holder-bound grants;</text>
<text x="90" y="286" font-size="10" font-weight="400" fill="#52514e" text-anchor="start">approvals; model manifests;</text>
<text x="90" y="301" font-size="10" font-weight="400" fill="#52514e" text-anchor="start">key custody; delegation</text>
<text x="90" y="316" font-size="10" font-weight="400" fill="#52514e" text-anchor="start">only narrows</text>
<rect x="276" y="216" width="232" height="120" rx="6" fill="#ffffff" stroke="#184f95" stroke-width="2"/>
<text x="290" y="237" font-size="11" font-weight="700" fill="#0b0b0b" text-anchor="start">EXECUTION PLANE  -  Rule 1</text>
<text x="290" y="256" font-size="10" font-weight="400" fill="#52514e" text-anchor="start">Rechecks policy, identity, version,</text>
<text x="290" y="271" font-size="10" font-weight="400" fill="#52514e" text-anchor="start">approval, and replay; binds the</text>
<text x="290" y="286" font-size="10" font-weight="400" fill="#52514e" text-anchor="start">exact proposal digest; local atomicity,</text>
<text x="290" y="301" font-size="10" font-weight="400" fill="#52514e" text-anchor="start">external reconciliation.</text>
<text x="290" y="325" font-size="9.5" font-weight="700" fill="#184f95" text-anchor="start">Sole holder of the write credential</text>
<rect x="528" y="216" width="232" height="120" rx="6" fill="#ffffff" stroke="#184f95" stroke-width="2"/>
<text x="542" y="237" font-size="11" font-weight="700" fill="#0b0b0b" text-anchor="start">CONTEXT GATE  -  Rule 2</text>
<text x="542" y="256" font-size="10" font-weight="400" fill="#52514e" text-anchor="start">Checks grant, purpose, consent,</text>
<text x="542" y="271" font-size="10" font-weight="400" fill="#52514e" text-anchor="start">zone, and model attestation;</text>
<text x="542" y="286" font-size="10" font-weight="400" fill="#52514e" text-anchor="start">tokenizes PII; labels every output;</text>
<text x="542" y="301" font-size="10" font-weight="400" fill="#52514e" text-anchor="start">restores identity only if entitled.</text>
<text x="542" y="325" font-size="9.5" font-weight="700" fill="#184f95" text-anchor="start">Sole holder of record access and keys</text>
<rect x="76" y="384" width="180" height="82" rx="6" fill="#f4f3ef" stroke="#c3c2b7" stroke-width="1"/>
<text x="90" y="405" font-size="11" font-weight="700" fill="#0b0b0b" text-anchor="start">EVIDENCE PLANE</text>
<text x="90" y="425" font-size="10" font-weight="400" fill="#52514e" text-anchor="start">Binds intent to outcome;</text>
<text x="90" y="440" font-size="10" font-weight="400" fill="#52514e" text-anchor="start">receipts from both mediators;</text>
<text x="90" y="455" font-size="10" font-weight="400" fill="#52514e" text-anchor="start">digests and sensitive metadata</text>
<rect x="276" y="384" width="484" height="82" rx="6" fill="#f4f3ef" stroke="#c3c2b7" stroke-width="1"/>
<text x="290" y="405" font-size="11" font-weight="700" fill="#0b0b0b" text-anchor="start">GOVERNED DATA PLANE</text>
<text x="290" y="425" font-size="10" font-weight="400" fill="#52514e" text-anchor="start">Per-subject encryption; key deletion has limits on retained copies.</text>
<text x="290" y="440" font-size="10" font-weight="400" fill="#52514e" text-anchor="start">Stable identifiers, replayable events, versioned snapshots.</text>
<text x="290" y="455" font-size="10" font-weight="400" fill="#52514e" text-anchor="start">Read only through the gate; changed only by the executor.</text>
<rect x="76" y="486" width="684" height="52" rx="6" fill="#f4f3ef" stroke="#c3c2b7" stroke-width="1"/>
<text x="92" y="517" font-size="11" font-weight="700" fill="#0b0b0b" text-anchor="start">RESILIENCE PLANE</text>
<text x="222" y="517" font-size="10" font-weight="400" fill="#52514e" text-anchor="start">Fails secure, revokes, reconciles uncertain effects, and routes work to a manual fallback.</text>
<path d="M392,96 V125" fill="none" stroke="#52514e" stroke-width="1.5" marker-end="url(#arch-arrow)"/>
<path d="M392,184 V215" fill="none" stroke="#52514e" stroke-width="1.5" marker-end="url(#arch-arrow)"/>
<text x="384" y="115" font-size="9.5" font-weight="400" fill="#52514e" text-anchor="end">proposes an action</text>
<path d="M600,96 V125" fill="none" stroke="#52514e" stroke-width="1.5" marker-end="url(#arch-arrow)"/>
<path d="M600,184 V215" fill="none" stroke="#52514e" stroke-width="1.5" marker-end="url(#arch-arrow)"/>
<text x="592" y="115" font-size="9.5" font-weight="400" fill="#52514e" text-anchor="end">requests data</text>
<path d="M700,216 V97" fill="none" stroke="#52514e" stroke-width="1.5" marker-end="url(#arch-arrow)"/>
<text x="692" y="204" font-size="9.5" font-weight="400" fill="#52514e" text-anchor="end">labelled output</text>
<path d="M256,276 H275" fill="none" stroke="#52514e" stroke-width="1.5" marker-end="url(#arch-arrow)"/>
<path d="M166,336 V354 H600 V337" fill="none" stroke="#52514e" stroke-width="1.5" marker-end="url(#arch-arrow)"/>
<text x="470" y="349" font-size="9.5" font-weight="400" fill="#52514e" text-anchor="middle">grants, approvals, keys</text>
<path d="M392,336 V383" fill="none" stroke="#52514e" stroke-width="1.5" marker-end="url(#arch-arrow)"/>
<text x="400" y="377" font-size="9.5" font-weight="400" fill="#52514e" text-anchor="start">one checked write</text>
<path d="M720,384 V337" fill="none" stroke="#52514e" stroke-width="1.5" marker-end="url(#arch-arrow)"/>
<text x="712" y="377" font-size="9.5" font-weight="400" fill="#52514e" text-anchor="end">decrypt after authorization</text>
<text x="76" y="558" font-size="9.5" font-weight="400" fill="#77756f" text-anchor="start">Heavy blue outline: a mediator holding what the model lacks. Mediators, contract, keys, and evidence store form the declared trusted base.</text>
</svg>
