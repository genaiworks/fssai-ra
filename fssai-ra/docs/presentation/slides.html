<style>
/* ───────────────────────────────────────────────────────────────────────────
   Trust by Construction — UNU Macau AI Conference 2026, panel opener.

   Visual identity: a filed institutional record crossed with a control room.
   The oxide red is a stamp colour and is spent on exactly one thing — refusal —
   because refusal is what this architecture is for. Nothing else uses it.
   ─────────────────────────────────────────────────────────────────────────── */

:root {
  color-scheme: light;

  --ground:      #e9edf1;   /* cool archival grey, not cream */
  --stage:       #f8fafb;
  --panel:       #eff3f6;
  --ink:         #111a22;   /* blue-black */
  --ink-soft:    #46545f;
  --ink-faint:   #7e8b96;
  --rule:        #c9d2da;
  --rule-strong: #a8b5c0;

  --refuse:      #a8322a;   /* stamp oxide — denials only */
  --refuse-wash: #f3e3e1;
  --authorize:   #1f6b5c;   /* deep viridian — authorised outcomes only */
  --authorize-wash: #dfeae7;
  --mark:        #8a6a1f;   /* ochre — findings and caveats */

  --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --body: "Newsreader", Georgia, "Times New Roman", serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;

  --gutter: clamp(20px, 4vw, 68px);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground:      #0b1117;
    --stage:       #111a21;
    --panel:       #16212a;
    --ink:         #e8eef3;
    --ink-soft:    #a4b2bd;
    --ink-faint:   #73838f;
    --rule:        #26343f;
    --rule-strong: #3a4b58;
    --refuse:      #e2776c;
    --refuse-wash: #2c1a19;
    --authorize:   #52b79f;
    --authorize-wash: #14241f;
    --mark:        #d3a94a;
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --ground:      #0b1117;
  --stage:       #111a21;
  --panel:       #16212a;
  --ink:         #e8eef3;
  --ink-soft:    #a4b2bd;
  --ink-faint:   #73838f;
  --rule:        #26343f;
  --rule-strong: #3a4b58;
  --refuse:      #e2776c;
  --refuse-wash: #2c1a19;
  --authorize:   #52b79f;
  --authorize-wash: #14241f;
  --mark:        #d3a94a;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--body);
  font-size: 17px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

/* ─────────────────────────────────────────────────────────── chrome */

.rail {
  position: fixed; inset: auto 0 0 0; height: 3px;
  background: var(--rule); z-index: 40;
}
.rail > i { display: block; height: 100%; background: var(--ink); transition: width .28s ease; }

.hud {
  position: fixed; top: 0; left: 0; right: 0; z-index: 40;
  display: flex; align-items: center; gap: 14px;
  padding: 12px var(--gutter);
  font-family: var(--display); font-size: 11px;
  letter-spacing: .13em; text-transform: uppercase;
  color: var(--ink-faint);
  background: linear-gradient(to bottom, var(--ground) 62%, transparent);
  pointer-events: none;
}
.hud b { font-weight: 600; color: var(--ink-soft); }
.hud .grow { flex: 1; }
.hud button {
  pointer-events: auto;
  font: inherit; letter-spacing: .13em; text-transform: uppercase;
  background: none; border: 1px solid var(--rule); color: var(--ink-faint);
  border-radius: 2px; padding: 3px 9px; cursor: pointer;
}
.hud button:hover { color: var(--ink); border-color: var(--rule-strong); }
.hud button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

/* ─────────────────────────────────────────────────────────── stage */

.deck { display: grid; place-items: center; min-height: 100vh; padding: 46px var(--gutter) 34px; }

.slide {
  display: none;
  width: min(1160px, 100%);
  aspect-ratio: 16 / 9;
  background: var(--stage);
  border: 1px solid var(--rule);
  padding: clamp(26px, 3.4vw, 54px);
  overflow: hidden;
  position: relative;
  container-type: inline-size;
}
.slide.here { display: grid; grid-template-rows: auto 1fr auto; gap: clamp(12px, 1.6vw, 22px); }

/* Registration marks: a filed-document detail, cheap and specific. */
.slide::before, .slide::after {
  content: ""; position: absolute; width: 13px; height: 13px; pointer-events: none;
  border: 1px solid var(--rule-strong);
}
.slide::before { top: 10px; left: 10px; border-right: 0; border-bottom: 0; }
.slide::after  { bottom: 10px; right: 10px; border-left: 0; border-top: 0; }

.eyebrow {
  font-family: var(--display); font-size: clamp(10px, .95cqw, 12px); font-weight: 600;
  letter-spacing: .18em; text-transform: uppercase; color: var(--ink-faint);
  display: flex; align-items: baseline; gap: 12px;
}
.eyebrow span::before { content: "— "; }

h1 {
  font-family: var(--display); font-weight: 700;
  font-size: clamp(30px, 4.6cqw, 62px); line-height: 1.02;
  letter-spacing: -.022em; margin: 0; text-wrap: balance;
}
h2 {
  font-family: var(--display); font-weight: 600;
  font-size: clamp(24px, 3.5cqw, 46px); line-height: 1.06;
  letter-spacing: -.018em; margin: 0; text-wrap: balance;
}
h3 {
  font-family: var(--display); font-weight: 600;
  font-size: clamp(14px, 1.45cqw, 19px); letter-spacing: -.005em; margin: 0;
}
p { margin: 0; max-width: 62ch; font-size: clamp(14px, 1.42cqw, 19px); }
p.lead { font-size: clamp(16px, 1.85cqw, 25px); line-height: 1.38; color: var(--ink-soft); }
.dim { color: var(--ink-soft); }
.faint { color: var(--ink-faint); }
strong { font-weight: 500; color: var(--ink); }
em { font-style: italic; }

.foot {
  font-family: var(--display); font-size: clamp(10px, .95cqw, 12px);
  letter-spacing: .05em; color: var(--ink-faint);
  border-top: 1px solid var(--rule); padding-top: 10px;
  display: flex; gap: 16px; flex-wrap: wrap; align-items: baseline;
}

.body { display: flex; flex-direction: column; gap: clamp(10px, 1.5cqw, 20px); min-height: 0; }
.cols { display: grid; gap: clamp(14px, 2cqw, 30px); grid-template-columns: 1fr 1fr; align-items: start; }
.cols.wide-left { grid-template-columns: 1.25fr 1fr; }
.cols.three { grid-template-columns: repeat(3, 1fr); }

/* ─────────────────────────────────────────────────── subject devices */

code, .mono { font-family: var(--mono); font-size: .88em; letter-spacing: -.01em; }

/* The stamp. Reserved for refusal. */
.stamp {
  display: inline-flex; align-items: center; gap: 9px;
  font-family: var(--mono); font-weight: 600;
  font-size: clamp(12px, 1.35cqw, 18px); letter-spacing: .02em;
  color: var(--refuse); background: var(--refuse-wash);
  border: 1.5px solid var(--refuse); border-radius: 2px;
  padding: 7px 13px; transform: rotate(-1.1deg);
}
.stamp::before { content: "✕"; font-size: .9em; }

.allow {
  display: inline-flex; align-items: center; gap: 9px;
  font-family: var(--mono); font-weight: 600;
  font-size: clamp(12px, 1.35cqw, 18px);
  color: var(--authorize); background: var(--authorize-wash);
  border: 1.5px solid var(--authorize); border-radius: 2px; padding: 7px 13px;
}
.allow::before { content: "✓"; }

/* The seven-field contract card: the paper's actual contribution, shown filled in. */
.contract { border: 1px solid var(--rule-strong); background: var(--panel); }
.contract .row {
  display: grid; grid-template-columns: 13ch 1fr; gap: 12px;
  padding: 6px clamp(10px, 1.3cqw, 16px); border-bottom: 1px solid var(--rule);
  font-size: clamp(11px, 1.14cqw, 15px);
}
.contract .row:last-child { border-bottom: 0; }
.contract .row > b {
  font-family: var(--display); font-weight: 600; font-size: .82em;
  letter-spacing: .08em; text-transform: uppercase; color: var(--ink-faint);
  padding-top: .25em;
}
.contract .head {
  background: var(--ink); color: var(--stage);
  font-family: var(--mono); font-weight: 600; letter-spacing: .04em;
  padding: 7px clamp(10px, 1.3cqw, 16px); font-size: clamp(11px, 1.1cqw, 14px);
  display: flex; justify-content: space-between; gap: 12px;
}

/* Numbered steps encode a real sequence: the three-step protocol. */
.steps { display: grid; gap: 9px; }
.step { display: grid; grid-template-columns: 26px 1fr; gap: 13px; align-items: start; }
.step .n {
  font-family: var(--mono); font-size: clamp(11px, 1.1cqw, 14px); font-weight: 600;
  color: var(--ink-faint); border: 1px solid var(--rule-strong);
  width: 26px; height: 26px; display: grid; place-items: center; border-radius: 50%;
}
.step.no .n { color: var(--refuse); border-color: var(--refuse); }
.step p { font-size: clamp(12px, 1.25cqw, 17px); }

/* Ledger: monospace record lines, the evidence chain made visible. */
.ledger { border: 1px solid var(--rule); background: var(--panel); font-family: var(--mono); }
.ledger div {
  display: grid; grid-template-columns: 3.4ch 1fr auto; gap: 12px;
  padding: 6px clamp(9px, 1.2cqw, 14px); border-bottom: 1px solid var(--rule);
  font-size: clamp(10px, 1.06cqw, 13.5px); align-items: baseline;
}
.ledger div:last-child { border-bottom: 0; }
.ledger .seq { color: var(--ink-faint); }
.ledger .hash { color: var(--ink-faint); font-size: .86em; }

/* Figures: used only where the number is the point of the slide. */
.figures { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: var(--rule); border: 1px solid var(--rule); }
.fig { background: var(--stage); padding: clamp(11px, 1.5cqw, 19px); display: grid; gap: 3px; align-content: start; }
.fig b {
  font-family: var(--display); font-weight: 700; font-size: clamp(26px, 3.4cqw, 44px);
  line-height: 1; letter-spacing: -.03em; font-variant-numeric: tabular-nums;
}
.fig .k { font-family: var(--display); font-size: clamp(10px, .95cqw, 12px); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-faint); }
.fig .note { font-size: clamp(11px, 1.08cqw, 14px); color: var(--ink-soft); line-height: 1.32; }
.fig.hero b { color: var(--authorize); }

/* Plain list with hanging rules — a form, not a bullet list. */
.entries { display: grid; gap: 0; }
.entry { display: grid; grid-template-columns: auto 1fr; gap: 14px; padding: clamp(7px, .95cqw, 12px) 0; border-bottom: 1px solid var(--rule); align-items: baseline; }
.entry:last-child { border-bottom: 0; }
.entry .k { font-family: var(--mono); font-size: clamp(10px, 1.02cqw, 13px); color: var(--ink-faint); white-space: nowrap; padding-top: .15em; }
.entry p { font-size: clamp(12px, 1.25cqw, 17px); }

.callout { border-left: 3px solid var(--mark); padding: 2px 0 2px 16px; }
.callout.refuse { border-left-color: var(--refuse); }

.pill {
  display: inline-block; font-family: var(--mono); font-size: clamp(10px, .98cqw, 12.5px);
  border: 1px solid var(--rule-strong); border-radius: 999px; padding: 2px 9px; color: var(--ink-soft);
}

.rule-h { height: 1px; background: var(--rule); }

/* ─────────────────────────────────────────────────────────── notes */

.notes {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 45;
  max-height: 42vh; overflow-y: auto;
  background: var(--panel); border-top: 2px solid var(--ink);
  padding: 16px var(--gutter) 22px;
  font-size: 15px; line-height: 1.55;
  display: none;
}
body.notes-open .notes { display: block; }
.notes h4 { font-family: var(--display); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-faint); margin: 0 0 6px; }
.notes p { max-width: 78ch; margin: 0 0 8px; }
.notes .time { font-family: var(--mono); color: var(--ink-faint); font-size: 13px; }

/* ──────────────────────────────────────────────────────── overview */

body.grid-open .deck { display: none; }
.overview { display: none; padding: 56px var(--gutter) 48px; }
body.grid-open .overview { display: block; }
.overview .tiles { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(216px, 1fr)); }
.tile {
  text-align: left; background: var(--stage); border: 1px solid var(--rule);
  padding: 13px 15px; cursor: pointer; display: grid; gap: 5px; align-content: start;
  min-height: 108px; font: inherit; color: inherit;
}
.tile:hover { border-color: var(--ink); }
.tile:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.tile .n { font-family: var(--mono); font-size: 11px; color: var(--ink-faint); }
.tile .t { font-family: var(--display); font-weight: 600; font-size: 15px; line-height: 1.22; }
.tile .e { font-family: var(--display); font-size: 10px; letter-spacing: .13em; text-transform: uppercase; color: var(--ink-faint); }
.tile[aria-current="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }

/* ─────────────────────────────────────────────── narrow: read as a document */

@media (max-width: 820px) {
  .deck { display: block; padding: 58px var(--gutter) 40px; }
  .slide { display: block !important; aspect-ratio: auto; width: 100%; margin-bottom: 16px; }
  .slide.here { display: block; }
  .slide::before, .slide::after { display: none; }
  .cols, .cols.wide-left, .cols.three { grid-template-columns: 1fr; }
  .contract .row { grid-template-columns: 1fr; gap: 2px; }
  .hud .desktop-only { display: none; }
  h1, h2, p, p.lead, .fig b { font-size: revert; }
  h1 { font-size: 30px; } h2 { font-size: 25px; }
  p { font-size: 16px; } p.lead { font-size: 18px; }
  .fig b { font-size: 30px; }
  .rail { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

/* ─────────────────────────────────────────────────────────── print */

@media print {
  .hud, .rail, .notes, .overview { display: none !important; }
  body { background: #fff; }
  .deck { display: block; padding: 0; min-height: 0; }
  .slide { display: block !important; page-break-after: always; border: 0; aspect-ratio: 16/9; width: 100%; }
}
</style>

<div class="hud">
  <b>Trust by Construction</b>
  <span class="desktop-only">UNU Macau AI Conference 2026 · Panel opener</span>
  <span class="grow"></span>

<script>

const SLIDES = [
{
  eyebrow: ["Opening", "R. Srivastava"],
  time: "0:00",
  html: `
    <h1>A model may propose an action.<br>It cannot manufacture the authority to&nbsp;execute&nbsp;it.</h1>
    <div class="body">
      <p class="lead">Trust by Construction: a testable architecture for sovereign AI agents in education.</p>
      <div class="cols">

{
  eyebrow: ["The question", "Why this, why now"],
  time: "0:35",
  html: `
    <h2>A university deploys an agent to process student-support applications.</h2>
    <div class="body">
      <p class="lead">It reads confidential records. It interprets eligibility guidance. It drafts recommendations. It calls administrative tools.</p>
      <div class="callout">
        <p><strong>A sentence inside an uploaded document can redirect that workflow.</strong> So can an ordinary mistake, with no attacker present at all.</p>
      </div>
      <p>The useful institutional question is narrower than “is the AI safe?”. It is: <strong>when the agent is wrong or compromised, what stops its proposal from becoming an unauthorized decision — and what evidence lets a student challenge the outcome?</strong></p>

},
{
  eyebrow: ["Framing", "The move this talk makes"],
  time: "1:15",
  html: `
    <h2>Sovereignty is not a postcode.</h2>
    <div class="body">
      <p class="lead">Local hosting is necessary and nowhere near sufficient. Sovereignty is a set of capabilities an institution can <em>exercise and demonstrate</em>.</p>
      <div class="cols">
        <div class="entries">
          <div class="entry"><span class="k">01</span><p>Govern who reads which record</p></div>

    </div>`,
  notes: `This is the reframe the room should remember even if they forget the architecture.
  <p>Capability six — <em>leave</em> — usually gets a reaction. Exit is the capability procurement forgets to buy.</p>`
},
{
  eyebrow: ["Contribution", "The control contract"],
  time: "2:00",
  html: `
    <h2>Seven fields, per consequential capability.</h2>
    <div class="body">
      <div class="cols wide-left">
        <div class="contract">
          <div class="head"><span>AA-4</span><span>accountable_action</span></div>
          <div class="row"><b>Asset</b><span>Consequential student-support case transitions</span></div>

{

  html: `

},
{
  eyebrow: ["Demonstration", "Ninety seconds"],

const deck = document.getElementById("deck");
const tiles = document.getElementById("tiles");
const notes = document.getElementById("notes");
const counter = document.getElementById("counter");
const railFill = document.getElementById("railFill");
const notesBtn = document.getElementById("notesBtn");
const gridBtn = document.getElementById("gridBtn");

SLIDES.forEach((slide, index) => {
  const el = document.createElement("section");
  el.className = "slide";
  el.id = "s" + (index + 1);
  el.innerHTML =
    `<div class="eyebrow"><b>${slide.eyebrow[0]}</b>${slide.eyebrow[1] ? `<span>${slide.eyebrow[1]}</span>` : ""}</div>` +
    slide.html;
  deck.append(el);

  const tile = document.createElement("button");
  tile.className = "tile";
  tile.type = "button";
  const heading = slide.html.match(/<h[12][^>]*>([\s\S]*?)<\/h[12]>/);
  tile.innerHTML =
    `<span class="n">${String(index + 1).padStart(2, "0")}</span>` +
    `<span class="e">${slide.eyebrow[0]}</span>` +
    `<span class="t">${(heading ? heading[1] : "").replace(/<[^>]+>/g, "").replace(/&nbsp;/g, " ").slice(0, 96)}</span>`;
  tile.addEventListener("click", () => { show(index); setGrid(false); });
  tiles.append(tile);
});

const slideEls = [...deck.children];
const tileEls = [...tiles.children];
let current = 0;

function show(index) {
  current = Math.max(0, Math.min(SLIDES.length - 1, index));
  slideEls.forEach((el, i) => el.classList.toggle("here", i === current));
  tileEls.forEach((el, i) => el.setAttribute("aria-current", String(i === current)));
  counter.textContent = `${current + 1} / ${SLIDES.length}`;
  railFill.style.width = `${((current + 1) / SLIDES.length) * 100}%`;
  notes.innerHTML =
    `<h4>Speaker notes — slide ${current + 1}` +
    (SLIDES[current].time !== "—" ? ` · target ${SLIDES[current].time}` : "") +
    `</h4>${SLIDES[current].notes}`;
  if (history.replaceState) history.replaceState(null, "", "#" + (current + 1));
  if (window.matchMedia("(max-width: 820px)").matches) return;
  window.scrollTo({ top: 0 });
}

function setGrid(open) {
  document.body.classList.toggle("grid-open", open);
  gridBtn.setAttribute("aria-pressed", String(open));
}

function setNotes(open) {
  document.body.classList.toggle("notes-open", open);
  notesBtn.setAttribute("aria-pressed", String(open));
}

gridBtn.addEventListener("click", () => setGrid(!document.body.classList.contains("grid-open")));
notesBtn.addEventListener("click", () => setNotes(!document.body.classList.contains("notes-open")));

document.addEventListener("keydown", (event) => {
  if (event.metaKey || event.ctrlKey || event.altKey) return;
  switch (event.key) {
    case "ArrowRight": case "PageDown": case " ": show(current + 1); event.preventDefault(); break;
    case "ArrowLeft": case "PageUp": show(current - 1); event.preventDefault(); break;
    case "Home": show(0); break;
    case "End": show(SLIDES.length - 1); break;
    case "g": case "G": setGrid(!document.body.classList.contains("grid-open")); break;
    case "n": case "N": setNotes(!document.body.classList.contains("notes-open")); break;
    case "Escape": setGrid(false); setNotes(false); break;
  }
});

deck.addEventListener("click", (event) => {
  if (window.matchMedia("(max-width: 820px)").matches) return;
  if (event.target.closest("a, button")) return;
  const rect = deck.getBoundingClientRect();
  show(event.clientX - rect.left < rect.width * 0.22 ? current - 1 : current + 1);
});

const fromHash = parseInt((location.hash || "").slice(1), 10);
show(Number.isFinite(fromHash) && fromHash > 0 ? fromHash - 1 : 0);
</script>
