# TLS overlay: network clients must use TLS; the in-container socket is kept for
# the health check and administration from inside the container.
local     all  all                trust
hostssl   all  all  0.0.0.0/0     scram-sha-256
hostssl   all  all  ::/0          scram-sha-256
hostnossl all  all  0.0.0.0/0     reject
hostnossl all  all  ::/0          reject
