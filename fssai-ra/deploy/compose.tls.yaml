# TLS between services. Apply on top of compose.yaml:
#
#   python scripts/make_dev_certs.py --out deploy/certs
#   docker compose --env-file deploy/.env -f deploy/compose.yaml \
#     -f deploy/compose.tls.yaml up -d
#
# PostgreSQL, Redis, Kafka and MinIO then accept only TLS connections, and every
# client verifies the server certificate and host name against deploy/certs/ca.crt.
# Kafka also requires a client certificate (mutual TLS).
# The control API and import gateway serve HTTPS; the console reaches the API
# over verified TLS. Still plain HTTP: the console's localhost port and the
# Iceberg REST catalog API on its internal network (table metadata pointers, no
# row data).
# The generated CA is for local development; use the institution's own CA and
# certificate rotation in a deployment.

services:
  tls-init:
    # Copies keys into a volume with the owner each server process runs as.
    image: postgres:17.6-alpine
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        install -m 644 /src/ca.crt /tls/ca.crt
        for s in postgres redis kafka minio iceberg-rest; do install -m 644 /src/$$s.crt /tls/$$s.crt; done
        install -m 600 -o 70 -g 70 /src/postgres.key /tls/postgres.key
        install -m 600 -o 999 -g 1000 /src/redis.key /tls/redis.key
        install -m 600 -o 1000 -g 1000 /src/kafka.pem /tls/kafka.pem
        for s in control-api import-gateway; do install -m 644 /src/$$s.crt /tls/$$s.crt; install -m 600 -o 10001 -g 10001 /src/$$s.key /tls/$$s.key; done
        for c in kafka-client-control-api kafka-client-import-gateway; do install -m 644 /src/$$c.crt /tls/$$c.crt; install -m 600 -o 10001 -g 10001 /src/$$c.key /tls/$$c.key; done
        install -m 600 -o 185 -g 185 /src/kafka-client-spark.pem /tls/kafka-client-spark.pem
        install -m 600 -o 1000 -g 1000 /src/kafka-client-admin.pem /tls/kafka-client-admin.pem
        install -m 644 /src/truststore.p12 /tls/truststore.p12
        mkdir -p /tls/minio/CAs
        install -m 644 /src/minio.crt /tls/minio/public.crt
        install -m 600 /src/minio.key /tls/minio/private.key
        install -m 644 /src/ca.crt /tls/minio/CAs/ca.crt
        echo "TLS material installed"
    volumes:
      - ./certs:/src:ro
      - tls-certs:/tls
    network_mode: none
    restart: "no"

  postgres:
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/tls/postgres.crt
      - -c
      - ssl_key_file=/tls/postgres.key
      - -c
      - ssl_min_protocol_version=TLSv1.2
      - -c
      - hba_file=/tls-config/pg_hba.conf
    volumes:
      - tls-certs:/tls:ro
      - ./tls:/tls-config:ro
    depends_on:
      tls-init: {condition: service_completed_successfully}

  redis:
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}",
              "--port", "0", "--tls-port", "6379",
              "--tls-cert-file", "/tls/redis.crt", "--tls-key-file", "/tls/redis.key",
              "--tls-ca-cert-file", "/tls/ca.crt", "--tls-auth-clients", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "--tls", "--cacert", "/tls/ca.crt", "-h", "localhost",
             "-a", "${REDIS_PASSWORD}", "ping"]
    volumes:
      - tls-certs:/tls:ro
    depends_on:
      tls-init: {condition: service_completed_successfully}

  kafka:
    environment:
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:SSL
      KAFKA_SSL_KEYSTORE_TYPE: PEM
      KAFKA_SSL_KEYSTORE_LOCATION: /tls/kafka.pem
      KAFKA_SSL_TRUSTSTORE_TYPE: PEM
      KAFKA_SSL_TRUSTSTORE_LOCATION: /tls/ca.crt
      # Mutual TLS: a client without a certificate from the stack's CA cannot read
      # or write any topic. Envelope MACs separately prove who wrote each record.
      KAFKA_SSL_CLIENT_AUTH: required
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --command-config /tls-config/kafka-client.properties --list"]
    volumes:
      - tls-certs:/tls:ro
      - ./tls:/tls-config:ro
    depends_on:
      tls-init: {condition: service_completed_successfully}

  control-api:
    command: ["uvicorn", "fssaira.api:create_default_app", "--factory", "--host", "0.0.0.0",
              "--port", "8080", "--ssl-keyfile", "/tls/control-api.key",
              "--ssl-certfile", "/tls/control-api.crt"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--cacert", "/tls/ca.crt", "https://localhost:8080/health"]
    environment:
      FSSAI_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=verify-full&sslrootcert=/tls/ca.crt
      FSSAI_REDIS_URL: rediss://:${REDIS_PASSWORD}@redis:6379/0
      FSSAI_REDIS_CA_FILE: /tls/ca.crt
      FSSAI_KAFKA_SECURITY_PROTOCOL: SSL
      FSSAI_KAFKA_SSL_CA_LOCATION: /tls/ca.crt
      FSSAI_KAFKA_SSL_CERT_LOCATION: /tls/kafka-client-control-api.crt
      FSSAI_KAFKA_SSL_KEY_LOCATION: /tls/kafka-client-control-api.key
    volumes:
      - tls-certs:/tls:ro

  import-gateway:
    command: ["uvicorn", "fssaira.import_api:create_import_app", "--factory", "--host", "0.0.0.0",
              "--port", "8081", "--ssl-keyfile", "/tls/import-gateway.key",
              "--ssl-certfile", "/tls/import-gateway.crt"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--cacert", "/tls/ca.crt", "https://localhost:8081/health"]
    environment:
      FSSAI_KAFKA_SECURITY_PROTOCOL: SSL
      FSSAI_KAFKA_SSL_CA_LOCATION: /tls/ca.crt
      FSSAI_KAFKA_SSL_CERT_LOCATION: /tls/kafka-client-import-gateway.crt
      FSSAI_KAFKA_SSL_KEY_LOCATION: /tls/kafka-client-import-gateway.key
    volumes:
      - tls-certs:/tls:ro

  console:
    # Proxies /api to the control API over TLS and verifies its certificate.
    # The console's own port stays HTTP on 127.0.0.1; put the institution's
    # TLS-terminating, authenticating reverse proxy in front of it.
    volumes:
      - ./tls/console-nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - tls-certs:/tls:ro

  # -- analytics: object storage over TLS ----------------------------------
  minio:
    command: ["server", "/data", "--console-address", ":9001", "--certs-dir", "/tls/minio"]
    environment:
      SSL_CERT_FILE: /tls/ca.crt
      MC_HOST_tlslocal: https://localhost:9000
    healthcheck:
      test: ["CMD", "mc", "ready", "tlslocal"]
    volumes:
      - tls-certs:/tls:ro
    depends_on:
      tls-init: {condition: service_completed_successfully}

  minio-init:
    environment:
      SSL_CERT_FILE: /tls/ca.crt
    command:
      - 'mc alias set warehouse https://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null; mc mb --ignore-existing warehouse/warehouse'
    volumes:
      - tls-certs:/tls:ro

  iceberg-rest:
    environment:
      CATALOG_S3_ENDPOINT: https://minio:9000
      JAVA_TOOL_OPTIONS: -Djavax.net.ssl.trustStore=/tls/truststore.p12 -Djavax.net.ssl.trustStoreType=PKCS12 -Djavax.net.ssl.trustStorePassword=changeit
    volumes:
      - tls-certs:/tls:ro

  iceberg-bootstrap:
    environment:
      S3_ENDPOINT: https://minio:9000
      JAVA_TOOL_OPTIONS: -Djavax.net.ssl.trustStore=/tls/truststore.p12 -Djavax.net.ssl.trustStoreType=PKCS12 -Djavax.net.ssl.trustStorePassword=changeit
    volumes:
      - tls-certs:/tls:ro

  spark-iceberg:
    environment:
      FSSAI_KAFKA_SECURITY_PROTOCOL: SSL
      FSSAI_KAFKA_SSL_CA_LOCATION: /tls/ca.crt
      FSSAI_KAFKA_SSL_KEYSTORE_PEM: /tls/kafka-client-spark.pem
      S3_ENDPOINT: https://minio:9000
      JAVA_TOOL_OPTIONS: -Djavax.net.ssl.trustStore=/tls/truststore.p12 -Djavax.net.ssl.trustStoreType=PKCS12 -Djavax.net.ssl.trustStorePassword=changeit
    volumes:
      - tls-certs:/tls:ro

volumes:
  tls-certs: {}
