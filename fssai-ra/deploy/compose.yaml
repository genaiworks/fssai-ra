# FSSAI-RA reference deployment.
#
#   docker compose --env-file deploy/.env -f deploy/compose.yaml up -d
#       core:      postgres, redis, kafka, control-api, import-gateway, console
#   … --profile model       adds Ollama for local inference
#   … --profile analytics   adds MinIO, the Iceberg REST catalog, and Spark
#
# Network topology mirrors the architecture rather than convenience. The control
# plane and the low-side gateway do not share a network; the only thing that
# crosses is a Kafka topic, which is what the import boundary publishes to. The
# `internal: true` networks have no route off the host.
#
# This is a development topology. Separate containers on one host demonstrate
# logical separation, not independent administrative trust, and a host
# administrator can reach all of it. See docs/SECURITY.md.

name: fssaira

x-control-env: &control-env
  FSSAI_PROFILE: profiles/student_support.yaml
  FSSAI_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  FSSAI_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  FSSAI_KAFKA_BOOTSTRAP: kafka:29092
  FSSAI_EVIDENCE_TOKEN: ${FSSAI_EVIDENCE_TOKEN}
  FSSAI_EVENT_ENVELOPE_KEY: ${FSSAI_EVENT_ENVELOPE_KEY:-}
  FSSAI_APPROVAL_SIGNING_KEY: ${FSSAI_APPROVAL_SIGNING_KEY}
  FSSAI_APPROVAL_KEY_ID: ${FSSAI_APPROVAL_KEY_ID:-pilot-approval-key-1}
  FSSAI_AUTH_MODE: ${FSSAI_AUTH_MODE:-token}
  FSSAI_AUTH_TOKENS_JSON: ${FSSAI_AUTH_TOKENS_JSON}
  FSSAI_MODEL: ${FSSAI_MODEL:-ollama}
  FSSAI_OLLAMA_HOST: http://ollama:11434
  FSSAI_OLLAMA_MODEL: ${FSSAI_OLLAMA_MODEL:-llama3.2}
  FSSAI_MODEL_FALLBACK: ${FSSAI_MODEL_FALLBACK:-allow}
  FSSAI_CORS_ORIGINS: http://localhost:8088,http://127.0.0.1:8088,http://localhost:5173
  # The three things only the institution can declare. Passed through with no
  # default on purpose: an unset value means "not declared", which `fssaira
  # doctor` reports as a finding. A compose-level fallback would hand every
  # deployment the reference numbers and make the declaration nobody's decision.
  # See deploy/.env.example for what each one commits you to.
  # Empty FSSAI_REVIEW_* values mean "enforce the domain pack's review block".
  FSSAI_REVIEW_MAX_PER_WINDOW: ${FSSAI_REVIEW_MAX_PER_WINDOW:-}
  FSSAI_REVIEW_WINDOW_SECONDS: ${FSSAI_REVIEW_WINDOW_SECONDS:-}
  FSSAI_REVIEW_DELIBERATION_FLOOR: ${FSSAI_REVIEW_DELIBERATION_FLOOR:-}
  FSSAI_REVIEW_SECOND_REVIEWER_AFTER: ${FSSAI_REVIEW_SECOND_REVIEWER_AFTER:-}
  FSSAI_REVIEW_SECONDS_PER_DAY: ${FSSAI_REVIEW_SECONDS_PER_DAY:-}
  FSSAI_REVIEW_ASSISTANCE_MODE: ${FSSAI_REVIEW_ASSISTANCE_MODE:-}
  FSSAI_REVIEW_ASSISTANCE_DECLARED_BY: ${FSSAI_REVIEW_ASSISTANCE_DECLARED_BY:-}
  FSSAI_REVIEW_ASSISTANT_NAME: ${FSSAI_REVIEW_ASSISTANT_NAME:-}
  FSSAI_REVIEW_ASSISTANT_INDEPENDENT_MODEL: ${FSSAI_REVIEW_ASSISTANT_INDEPENDENT_MODEL:-}
  FSSAI_REVIEW_ASSISTANT_INDEPENDENT_EVIDENCE: ${FSSAI_REVIEW_ASSISTANT_INDEPENDENT_EVIDENCE:-}
  FSSAI_REVIEW_ASSISTANT_ADVERSARIAL: ${FSSAI_REVIEW_ASSISTANT_ADVERSARIAL:-}
  FSSAI_MAX_DELEGATION_DEPTH: ${FSSAI_MAX_DELEGATION_DEPTH:-}
  FSSAI_HUMAN_APPROVAL_BELOW_DEPTH: ${FSSAI_HUMAN_APPROVAL_BELOW_DEPTH:-}
  FSSAI_ALLOW_MACHINE_DELEGATED_CONSEQUENCE: ${FSSAI_ALLOW_MACHINE_DELEGATED_CONSEQUENCE:-}

x-hardening: &hardening
  read_only: true
  tmpfs: [/tmp]
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  restart: unless-stopped

services:
  # ----------------------------------------------------------- system of record
  postgres:
    image: postgres@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Checksums make silent storage corruption of the evidence chain visible.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [control]
    restart: unless-stopped

  redis:
    image: redis@sha256:30abb90e62f14b737010746def3ba99cc79fe19dcdb3d37b41f21fc62e7da19d
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis-data:/data
    networks: [control]
    restart: unless-stopped

  kafka:
    image: apache/kafka@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
    environment:
      # Keep the log on the kafka-data volume. The image default is
      # /tmp/kafka-logs inside the container, which every recreate wipes: offsets
      # restart at zero and consumers keyed on offsets can mistake new records
      # for ones they have already processed.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Fixed so the formatted storage on the volume stays valid across restarts.
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-5L6g3nShT-eMCtK--X86sw}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://:29092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_RETENTION_HOURS: 168
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list"]
      interval: 10s
      timeout: 5s
      retries: 20
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks: [data]
    restart: unless-stopped

  # -------------------------------------------------------------- local model
  ollama:
    image: ollama/ollama@sha256:e790300fb6494a09b0c493954b1aa39c560bb900043a8a3b77f38a42a160bfc2
    profiles: [model]
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
    networks: [control]
    restart: unless-stopped
    # The weights stay on hardware the institution controls. That is the minimum
    # condition for the sovereignty claim, not the whole of it.

  ollama-pull:
    image: ollama/ollama@sha256:e790300fb6494a09b0c493954b1aa39c560bb900043a8a3b77f38a42a160bfc2
    profiles: [model]
    depends_on:
      ollama: {condition: service_started}
    entrypoint: ["/bin/sh", "-c"]
    command: ["sleep 5 && OLLAMA_HOST=http://ollama:11434 ollama pull ${FSSAI_OLLAMA_MODEL:-llama3.2}"]
    networks: [control]
    restart: "no"

  # ------------------------------------------------------------ control plane
  control-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment: *control-env
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      kafka: {condition: service_healthy}
    ports: ["127.0.0.1:${FSSAI_API_PORT:-8080}:8080"]
    # operator-side exists only so the localhost development port is reachable.
    # Production should terminate authenticated ingress in a separately governed
    # reverse proxy and keep the service networks internal.
    networks: [operator-side, control, data]
    <<: *hardening

  import-gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["uvicorn", "fssaira.import_api:create_import_app", "--factory",
              "--host", "0.0.0.0", "--port", "8081"]
    environment:
      FSSAI_KAFKA_BOOTSTRAP: kafka:29092
      FSSAI_IMPORT_ENVELOPE_KEY: ${FSSAI_IMPORT_ENVELOPE_KEY:-}
      FSSAI_IMPORT_TOPIC: ${FSSAI_IMPORT_TOPIC:-fssaira.imports}
      FSSAI_IMPORT_SOURCE_KEYS_JSON: ${FSSAI_IMPORT_SOURCE_KEYS_JSON}
      FSSAI_EVIDENCE_TOKEN: ${FSSAI_EVIDENCE_TOKEN}
      # Quarantine and ingest evidence belongs on the low side and must survive
      # a gateway restart. It is deliberately not written to the control DB.
      FSSAI_IMPORT_AUDIT_PATH: /var/lib/fssaira/import-audit.sqlite3
    depends_on:
      kafka: {condition: service_healthy}
    ports: ["127.0.0.1:${FSSAI_GATEWAY_PORT:-8081}:8081"]
    # Deliberately not on the `control` network. The gateway can publish inward
    # and cannot reach the control plane, the database, or the console.
    networks: [low-side, data]
    volumes:
      - import-audit:/var/lib/fssaira
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/health"]
      interval: 15s
      timeout: 4s
      retries: 5
    <<: *hardening

  console:
    build:
      context: ../console
      dockerfile: Dockerfile
    depends_on:
      control-api: {condition: service_healthy}
    ports: ["127.0.0.1:${FSSAI_CONSOLE_PORT:-8088}:8088"]
    networks: [operator-side]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  # ------------------------------------------------------- analytics and archive
  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    profiles: [analytics]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 20
    volumes:
      - object-data:/data
    networks: [catalog]
    restart: unless-stopped

  minio-init:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    profiles: [analytics]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - 'mc alias set warehouse http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null; mc mb --ignore-existing warehouse/warehouse'
    depends_on:
      minio: {condition: service_healthy}
    networks: [catalog]
    restart: "no"

  iceberg-rest:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.catalog
    profiles: [analytics]
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_REGION: us-east-1
      CATALOG_URI: jdbc:sqlite:/var/lib/iceberg/catalog.db
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
    depends_on:
      minio-init: {condition: service_completed_successfully}
    volumes:
      - catalog-data:/var/lib/iceberg
    networks: [catalog, data]
    restart: unless-stopped

  iceberg-bootstrap:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.analytics
    image: fssaira-analytics:local
    profiles: [analytics]
    command: ["/opt/fssaira/jobs/bootstrap_iceberg.py"]
    environment: &analytics-env
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_REGION: us-east-1
      KAFKA_BOOTSTRAP: kafka:29092
      FSSAI_IMPORT_TOPIC: ${FSSAI_IMPORT_TOPIC:-fssaira.imports}
      FSSAI_CHECKPOINT: ${FSSAI_CHECKPOINT:-/opt/fssaira/checkpoints/imports}
      # Raise when the import topic is deleted and recreated (offsets restart at 0).
      FSSAI_IMPORT_TOPIC_GENERATION: ${FSSAI_IMPORT_TOPIC_GENERATION:-1}
      FSSAI_IMPORT_ENVELOPE_KEY: ${FSSAI_IMPORT_ENVELOPE_KEY:-}
      ICEBERG_CATALOG_URI: http://iceberg-rest:8181
      ICEBERG_WAREHOUSE: s3://warehouse/
      S3_ENDPOINT: http://minio:9000
    depends_on:
      iceberg-rest: {condition: service_started}
    networks: [data, catalog]
    restart: "no"

  spark-iceberg:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.analytics
    image: fssaira-analytics:local
    profiles: [analytics]
    environment: *analytics-env
    volumes:
      - ../jobs:/opt/fssaira/jobs:ro
      - ../src:/opt/fssaira/src:ro
      - spark-checkpoints:/opt/fssaira/checkpoints
    depends_on:
      kafka: {condition: service_healthy}
      iceberg-bootstrap: {condition: service_completed_successfully}
    networks: [data, catalog]
    restart: unless-stopped

networks:
  # Reachable from the host, so a developer can open the console and the API.
  operator-side: {}
  # The gateway's own segment. It has no route to the control plane.
  low-side: {}
  # State: database, cache, and model. No route off the host.
  control: {internal: true}
  # Event transport, shared by the gateway and the control plane.
  data: {internal: true}
  # Object storage and the table catalog.
  catalog: {internal: true}

volumes:
  postgres-data: {}
  redis-data: {}
  kafka-data: {}
  object-data: {}
  catalog-data: {}
  ollama-models: {}
  spark-checkpoints: {}
  import-audit: {}
