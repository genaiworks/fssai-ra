<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 316" width="760" height="316" role="img" aria-label="Seven-stage lifecycle for building and operating a governed AI capability" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<title>Seven-stage lifecycle for building and operating a governed AI capability</title>
<rect width="760" height="316" fill="#ffffff"/>
<defs><marker id="life-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<rect x="0" y="0" width="178" height="138" rx="6" fill="#ffffff" stroke="#c3c2b7" stroke-width="1"/>
<circle cx="20" cy="21" r="12" fill="#2a78d6"/>
<text x="20" y="25.5" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="40" y="26" font-size="12.5" font-weight="700" fill="#0b0b0b" text-anchor="start">Frame</text>
<text x="12" y="51" font-size="9.8" font-weight="400" fill="#52514e" text-anchor="start">Name one consequential</text>
<text x="12" y="65" font-size="9.8" font-weight="400" fill="#52514e" text-anchor="start">capability, its asset,</text>
<text x="12" y="79" font-size="9.8" font-weight="400" fill="#52514e" text-anchor="start">harm, and owner.</text>
<line x1="12" y1="92" x2="166" y2="92" stroke="#e8e7e1" stroke-width="1"/>
<text x="12" y="108" font-size="9.5" font-weight="400" fill="#52514e" text-anchor="start">Artifact: capability card</text>
<text x="12" y="124" font-size="9.5" font-weight="700" fill="#184f95" text-anchor="start">Gate: an owner accepts it</text>
<path d="M178,69.0 H193" fill="none" stroke="#52514e" stroke-width="1.5" marker-end="url(#life-arrow)"/>
<rect x="194" y="0" width="178" height="138" rx="6" fill="#ffffff" stroke="#c3c2b7" stroke-width="1"/>
<circle cx="214" cy="21" r="12" fill="#2a78d6"/>
<text x="214" y="25.5" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="234" y="26" font-size="12.5" font-weight="700" fill="#0b0b0b" text-anchor="start">Contract</text>
<text x="206" y="51" font-size="9.8" font-weight="400" fill="#52514e" text-anchor="start">Fill all seven fields;</text>
<text x="206" y="65" font-size="9.8" font-weight="400" fill="#52514e" text-anchor="start">an empty field is an</text>
<text x="206" y="79" font-size="9.8" font-weight="400" fill="#52514e" text-anchor="start">open governance decision.</text>
<line x1="206" y1="92" x2="360" y2="92" stroke="#e8e7e1" stroke-width="1"/>
<text x="206" y="108" font-size="9.5" font-weight="400" fill="#52514e" text-anchor="start">Artifact: control contract</text>
<text x="206" y="124" font-size="9.5" font-weight="700" fill="#184f95" text-anchor="start">Gate: no field left empty</text>
<path d="M372,69.0 H387" fill="none" stroke="#52514e" stroke-width="1.5" marker-end="url(#life-arrow)"/>
<rect x="388" y="0" width="178" height="138" rx="6" fill="#ffffff" stroke="#c3c2b7" stroke-width="1"/>
<circle cx="408" cy="21" r="12" fill="#2a78d6"/>
<text x="408" y="25.5" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="428" y="26" font-size="12.5" font-weight="700" fill="#0b0b0b" text-anchor="start">Pack</text>
<text x="400" y="51" font-size="9.8" font-weight="400" fill="#52514e" text-anchor="start">Declare purposes, data</text>
<text x="400" y="65" font-size="9.8" font-weight="400" fill="#52514e" text-anchor="start">classes, zones, recipients,</text>
<text x="400" y="79" font-size="9.8" font-weight="400" fill="#52514e" text-anchor="start">transitions, and fallback.</text>
<line x1="400" y1="92" x2="554" y2="92" stroke="#e8e7e1" stroke-width="1"/>
<text x="400" y="108" font-size="9.5" font-weight="400" fill="#52514e" text-anchor="start">Artifact: domain pack</text>
<text x="400" y="124" font-size="9.5" font-weight="700" fill="#184f95" text-anchor="start">Gate: the pack validates</text>
<path d="M566,69.0 H581" fill="none" stroke="#52514e" stroke-width="1.5" marker-end="url(#life-arrow)"/>
<rect x="582" y="0" width="178" height="138" rx="6" fill="#ffffff" stroke="#c3c2b7" stroke-width="1"/>
<circle cx="602" cy="21" r="12" fill="#2a78d6"/>
<text x="602" y="25.5" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<text x="622" y="26" font-size="12.5" font-weight="700" fill="#0b0b0b" text-anchor="start">Bind</text>
<text x="594" y="51" font-size="9.8" font-weight="400" fill="#52514e" text-anchor="start">Give credentials only to</text>
<text x="594" y="65" font-size="9.8" font-weight="400" fill="#52514e" text-anchor="start">mediators; register and</text>
<text x="594" y="79" font-size="9.8" font-weight="400" fill="#52514e" text-anchor="start">attest every model.</text>
<line x1="594" y1="92" x2="748" y2="92" stroke="#e8e7e1" stroke-width="1"/>
<text x="594" y="108" font-size="9.5" font-weight="400" fill="#52514e" text-anchor="start">Artifact: bindings, manifests</text>
<text x="594" y="124" font-size="9.5" font-weight="700" fill="#184f95" text-anchor="start">Gate: no model holds a key</text>
<rect x="0" y="178" width="178" height="138" rx="6" fill="#ffffff" stroke="#184f95" stroke-width="2"/>
<circle cx="20" cy="199" r="12" fill="#2a78d6"/>
<text x="20" y="203.5" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
<text x="40" y="204" font-size="12.5" font-weight="700" fill="#0b0b0b" text-anchor="start">Falsify</text>
<text x="12" y="229" font-size="9.8" font-weight="400" fill="#52514e" text-anchor="start">Attack it on synthetic data:</text>
<text x="12" y="243" font-size="9.8" font-weight="400" fill="#52514e" text-anchor="start">hostile scenarios, ablation,</text>
<text x="12" y="257" font-size="9.8" font-weight="400" fill="#52514e" text-anchor="start">bounded checks.</text>
<line x1="12" y1="270" x2="166" y2="270" stroke="#e8e7e1" stroke-width="1"/>
<text x="12" y="286" font-size="9.5" font-weight="400" fill="#52514e" text-anchor="start">Artifact: evidence run</text>
<text x="12" y="302" font-size="9.5" font-weight="700" fill="#184f95" text-anchor="start">Gate: zero counterexamples</text>
<path d="M178,247.0 H193" fill="none" stroke="#52514e" stroke-width="1.5" marker-end="url(#life-arrow)"/>
<rect x="194" y="178" width="178" height="138" rx="6" fill="#ffffff" stroke="#c3c2b7" stroke-width="1"/>
<circle cx="214" cy="199" r="12" fill="#2a78d6"/>
<text x="214" y="203.5" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>
<text x="234" y="204" font-size="12.5" font-weight="700" fill="#0b0b0b" text-anchor="start">Promote</text>
<text x="206" y="229" font-size="9.8" font-weight="400" fill="#52514e" text-anchor="start">Rerun conformance on the</text>
<text x="206" y="243" font-size="9.8" font-weight="400" fill="#52514e" text-anchor="start">target stack; deploy only</text>
<text x="206" y="257" font-size="9.8" font-weight="400" fill="#52514e" text-anchor="start">on current evidence.</text>
<line x1="206" y1="270" x2="360" y2="270" stroke="#e8e7e1" stroke-width="1"/>
<text x="206" y="286" font-size="9.5" font-weight="400" fill="#52514e" text-anchor="start">Artifact: release evidence</text>
<text x="206" y="302" font-size="9.5" font-weight="700" fill="#184f95" text-anchor="start">Gate: fresh run matches</text>
<path d="M372,247.0 H387" fill="none" stroke="#52514e" stroke-width="1.5" marker-end="url(#life-arrow)"/>
<rect x="388" y="178" width="178" height="138" rx="6" fill="#ffffff" stroke="#c3c2b7" stroke-width="1"/>
<circle cx="408" cy="199" r="12" fill="#2a78d6"/>
<text x="408" y="203.5" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">7</text>
<text x="428" y="204" font-size="12.5" font-weight="700" fill="#0b0b0b" text-anchor="start">Operate</text>
<text x="400" y="229" font-size="9.8" font-weight="400" fill="#52514e" text-anchor="start">Watch review capacity;</text>
<text x="400" y="243" font-size="9.8" font-weight="400" fill="#52514e" text-anchor="start">revoke, reconcile, erase;</text>
<text x="400" y="257" font-size="9.8" font-weight="400" fill="#52514e" text-anchor="start">exit any vendor.</text>
<line x1="400" y1="270" x2="554" y2="270" stroke="#e8e7e1" stroke-width="1"/>
<text x="400" y="286" font-size="9.5" font-weight="400" fill="#52514e" text-anchor="start">Artifact: evidence ledger</text>
<text x="400" y="302" font-size="9.5" font-weight="700" fill="#184f95" text-anchor="start">Gate: redress works</text>
<path d="M671.0,138 V158.0 H89.0 V177" fill="none" stroke="#52514e" stroke-width="1.5" marker-end="url(#life-arrow)"/>
<path d="M566,247.0 H581" fill="none" stroke="#52514e" stroke-width="1.5" marker-end="url(#life-arrow)"/>
<rect x="582" y="178" width="178" height="138" rx="6" fill="#eef4fc" stroke="#2a78d6" stroke-width="1.5"/>
<text x="671" y="206" font-size="11.5" font-weight="700" fill="#184f95" text-anchor="middle">Any change returns to 5</text>
<text x="671" y="232" font-size="9.8" font-weight="400" fill="#52514e" text-anchor="middle">A new model, vendor, pack,</text>
<text x="671" y="247" font-size="9.8" font-weight="400" fill="#52514e" text-anchor="middle">or backend inherits no</text>
<text x="671" y="262" font-size="9.8" font-weight="400" fill="#52514e" text-anchor="middle">assurance. The same</text>
<text x="671" y="277" font-size="9.8" font-weight="400" fill="#52514e" text-anchor="middle">falsifiers run again and</text>
<text x="671" y="292" font-size="9.8" font-weight="400" fill="#52514e" text-anchor="middle">the evidence is regenerated.</text>
</svg>
