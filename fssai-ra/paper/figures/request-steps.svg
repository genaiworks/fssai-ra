<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 486" width="760" height="486" role="img" aria-label="Ten steps of one governed request, from admission to recovery" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<title>Ten steps of one governed request, from admission to recovery</title>
<rect width="760" height="486" fill="#ffffff"/>
<defs><marker id="steps-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<rect x="0" y="0" width="370" height="86" rx="6" fill="#ffffff" stroke="#c3c2b7" stroke-width="1"/>
<circle cx="22" cy="22" r="13" fill="#2a78d6"/>
<text x="22" y="26.5" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="44" y="23" font-size="12.5" font-weight="700" fill="#0b0b0b" text-anchor="start">Admit</text>
<text x="358" y="22" font-size="8.5" font-weight="700" fill="#77756f" text-anchor="end">BOUNDARY PLANE</text>
<text x="44" y="42" font-size="10" font-weight="400" fill="#52514e" text-anchor="start">Authenticate every caller and source; quarantine</text>
<text x="44" y="56.5" font-size="10" font-weight="400" fill="#52514e" text-anchor="start">untrusted content so it is handled as data, not code.</text>
<text x="44" y="76" font-size="10" font-weight="700" fill="#184f95" text-anchor="start">Nothing unauthenticated enters.</text>
<path d="M22,86 V99" fill="none" stroke="#52514e" stroke-width="1.5" marker-end="url(#steps-arrow)"/>
<rect x="0" y="100" width="370" height="86" rx="6" fill="#ffffff" stroke="#184f95" stroke-width="2"/>
<circle cx="22" cy="122" r="13" fill="#184f95"/>
<text x="22" y="126.5" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="44" y="123" font-size="12.5" font-weight="700" fill="#0b0b0b" text-anchor="start">Protect</text>
<text x="358" y="122" font-size="8.5" font-weight="700" fill="#77756f" text-anchor="end">GOVERNED DATA PLANE</text>
<text x="44" y="142" font-size="10" font-weight="400" fill="#52514e" text-anchor="start">Detect personal data and replace it with vault tokens;</text>
<text x="44" y="156.5" font-size="10" font-weight="400" fill="#52514e" text-anchor="start">encrypt sensitive fields under per-subject keys.</text>
<text x="44" y="176" font-size="10" font-weight="700" fill="#184f95" text-anchor="start">Identities never reach a model.</text>
<path d="M22,186 V199" fill="none" stroke="#52514e" stroke-width="1.5" marker-end="url(#steps-arrow)"/>
<rect x="0" y="200" width="370" height="86" rx="6" fill="#ffffff" stroke="#c3c2b7" stroke-width="1"/>
<circle cx="22" cy="222" r="13" fill="#2a78d6"/>
<text x="22" y="226.5" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="44" y="223" font-size="12.5" font-weight="700" fill="#0b0b0b" text-anchor="start">Route</text>
<text x="358" y="222" font-size="8.5" font-weight="700" fill="#77756f" text-anchor="end">INTELLIGENCE PLANE, ADVISORY</text>
<text x="44" y="242" font-size="10" font-weight="400" fill="#52514e" text-anchor="start">Classify intent and sensitivity; choose the cheapest</text>
<text x="44" y="256.5" font-size="10" font-weight="400" fill="#52514e" text-anchor="start">attested model whose zone may process every class.</text>
<text x="44" y="276" font-size="10" font-weight="700" fill="#184f95" text-anchor="start">Restricted data stays on local models.</text>
<path d="M22,286 V299" fill="none" stroke="#52514e" stroke-width="1.5" marker-end="url(#steps-arrow)"/>
<rect x="0" y="300" width="370" height="86" rx="6" fill="#ffffff" stroke="#184f95" stroke-width="2"/>
<circle cx="22" cy="322" r="13" fill="#184f95"/>
<text x="22" y="326.5" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<text x="44" y="323" font-size="12.5" font-weight="700" fill="#0b0b0b" text-anchor="start">Entitle</text>
<text x="358" y="322" font-size="8.5" font-weight="700" fill="#77756f" text-anchor="end">CONTEXT GATE</text>
<text x="44" y="342" font-size="10" font-weight="400" fill="#52514e" text-anchor="start">Check signed grant, purpose, consent, revocation,</text>
<text x="44" y="356.5" font-size="10" font-weight="400" fill="#52514e" text-anchor="start">zone, and attestation; decrypt the minimum fields.</text>
<text x="44" y="376" font-size="10" font-weight="700" fill="#184f95" text-anchor="start">No entitlement, no read.</text>
<path d="M22,386 V399" fill="none" stroke="#52514e" stroke-width="1.5" marker-end="url(#steps-arrow)"/>
<rect x="0" y="400" width="370" height="86" rx="6" fill="#f4f3ef" stroke="#c3c2b7" stroke-width="1"/>
<circle cx="22" cy="422" r="13" fill="#77756f"/>
<text x="22" y="426.5" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
<text x="44" y="423" font-size="12.5" font-weight="700" fill="#0b0b0b" text-anchor="start">Reason</text>
<text x="358" y="422" font-size="8.5" font-weight="700" fill="#77756f" text-anchor="end">INTELLIGENCE PLANE, UNTRUSTED</text>
<text x="44" y="442" font-size="10" font-weight="400" fill="#52514e" text-anchor="start">The model drafts or proposes over tokens and labelled</text>
<text x="44" y="456.5" font-size="10" font-weight="400" fill="#52514e" text-anchor="start">context. It holds no key, token map, or credential.</text>
<text x="44" y="476" font-size="10" font-weight="700" fill="#77756f" text-anchor="start">An output is a proposal, never a power.</text>
<rect x="390" y="0" width="370" height="86" rx="6" fill="#ffffff" stroke="#c3c2b7" stroke-width="1"/>
<circle cx="412" cy="22" r="13" fill="#2a78d6"/>
<text x="412" y="26.5" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>
<text x="434" y="23" font-size="12.5" font-weight="700" fill="#0b0b0b" text-anchor="start">Authorize</text>
<text x="748" y="22" font-size="8.5" font-weight="700" fill="#77756f" text-anchor="end">AUTHORITY PLANE</text>
<text x="434" y="42" font-size="10" font-weight="400" fill="#52514e" text-anchor="start">Approve the exact proposal digest within declared</text>
<text x="434" y="56.5" font-size="10" font-weight="400" fill="#52514e" text-anchor="start">review capacity; delegated authority only narrows.</text>
<text x="434" y="76" font-size="10" font-weight="700" fill="#184f95" text-anchor="start">Authority cannot be manufactured.</text>
<path d="M412,86 V99" fill="none" stroke="#52514e" stroke-width="1.5" marker-end="url(#steps-arrow)"/>
<rect x="390" y="100" width="370" height="86" rx="6" fill="#ffffff" stroke="#184f95" stroke-width="2"/>
<circle cx="412" cy="122" r="13" fill="#184f95"/>
<text x="412" y="126.5" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">7</text>
<text x="434" y="123" font-size="12.5" font-weight="700" fill="#0b0b0b" text-anchor="start">Execute</text>
<text x="748" y="122" font-size="8.5" font-weight="700" fill="#77756f" text-anchor="end">EXECUTION PLANE</text>
<text x="434" y="142" font-size="10" font-weight="400" fill="#52514e" text-anchor="start">Recheck policy, identity, version, approval, and</text>
<text x="434" y="156.5" font-size="10" font-weight="400" fill="#52514e" text-anchor="start">replay; make one write and issue one receipt.</text>
<text x="434" y="176" font-size="10" font-weight="700" fill="#184f95" text-anchor="start">Exactly one checked effect.</text>
<path d="M412,186 V199" fill="none" stroke="#52514e" stroke-width="1.5" marker-end="url(#steps-arrow)"/>
<rect x="390" y="200" width="370" height="86" rx="6" fill="#ffffff" stroke="#184f95" stroke-width="2"/>
<circle cx="412" cy="222" r="13" fill="#184f95"/>
<text x="412" y="226.5" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">8</text>
<text x="434" y="223" font-size="12.5" font-weight="700" fill="#0b0b0b" text-anchor="start">Release</text>
<text x="748" y="222" font-size="8.5" font-weight="700" fill="#77756f" text-anchor="end">CONTEXT GATE</text>
<text x="434" y="242" font-size="10" font-weight="400" fill="#52514e" text-anchor="start">Label the output by everything it used; restore real</text>
<text x="434" y="256.5" font-size="10" font-weight="400" fill="#52514e" text-anchor="start">values only for a recipient entitled to see them.</text>
<text x="434" y="276" font-size="10" font-weight="700" fill="#184f95" text-anchor="start">Nothing is laundered out.</text>
<path d="M412,286 V299" fill="none" stroke="#52514e" stroke-width="1.5" marker-end="url(#steps-arrow)"/>
<rect x="390" y="300" width="370" height="86" rx="6" fill="#ffffff" stroke="#c3c2b7" stroke-width="1"/>
<circle cx="412" cy="322" r="13" fill="#2a78d6"/>
<text x="412" y="326.5" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">9</text>
<text x="434" y="323" font-size="12.5" font-weight="700" fill="#0b0b0b" text-anchor="start">Record</text>
<text x="748" y="322" font-size="8.5" font-weight="700" fill="#77756f" text-anchor="end">EVIDENCE PLANE</text>
<text x="434" y="342" font-size="10" font-weight="400" fill="#52514e" text-anchor="start">Bind intent to outcome in an append-only chain that</text>
<text x="434" y="356.5" font-size="10" font-weight="400" fill="#52514e" text-anchor="start">stores digests, never the protected values.</text>
<text x="434" y="376" font-size="10" font-weight="700" fill="#184f95" text-anchor="start">Every outcome can be reconstructed.</text>
<path d="M412,386 V399" fill="none" stroke="#52514e" stroke-width="1.5" marker-end="url(#steps-arrow)"/>
<rect x="390" y="400" width="370" height="86" rx="6" fill="#ffffff" stroke="#c3c2b7" stroke-width="1"/>
<circle cx="412" cy="422" r="13" fill="#2a78d6"/>
<text x="412" y="426.5" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">10</text>
<text x="434" y="423" font-size="12.5" font-weight="700" fill="#0b0b0b" text-anchor="start">Recover</text>
<text x="748" y="422" font-size="8.5" font-weight="700" fill="#77756f" text-anchor="end">RESILIENCE PLANE</text>
<text x="434" y="442" font-size="10" font-weight="400" fill="#52514e" text-anchor="start">Revoke, reconcile uncertain effects, fall back to</text>
<text x="434" y="456.5" font-size="10" font-weight="400" fill="#52514e" text-anchor="start">manual work, and erase a subject by destroying its key.</text>
<text x="434" y="476" font-size="10" font-weight="700" fill="#184f95" text-anchor="start">Failure is safe; erasure is real.</text>
<path d="M370,443.0 H380 V43.0 H389" fill="none" stroke="#52514e" stroke-width="1.5" marker-end="url(#steps-arrow)"/>
</svg>
