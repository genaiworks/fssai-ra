# Full-paper metric bindings for paper/trust-by-construction.md.
#
# Checked by scripts/bind_paper_metrics.py (and scripts/check_submission.py --full-paper).
# Every number-bearing token in the paper body (References and URLs excluded) must lie
# inside a quote below. A `result` quote covers only the tokens its bound values match;
# `specification`, `citation` and `parameter` quotes cover every token they contain and
# carry a justification. Pointers resolve into audit/results.json, which is itself read
# from committed machine-written results by scripts/collect_results.py.
#
# Deliberately NOT bound, because no committed machine-written result backs them; the
# binder reports them so they are reconciled rather than hidden:
#   "five contract bindings named functions that did not exist"   (Section 7.5)
#   "eighteen of twenty-eight were prose bound to nothing"         (Section 7.5)
#   "executed 841 baseline tests successfully"                     (Section 7.8; text log only)
#   "Five synthetic rationale variants"                            (Section 7.9)
#   "closed two defects the earlier suites did not exercise"       (Section 9.2)
version: 1
results: audit/results.json
bindings:

