capabilities:
  source_quarantine:
    protected_asset: Derived institutional artifacts and pending effects
    permitted_operation: Read or act only on nonquarantined source bindings
    enforcement_point: TrustRuntime source checks before context and derivative use
    accountable_owner: Institution security operator
    failure_test: tests/test_tbc_sdk.py::test_source_quarantine_blocks_derived_memory_effects_and_survives_restart
    evidence_artifact: audit/architecture/executed-tests.xml
    failure_response: Deny and retain a source quarantine event
  durable_quarantine:
    protected_asset: Quarantined source versions across sessions
    permitted_operation: Retrieve only a nonquarantined binding
    enforcement_point: Persistent SQLite source invalidation table
    accountable_owner: Institution security operator
    failure_test: tests/test_tbc_sdk.py::test_quarantine_is_persistent_and_blocks_clean_agent_retrieval
    evidence_artifact: audit/architecture/executed-tests.xml
    failure_response: Deny fresh-agent retrieval after service reopening
  versioned_ingress:
    protected_asset: Model-facing request authority
    permitted_operation: Submit a supported versioned proposal
    enforcement_point: TrustRuntime dispatch parser
    accountable_owner: Mediation service maintainer
    failure_test: tests/test_tbc_sdk.py::test_sdk_schema_version_is_enforced_at_real_boundary
    evidence_artifact: audit/architecture/executed-tests.xml
    failure_response: Reject unsupported or ambiguous schema versions
  model_bundle:
    protected_asset: Complete model configuration identity
    permitted_operation: Declare eight SHA256 component digests
    enforcement_point: ModelBundle contract validation
    accountable_owner: Model release engineer
    failure_test: tests/test_integration_contract.py::test_full_model_bundle_changes_when_any_component_changes
    evidence_artifact: audit/architecture/executed-tests.xml
    failure_response: Reject incomplete or malformed bundle declarations
  frozen_tools:
    protected_asset: Approved tool catalogue
    permitted_operation: Use exactly the frozen tool manifest
    enforcement_point: FrozenCatalog contract check
    accountable_owner: Tool integration engineer
    failure_test: tests/test_integration_contract.py::test_tool_catalog_frozen_and_risk_derived_from_manifest
    evidence_artifact: audit/architecture/executed-tests.xml
    failure_response: Reject manifest drift and high-risk direct model exposure
  destination_contract:
    protected_asset: Public egress destination contract
    permitted_operation: Authorize a public HTTPS destination with an explicit path prefix
    enforcement_point: DestinationPolicy authorization component
    accountable_owner: Network integration engineer
    failure_test: tests/test_integration_contract.py::test_destination_bound_egress_rejects_ssrf_and_hidden_channels
    evidence_artifact: audit/architecture/executed-tests.xml
    failure_response: Reject private addresses and undeclared URL channels before transport
  workload_stop:
    protected_asset: All standing authority held by a running workload
    permitted_operation: Act only while a named operator has not stopped the workload
    enforcement_point: Durable tbc_supervision stop flag checked on every authority resolution
    accountable_owner: Institution security operator
    failure_test: tests/test_frontier_controls.py::test_stop_survives_reopen_denies_all_agents_and_requires_new_identity
    evidence_artifact: audit/architecture/executed-tests.xml
    failure_response: Revoke every agent, quarantine every task and require a fresh identity to resume
  stop_without_evidence:
    protected_asset: Operator stop authority during evidence-plane failure
    permitted_operation: Stop the workload even when the evidence writer is unavailable
    enforcement_point: Authority transaction committed before the evidence event is attempted
    accountable_owner: Institution security operator
    failure_test: tests/test_frontier_controls.py::test_stop_stays_effective_when_evidence_writer_fails
    evidence_artifact: audit/architecture/executed-tests.xml
    failure_response: Report evidence_recorded false while keeping the stop durable
  revocable_delivery:
    protected_asset: Approved artifact bytes queued for a recipient
    permitted_operation: Collect exact approved bytes while authority is still current
    enforcement_point: Delivery binding reauthorized at every chunk boundary before bytes leave
    accountable_owner: Release reviewer
    failure_test: tests/test_frontier_controls.py::test_stream_reauthorizes_every_chunk_and_bulk_cannot_bypass
    evidence_artifact: audit/architecture/executed-tests.xml
    failure_response: Deny remaining bytes after revocation, contraction, expiry, stop or source quarantine
  restricted_monitor:
    protected_asset: Task authority state exposed to an AI monitor
    permitted_operation: Submit a bounded finding that can only contract authority
    enforcement_point: apply_monitor_finding schema, snapshot freshness and replay checks
    accountable_owner: Assurance operator
    failure_test: tests/test_frontier_controls.py::test_monitor_advice_cannot_forge_authority_or_replay_evidence
    evidence_artifact: audit/architecture/executed-tests.xml
    failure_response: Reject forged, stale, replayed or authority-granting monitor findings
  measured_isolation:
    protected_asset: The deployment assumption that mediation is the only path to the control plane
    permitted_operation: Claim production isolation only from fresh attributed measurement of every required property
    enforcement_point: HostProbe measurement and IsolationReport qualification gate
    accountable_owner: Institution platform engineer
    failure_test: tests/test_isolation.py::test_every_required_property_alone_blocks_production
    evidence_artifact: audit/architecture/executed-tests.xml
    failure_response: Qualify the host as reference and name every violated, unmeasurable or missing property
  unmeasurable_isolation_is_open:
    protected_asset: The distinction between a measured property and an unexamined one
    permitted_operation: Record a property as satisfied only when a probe observed it
    enforcement_point: Three-valued measurement outcome with not_measurable excluded from success
    accountable_owner: Institution platform engineer
    failure_test: tests/test_isolation.py::test_an_unmeasurable_requirement_is_not_treated_as_satisfied
    evidence_artifact: audit/architecture/executed-tests.xml
    failure_response: Leave the requirement open and refuse production qualification
  pinned_transport:
    protected_asset: Outbound bytes to an approved destination
    permitted_operation: Transfer only to the pinned address over a verified and pinned TLS identity
    enforcement_point: QualifiedTransport socket, handshake and public-key pin comparison
    accountable_owner: Network integration engineer
    failure_test: tests/test_qualified_transport.py::test_a_peer_presenting_a_different_key_is_refused
    evidence_artifact: audit/architecture/executed-tests.xml
    failure_response: Refuse the transfer and record a stable denial code instead of peer text
  transport_never_resolves:
    protected_asset: The binding between an authorized address and the connection made
    permitted_operation: Connect to the literal pinned address with no name-service lookup
    enforcement_point: Direct socket connect that never calls getaddrinfo
    accountable_owner: Network integration engineer
    failure_test: tests/test_qualified_transport.py::test_the_connection_uses_the_pinned_address_not_a_resolver
    evidence_artifact: audit/architecture/executed-tests.xml
    failure_response: Fail the transfer rather than accept a resolver answer obtained after authorization
  redirect_reauthorization:
    protected_asset: The destination a transfer actually reaches
    permitted_operation: Treat any redirect as a new authorization decision
    enforcement_point: QualifiedTransport redirect refusal before any body is read
    accountable_owner: Network integration engineer
    failure_test: tests/test_qualified_transport.py::test_a_redirect_is_a_new_authorisation_decision_not_a_followed_hop
    evidence_artifact: audit/architecture/executed-tests.xml
    failure_response: Return the proposed location to the authorization layer and transfer nothing
  wire_byte_ceiling:
    protected_asset: The declared byte ceiling for an approved destination
    permitted_operation: Accept at most the authorized number of bytes
    enforcement_point: Length validation and per-read ceiling enforcement during the transfer
    accountable_owner: Network integration engineer
    failure_test: tests/test_qualified_transport.py::test_a_peer_that_understates_its_length_cannot_overrun_the_ceiling
    evidence_artifact: audit/architecture/executed-tests.xml
    failure_response: Abort the transfer when a peer exceeds or misstates its declared length
  containment_without_detection:
    protected_asset: The world of record behind a mediated workload
    permitted_operation: Depend on the envelope rather than on any monitor verdict
    enforcement_point: Held-out trajectory evaluation across oracle, blind and hostile monitors
    accountable_owner: Assurance operator
    failure_test: tests/test_monitor_evaluation.py::test_no_monitor_changes_a_protected_outcome
    evidence_artifact: audit/architecture/executed-tests.xml
    failure_response: Fail the release when any monitor changes a protected outcome
  hostile_monitor_costs_availability_only:
    protected_asset: Authority held by a workload under an adversarial monitor
    permitted_operation: Restrict work, never grant or restore authority
    enforcement_point: Restrict-only finding interface measured against an inverted monitor
    accountable_owner: Assurance operator
    failure_test: tests/test_monitor_evaluation.py::test_a_hostile_monitor_costs_availability_not_authority
    evidence_artifact: audit/architecture/executed-tests.xml
    failure_response: Record lost availability while preserving every protected outcome
  blocked_attempt_evidence:
    protected_asset: Operator visibility of activity after a stop or quarantine
    permitted_operation: Record every refused attempt by a known identity
    enforcement_point: Denial evidence written outside the failed request transaction
    accountable_owner: Institution security operator
    failure_test: tests/test_frontier_controls.py::test_attempts_after_a_stop_are_recorded_rather_than_silently_refused
    evidence_artifact: audit/architecture/executed-tests.xml
    failure_response: Retain a blocked-attempt event without restoring any authority
  at_most_once_remote_effect:
    protected_asset: An outbound effect on a system outside this transaction
    permitted_operation: Submit once under a key derived from the approved decision
    enforcement_point: Write-ahead effect ledger with idempotency keys and uncertain state
    accountable_owner: Integration engineer
    failure_test: tests/test_remote_effects.py::test_an_uncertain_effect_is_never_retried_blindly
    evidence_artifact: audit/architecture/executed-tests.xml
    failure_response: Refuse a blind retry and require reconciliation by key
  uncertain_effect_blocks_dependents:
    protected_asset: Work that assumes a remote effect completed
    permitted_operation: Proceed only when every outbound effect is settled
    enforcement_point: Ledger settlement check before dependent authority is exercised
    accountable_owner: Integration engineer
    failure_test: tests/test_remote_effects.py::test_an_uncertain_effect_blocks_the_work_that_depends_on_it
    evidence_artifact: audit/architecture/executed-tests.xml
    failure_response: Deny dependent work and name the unresolved effects
  federated_attenuation:
    protected_asset: Authority crossing a service boundary
    permitted_operation: Exercise only the intersection of the grant and the local ceiling
    enforcement_point: FederationPeer signature, audience, expiry, replay and intersection checks
    accountable_owner: Institution security architect
    failure_test: tests/test_federation.py::test_a_grant_cannot_teach_a_service_a_capability_it_does_not_have
    evidence_artifact: audit/architecture/executed-tests.xml
    failure_response: Refuse a grant that would widen local authority or is replayed, expired or misaddressed
  independent_evidence_custody:
    protected_asset: The integrity of the evidence chain against its own custodian
    permitted_operation: Treat a head as attested only on k-of-n independent signatures
    enforcement_point: WitnessSet threshold verification and fork detection
    accountable_owner: Institution audit office
    failure_test: tests/test_federation.py::test_a_fork_is_detected_and_blocks_attestation
    evidence_artifact: audit/architecture/executed-tests.xml
    failure_response: Refuse attestation and surface the divergent heads
  evidence_gated_promotion:
    protected_asset: The boundary between a reference deployment and a production one
    permitted_operation: Promote only on fresh conformance, isolation, transport, witness and effect evidence
    enforcement_point: PromotionGate requirement evaluation with named operator
    accountable_owner: Institution change authority
    failure_test: tests/test_federation.py::test_each_missing_item_alone_refuses_promotion_and_is_named
    evidence_artifact: audit/architecture/executed-tests.xml
    failure_response: Refuse promotion and name every missing or stale item
  harness_evidence_is_not_production:
    protected_asset: The meaning of a qualified transport record
    permitted_operation: Accept transport evidence only from a real peer
    enforcement_point: Qualification flag propagated from policy through evidence into the promotion gate
    accountable_owner: Institution change authority
    failure_test: tests/test_federation.py::test_loopback_transport_evidence_never_promotes_a_deployment
    evidence_artifact: audit/architecture/executed-tests.xml
    failure_response: Refuse promotion on loopback qualification evidence
  tool_definition_pinning:
    protected_asset: The tool definition a human approved
    permitted_operation: Offer exactly the approved definition, description included
    enforcement_point: ToolRegistry digest comparison at every offer
    accountable_owner: Tool integration engineer
    failure_test: tests/test_tool_supply_chain.py::test_any_change_after_approval_quarantines_the_tool
    evidence_artifact: audit/architecture/executed-tests.xml
    failure_response: Quarantine the tool and require a fresh named approval
  tool_name_disambiguation:
    protected_asset: The identity of the tool a model actually calls
    permitted_operation: Resolve only a server-qualified tool name
    enforcement_point: ToolRegistry resolution that refuses bare and malformed names
    accountable_owner: Tool integration engineer
    failure_test: tests/test_tool_supply_chain.py::test_a_bare_name_never_resolves
    evidence_artifact: audit/architecture/executed-tests.xml
    failure_response: Refuse to guess between servers offering the same bare name
  poisoned_description_review:
    protected_asset: Text a model reads as part of its instructions
    permitted_operation: Approve a flagged tool description only by explicit named acceptance
    enforcement_point: Description scan required before approval, with acceptance recorded
    accountable_owner: Tool integration engineer
    failure_test: tests/test_tool_supply_chain.py::test_a_flagged_description_cannot_be_approved_without_saying_so
    evidence_artifact: audit/architecture/executed-tests.xml
    failure_response: Refuse silent approval of a description that issues instructions
  untrusted_chain_confinement:
    protected_asset: Privileged tools reachable after untrusted content enters a chain
    permitted_operation: Process untrusted content without reaching privileged capability
    enforcement_point: Call-chain taint check before every authorised tool call
    accountable_owner: Institution security architect
    failure_test: tests/test_tool_supply_chain.py::test_a_chain_that_touched_untrusted_content_cannot_reach_a_privileged_tool
    evidence_artifact: audit/architecture/executed-tests.xml
    failure_response: Deny the privileged call and keep the chain permanently tainted
  synthetic_results_permit_no_conclusion:
    protected_asset: Claims about institutional utility and equitable outcomes
    permitted_operation: Report measurements from synthetic fixtures without conclusions
    enforcement_point: InstitutionalStudy provenance, power and plan-drift refusals
    accountable_owner: Institution evaluation lead
    failure_test: tests/test_institutional_evaluation.py::test_synthetic_data_yields_measurements_but_never_conclusions
    evidence_artifact: audit/architecture/executed-tests.xml
    failure_response: Set conclusions_permitted false and name every refusal
  small_subgroups_are_withheld:
    protected_asset: Individuals in small subgroups within a fairness report
    permitted_operation: Report a subgroup only above the preregistered cell minimum
    enforcement_point: Cell-size threshold applied before rates and gaps are computed
    accountable_owner: Institution evaluation lead
    failure_test: tests/test_institutional_evaluation.py::test_a_group_below_the_cell_minimum_is_withheld_not_estimated
    evidence_artifact: audit/architecture/executed-tests.xml
    failure_response: Withhold the subgroup and exclude it from every reported gap
  approved_artifact_content:
    protected_asset: Exact bytes approved independently of the network peer
    permitted_operation: Return fetched bytes only when the trusted digest matches
    enforcement_point: QualifiedTransport.fetch_artifact digest verification
    accountable_owner: Integration engineer
    failure_test: tests/test_qualified_transport.py::test_changed_artifact_is_not_returned_despite_valid_peer_identity
    evidence_artifact: audit/architecture/executed-tests.xml
    failure_response: Deny delivery even when peer identity and key are valid
  explicit_remote_settlement:
    protected_asset: Work depending on an acknowledged remote effect
    permitted_operation: Settle only on explicit applied or authoritative absent evidence
    enforcement_point: EffectLedger.reconcile provider response validation
    accountable_owner: Provider integration engineer
    failure_test: tests/test_remote_effects.py::test_nonfinal_or_malformed_lookup_never_unblocks_work
    evidence_artifact: audit/architecture/executed-tests.xml
    failure_response: Retain uncertainty and block dependent work
  authorised_choice_is_a_channel:
    protected_asset: Information carried by release decisions that release escrow does not fix
    permitted_operation: Spend only the declared residual bits of choice per task
    enforcement_point: EgressChannel canonicalisation and per-task bit budget
    accountable_owner: Release reviewer
    failure_test: tests/test_covert_channels.py::test_the_control_is_load_bearing_across_the_ladder
    evidence_artifact: audit/covert-channels.json
    failure_response: Escalate to a named human rather than silently denying the release
  measured_channel_within_declared_capacity:
    protected_asset: The credibility of a declared channel bound
    permitted_operation: Declare a capacity only if a real adversary cannot exceed it
    enforcement_point: Trace-counting measurement against an adversarial encoder
    accountable_owner: Institution security architect
    failure_test: tests/test_covert_channels.py::test_the_measured_leak_never_exceeds_the_declared_capacity
    evidence_artifact: audit/covert-channels.json
    failure_response: Fail the release when a measured leak exceeds the declared capacity
  sealed_release_count:
    protected_asset: Information carried by how many releases a task makes
    permitted_operation: Emit exactly the declared number of releases, padded with cover
    enforcement_point: Fixed release count with indistinguishable cover emissions
    accountable_owner: Release reviewer
    failure_test: tests/test_covert_channels.py::test_a_sealed_policy_refuses_to_exceed_its_fixed_count
    evidence_artifact: audit/covert-channels.json
    failure_response: Refuse releases beyond the fixed count so the trace length cannot vary
  channel_control_preserves_ordinary_work:
    protected_asset: The usefulness of a workload under channel control
    permitted_operation: Complete an ordinary two-release workflow under every policy
    enforcement_point: Benign utility baseline measured beside the adversarial arm
    accountable_owner: Institution evaluation lead
    failure_test: tests/test_covert_channels.py::test_an_ordinary_workflow_completes_under_every_policy
    evidence_artifact: audit/covert-channels.json
    failure_response: Report the control as unusable if ordinary releases cannot complete
