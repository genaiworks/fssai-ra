# Which executable check enforces which contract requirement.
#
# Written after `fssaira coverage` reported that eighteen of twenty-eight
# requirements had a test described in prose and bound to nothing. Most of them
# did have tests; nothing connected the two, so deleting a test removed a
# governance claim silently. That is the failure this project exists to
# eliminate, found in its own contract.
bindings:
  # -- import boundary --------------------------------------------------
  - requirements: [IB-1]
    mechanism: scenario
    locator: src/fssaira/evaluation.py::import_boundary_scenarios
    note: oversized, disallowed type, unregistered source, tampered signature, size mismatch
  - requirements: [IB-1]
    mechanism: unit_test
    locator: tests/test_import_api.py::test_import_gateway_quarantines_bad_signature_without_publishing
  - requirements: [IB-1, IB-4]
    mechanism: unit_test
    locator: tests/test_import_api.py::test_import_gateway_records_an_unclosed_intent_when_delivery_fails
    note: the boundary records delivery intent before publication and never reports a failed publish as accepted
  - requirements: [IB-2]
    mechanism: unit_test
    locator: tests/test_diode_transport.py::test_neither_end_exposes_a_return_path
  - requirements: [IB-2]
    mechanism: unit_test
    locator: tests/test_import_api.py::test_import_gateway_has_no_readback_route
  - requirements: [IB-3]
    mechanism: unit_test
    locator: tests/test_diode_transport.py::test_an_interface_without_an_owner_is_flagged
    note: >-
      the inventory mechanism is tested; the signed review of a real deployment's
      interfaces is the organizational half and is attested separately
  - requirements: [IB-4]
    mechanism: unit_test
    locator: tests/test_attacks.py
    note: prompt-injection specimen delivered as evidence, obtaining no authorization

  # -- event transport ---------------------------------------------------
  - requirements: [ET-1]
    mechanism: conformance
    locator: CF-ET-01, CF-ET-02
  - requirements: [ET-2]
    mechanism: conformance
    locator: CF-ET-03
  - requirements: [ET-2]
    mechanism: unit_test
    locator: tests/test_kafka_backend.py
    note: broker-independent message fixtures verify that source offsets remain uncommitted until handler success or acknowledged dead-letter publication

  # -- reproducible data -------------------------------------------------
  - requirements: [RD-1]
    mechanism: conformance
    locator: CF-RD-01, CF-RD-02
  - requirements: [RD-1]
    mechanism: scenario
    locator: src/fssaira/evaluation.py::platform_scenarios

  # -- bounded intelligence ----------------------------------------------
  - requirements: [BI-1]
    mechanism: conformance
    locator: CF-BI-01
  - requirements: [BI-1]
    mechanism: scenario
    locator: src/fssaira/evaluation.py::bounded_intelligence_scenarios
  - requirements: [BI-2]
    mechanism: ablation
    locator: src/fssaira/evaluation.py::egress_default_deny
  - requirements: [BI-2]
    mechanism: conformance
    locator: CF-BI-02
  - requirements: [BI-3]
    mechanism: unit_test
    locator: tests/test_privilege_invariance.py::test_a_call_that_understates_its_class_is_reclassified
  - requirements: [BI-3]
    mechanism: unit_test
    locator: tests/test_privilege_invariance.py::test_an_unknown_capability_fails_closed
  - requirements: [BI-3]
    mechanism: ablation
    locator: src/fssaira/evaluation.py::privilege_invariance_catalogue
  - requirements: [BI-4]
    mechanism: unit_test
    locator: tests/test_properties.py
    note: the independent reference predicate denies once the call budget is exhausted
  - requirements: [BI-5]
    mechanism: unit_test
    locator: tests/test_security_and_telemetry.py::test_a_non_local_model_endpoint_is_flagged
  - requirements: [BI-5]
    mechanism: unit_test
    locator: tests/test_models_and_plugins.py
    note: unreachable local model with fallback denied fails explicitly

  # -- accountable action ------------------------------------------------
  - requirements: [AA-1]
    mechanism: ablation
    locator: src/fssaira/evaluation.py::named_human_for_high_impact
