# Serves the built console and proxies /api to the control plane, so the browser
# talks to exactly one origin and the control plane needs no permissive CORS.
#
# This container terminates nothing and authenticates nobody. In a deployment,
# put an authenticating reverse proxy in front of it and have that proxy
# overwrite — never forward — any caller-supplied X-FSSAI-* header.
server {
    listen 8088;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-ancestors 'none'; base-uri 'none'" always;

    gzip on;
    gzip_types text/css application/javascript application/json;

    location /api/ {
        proxy_pass http://control-api:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Strip any identity header a browser tried to set: this proxy does not
        # authenticate, so it must not appear to.
        proxy_set_header X-FSSAI-Identity "";
        proxy_set_header X-FSSAI-Role "";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
