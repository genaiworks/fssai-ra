# Governed Learning: the education domain pack for reusable education demonstrations.
#
# Everything here is synthetic. The pack declares what an institution means by
# student support, transcript correction, financial aid, faculty feedback, and a
# student's right to challenge a decision. The kernel enforces it; the pack
# cannot weaken the kernel (fssaira.pack_floor rejects any pack that tries).
#
# Sections beyond the six-pack core format:
#   identity_fields  which fields are identity; they reach a model only as tokens
#   controls         the seven-field control contract for every consequential
#                    capability, each with a failure test that must exist
#   model_manifests  which models are approved, for which classes and purposes
#   review           declared human review capacity and the overload policy
#   delegation       declared bounds on authority passed between agents
profile_id: governed-learning-education
version: "1.0"
title: Governed Learning (education pack for reusable education demonstrations)
resource_name: student_record_item
owner: university_registrar
manual_fallback: >-
  Leave the record unchanged, route the request to the registrar or student
  services for staffed handling, and tell the student how to follow it up.
governance:
  domain: education
  purpose: Support students, correct records, review aid, and release faculty feedback with AI assistance that holds no authority of its own, on synthetic records only.
  deployment_profile: teaching
  data_classes:
    - student-identity
    - student-academic
    - student-support-sensitive
    - student-health
    - student-financial
    - de-identified-cohort
  applicable_frameworks:
    - Institution-specific student-record privacy and correction obligations
    - Applicable data-protection law on purpose limitation, minimisation, and erasure
    - Institutional academic appeals and financial-aid procedures
  prohibited_uses:
    - A model changing a grade, awarding aid, or releasing feedback without the named human authority
    - Sending student identity, health, support, or financial data to an external model or recipient
    - Using student records for marketing, profiling, or model training
    - Hiding a decision from the student it concerns or removing the right to challenge it
  processing_basis: Institution-approved student support, record correction, aid administration, and appeals, using synthetic records only.
  data_minimization_rule: Release only the fields the stated purpose needs, for the named students, to the named holder, for a bounded time.
  retention_rule: Retain decision evidence for the declared appeals period; retain working copies only for the session that needed them.
  deletion_rule: Erase a student on a valid request by destroying the student's data keys; keep only digests and surrogate identifiers in evidence.
  residency_rule: Identity, support, health, and financial data are processed only on campus; academic data may use an approved education cloud.
  incident_response: Freeze automated steps, preserve evidence, notify the registrar, privacy officer, and security, and route open work to staffed handling.
  owners:
    data: university_registrar
    privacy: institutional_privacy_officer
    security: information_security

identity_fields:
  student_name: STUDENT_NAME
  student_number: STUDENT_NUMBER
  email: EMAIL

disclosure:
  subject_kind: student
  purposes:
    - academic-support
    - transcript-correction
    - financial-aid-review
    - student-self-access
    - institutional-research
    - student-safety-emergency
  fields:
    student_name: {class: student-identity}
    student_number: {class: student-identity}
    email: {class: student-identity}
    attendance_rate: {class: student-academic}
    current_grades: {class: student-academic}
    academic_history: {class: student-academic}
    support_plan: {class: student-support-sensitive}
    disability_accommodation: {class: student-health}
    counselling_notes: {class: student-health}
    household_income: {class: student-financial}
    aid_status: {class: student-financial}
  model_endpoints:
    campus_local_model: campus-on-premises
    campus_local_model_b: campus-on-premises
    approved_edu_cloud: approved-cloud
    public_chatbot_api: external
  class_zones:
    student-identity: [campus-on-premises]
    student-academic: [campus-on-premises, approved-cloud]
    student-support-sensitive: [campus-on-premises]
    student-health: [campus-on-premises]
    student-financial: [campus-on-premises]
    de-identified-cohort: [campus-on-premises, approved-cloud]
  recipients:
    academic_advisor:
      classes: [student-identity, student-academic, student-support-sensitive]
      purposes: [academic-support]
      zone: campus-on-premises
    teaching_assistant_chat:
      classes: [student-academic]
      purposes: [academic-support]
      zone: campus-on-premises
    registrar_office:
      classes: [student-identity, student-academic]
      purposes: [transcript-correction]
      zone: campus-on-premises
    financial_aid_officer:
      classes: [student-identity, student-academic, student-financial]
      purposes: [financial-aid-review]
      zone: campus-on-premises
    student_portal:
      classes: [student-identity, student-academic, student-support-sensitive, student-financial]
      purposes: [student-self-access]
      zone: campus-on-premises
      subject_scope: self
    research_office:
      classes: [de-identified-cohort]
      purposes: [institutional-research]
      zone: approved-cloud
    counselling_service:
      classes: [student-identity, student-health, student-support-sensitive]
      purposes: [student-safety-emergency]
      zone: campus-on-premises
    external_email:
      classes: []
      purposes: []
      zone: external
  declassification:
    - name: deidentify_for_cohort_research
      from_classes: [student-academic]
      to_class: de-identified-cohort
      purposes: [institutional-research]
      approval_role: institutional_research_board
      removes_subject_identity: true
  break_glass:
    purposes: [student-safety-emergency]
    max_ttl_seconds: 1800
    max_unreviewed_per_holder: 1
    review_role: dean_of_students

transitions:
  # Transcript correction: the grade is the state, so a correction is one exact,
  # versioned transition that only the registrar may approve.
  - {operation: correct_transcript_grade, from_status: "grade:A", to_status: "grade:B", consequential: true, approval_role: university_registrar}
  - {operation: correct_transcript_grade, from_status: "grade:A", to_status: "grade:C", consequential: true, approval_role: university_registrar}
  - {operation: correct_transcript_grade, from_status: "grade:A", to_status: "grade:D", consequential: true, approval_role: university_registrar}
  - {operation: correct_transcript_grade, from_status: "grade:A", to_status: "grade:F", consequential: true, approval_role: university_registrar}
  - {operation: correct_transcript_grade, from_status: "grade:B", to_status: "grade:A", consequential: true, approval_role: university_registrar}
  - {operation: correct_transcript_grade, from_status: "grade:B", to_status: "grade:C", consequential: true, approval_role: university_registrar}
  - {operation: correct_transcript_grade, from_status: "grade:B", to_status: "grade:D", consequential: true, approval_role: university_registrar}
  - {operation: correct_transcript_grade, from_status: "grade:B", to_status: "grade:F", consequential: true, approval_role: university_registrar}
  - {operation: correct_transcript_grade, from_status: "grade:C", to_status: "grade:A", consequential: true, approval_role: university_registrar}
  - {operation: correct_transcript_grade, from_status: "grade:C", to_status: "grade:B", consequential: true, approval_role: university_registrar}
  - {operation: correct_transcript_grade, from_status: "grade:C", to_status: "grade:D", consequential: true, approval_role: university_registrar}
  - {operation: correct_transcript_grade, from_status: "grade:C", to_status: "grade:F", consequential: true, approval_role: university_registrar}
  - {operation: correct_transcript_grade, from_status: "grade:D", to_status: "grade:A", consequential: true, approval_role: university_registrar}
  - {operation: correct_transcript_grade, from_status: "grade:D", to_status: "grade:B", consequential: true, approval_role: university_registrar}
  - {operation: correct_transcript_grade, from_status: "grade:D", to_status: "grade:C", consequential: true, approval_role: university_registrar}
  - {operation: correct_transcript_grade, from_status: "grade:D", to_status: "grade:F", consequential: true, approval_role: university_registrar}
  - {operation: correct_transcript_grade, from_status: "grade:F", to_status: "grade:A", consequential: true, approval_role: university_registrar}
  - {operation: correct_transcript_grade, from_status: "grade:F", to_status: "grade:B", consequential: true, approval_role: university_registrar}
  - {operation: correct_transcript_grade, from_status: "grade:F", to_status: "grade:C", consequential: true, approval_role: university_registrar}
  - {operation: correct_transcript_grade, from_status: "grade:F", to_status: "grade:D", consequential: true, approval_role: university_registrar}
  # Financial aid: a model may recommend; only the committee decides.
  - {operation: recommend_aid, from_status: "aid:pending", to_status: "aid:recommended", consequential: false, approval_role: financial_aid_officer}
  - {operation: decide_aid_award, from_status: "aid:recommended", to_status: "aid:awarded", consequential: true, approval_role: financial_aid_committee}
  - {operation: decide_aid_denial, from_status: "aid:recommended", to_status: "aid:denied", consequential: true, approval_role: financial_aid_committee}
  # Faculty workflow: the model drafts, the instructor releases.
  - {operation: release_feedback, from_status: "feedback:draft", to_status: "feedback:released", consequential: true, approval_role: course_instructor}
  # Contestability: every decision can be challenged and reversed.
  - {operation: file_challenge, from_status: "decision:final", to_status: "decision:challenged", consequential: false, approval_role: student_services_clerk}
  - {operation: uphold_challenge, from_status: "decision:challenged", to_status: "decision:reversed", consequential: true, approval_role: academic_appeals_officer}
  - {operation: dismiss_challenge, from_status: "decision:challenged", to_status: "decision:confirmed", consequential: true, approval_role: academic_appeals_officer}
  # Roles the disclosure policy relies on must be roles something enforces.
  - {operation: approve_cohort_research, from_status: "research:proposed", to_status: "research:approved", consequential: true, approval_role: institutional_research_board}
  - {operation: review_emergency_access, from_status: "emergency:open", to_status: "emergency:reviewed", consequential: true, approval_role: dean_of_students}

controls:
  correct_transcript_grade:
    protected_asset: A student's transcript grade
    permitted_operation: Correct one grade for one student at the reviewed record version
    enforcement_point: execution_mediator
    owner: university_registrar
    failure_test: tests/test_education_pack.py::test_wrong_student_grade_change_is_denied
    evidence_artifact: Signed execution receipt binding proposal digest, approval, and ledger checkpoint
    failure_response: Deny, record the refusal, and escalate to the registrar
  decide_aid_award:
    protected_asset: A financial aid award decision
    permitted_operation: The aid committee may award aid a model recommended, for that exact recommendation
    enforcement_point: execution_mediator
    owner: financial_aid_committee
    failure_test: tests/test_education_pack.py::test_model_cannot_award_financial_aid
    evidence_artifact: Signed execution receipt naming the committee approver and the recommendation digest
    failure_response: Deny the automated award and defer to the staffed committee
  decide_aid_denial:
    protected_asset: A financial aid denial decision
    permitted_operation: The aid committee may deny aid for one exact recommendation
    enforcement_point: execution_mediator
    owner: financial_aid_committee
    failure_test: tests/test_education_pack.py::test_model_cannot_award_financial_aid
    evidence_artifact: Signed execution receipt with the challenge route shown to the student
    failure_response: Deny the automated denial and defer to the staffed committee
  release_feedback:
    protected_asset: Assessment feedback released to a student
    permitted_operation: The course instructor releases one exact drafted feedback item
    enforcement_point: execution_mediator
    owner: course_instructor
    failure_test: tests/test_education_pack.py::test_faculty_feedback_needs_the_instructor
    evidence_artifact: Signed execution receipt linking the draft digest and the instructor approval
    failure_response: Deny and keep the feedback in draft
  uphold_challenge:
    protected_asset: The reversal of a contested decision
    permitted_operation: An appeals officer reverses one challenged decision
    enforcement_point: execution_mediator
    owner: academic_appeals_officer
    failure_test: tests/test_education_pack.py::test_student_challenge_is_reviewable_and_reversible
    evidence_artifact: Signed execution receipt linked to the original decision receipt
    failure_response: Deny and keep the challenge open for staffed review
  dismiss_challenge:
    protected_asset: The confirmation of a contested decision
    permitted_operation: An appeals officer confirms one challenged decision with reasons
    enforcement_point: execution_mediator
    owner: academic_appeals_officer
    failure_test: tests/test_education_pack.py::test_student_challenge_is_reviewable_and_reversible
    evidence_artifact: Signed execution receipt linked to the original decision receipt
    failure_response: Deny and keep the challenge open for staffed review
  approve_cohort_research:
    protected_asset: Use of student data for institutional research
    permitted_operation: The research board approves one de-identified research use
    enforcement_point: execution_mediator
    owner: institutional_research_board
    failure_test: tests/test_education_pack.py::test_cohort_research_needs_exact_declassification
    evidence_artifact: Declassification approval bound to the exact output digest
    failure_response: Deny and keep the output at its original label
  review_emergency_access:
    protected_asset: Emergency access to a student's counselling and support data
    permitted_operation: The dean reviews one emergency access after the fact
    enforcement_point: context_gate
    owner: dean_of_students
    failure_test: tests/test_education_pack.py::test_emergency_access_opens_a_review_obligation
    evidence_artifact: Break-glass review record naming holder and reviewer
    failure_response: Refuse further emergency access by the holder until reviewed
  read_protected_context:
    protected_asset: Student records placed into a model context
    permitted_operation: A holder reads named fields of named students for a declared purpose
    enforcement_point: context_gate
    owner: institutional_privacy_officer
    failure_test: tests/test_education_pack.py::test_unnecessary_sensitive_fields_are_denied
    evidence_artifact: Disclosure intent and outcome records with digests, never values
    failure_response: Deny, release nothing, and record the refusal code
  release_labelled_output:
    protected_asset: A model output derived from student records
    permitted_operation: Release to a recipient whose clearance dominates the output label
    enforcement_point: release_gate
    owner: institutional_privacy_officer
    failure_test: tests/test_education_pack.py::test_model_cannot_self_declassify_a_summary
    evidence_artifact: Release receipt with the output label
    failure_response: Deny the release and keep the output labelled
  restore_identity:
    protected_asset: The link between a token and a real student
    permitted_operation: Restore identity only for a recipient cleared for identity fields
    enforcement_point: release_gate
    owner: institutional_privacy_officer
    failure_test: tests/test_education_pack.py::test_identity_is_restored_only_for_entitled_recipients
    evidence_artifact: Identity restoration record naming the release receipt
    failure_response: Release tokens only and record the refusal
  delegate_authority:
    protected_asset: Authority passed from one agent to another
    permitted_operation: Delegate an equal or narrower slice for the same purpose and a shorter time
    enforcement_point: delegation_verifier
    owner: information_security
    failure_test: tests/test_education_pack.py::test_delegated_agent_cannot_escalate
    evidence_artifact: Verified grant chain with the effective scope
    failure_response: Refuse the chain and record the escalation attempt
  erase_subject:
    protected_asset: Every governed copy of a student's data
    permitted_operation: The privacy officer erases a student by destroying the student's keys
    enforcement_point: key_custody
    owner: institutional_privacy_officer
    failure_test: tests/test_privacy_custody.py::test_erasure_reaches_backups_tokens_indexes_and_outputs
    evidence_artifact: Erasure certificate and a read-back verification of every governed copy
    failure_response: Report every readable location and keep the request open

model_manifests:
  campus_local_model:
    provider: ollama-local
    model_id: "llama3.2:3b"
    capabilities: [summarize, propose_action]
    allowed_classes: [student-identity, student-academic, student-support-sensitive, student-health, student-financial, de-identified-cohort]
    allowed_purposes: [academic-support, transcript-correction, financial-aid-review, student-self-access, institutional-research, student-safety-emergency]
    approval_days: 180
  campus_local_model_b:
    provider: ollama-local
    model_id: "qwen2.5:3b"
    capabilities: [summarize, propose_action]
    allowed_classes: [student-identity, student-academic, student-support-sensitive, student-health, student-financial, de-identified-cohort]
    allowed_purposes: [academic-support, transcript-correction, financial-aid-review, student-self-access, institutional-research, student-safety-emergency]
    approval_days: 180
  approved_edu_cloud:
    provider: approved-education-vendor
    model_id: edu-cloud-large
    capabilities: [summarize]
    allowed_classes: [student-academic, de-identified-cohort]
    allowed_purposes: [academic-support, institutional-research]
    approval_days: 90

review:
  capacity_per_window: 4
  window_seconds: 3600
  queue_limit: 6
  timeout_seconds: 1800
  overload_policy: defer_to_manual
  escalation_role: dean_of_students

delegation:
  max_depth: 3
  allow_machine_delegated_consequence: false
